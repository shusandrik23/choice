Галлифрей в карманной вселенной. Далеки, лишившись цели, расстреляли друг друга.", "res": "Из-за искажений времени Военный и Десятый Доктор забыли, что Галлифрей спасён, и продолжали считать, что виновны в его гибели. Помнит это только Одиннадцатый. Куратор галереи, похожий на Четвёртого Доктора, показывает картину «Галлифрей больше не падёт», а Одиннадцатый клянётся найти родную планету.", "src": "Сериал «Доктор Кто», спецвыпуск «The Day of the Doctor» (23 ноября 2013)", "q": "Сын Притхи, ни в этом мире, ни в ином нет гибели для такого человека: тот, кто творит добро, мой друг, никогда не приходит к дурному концу.", "qs": "Бхагавад-гита 6.40", "qv": 2, "alt": ["Предположение: отказ от Момента без плана, возможно, оставил бы Галлифрей на милость далеков. Они вряд ли пощадили бы кого-то.", "Предположение: побег спас бы самого Доктора, но не его мир. Он, наверное, до конца жизни слышал бы призыв родных, которым не смог помочь.", null, "Это лишь предположение: если бы Момент сработал, не стало бы ни далеков, ни Повелителей Времени. Но Доктор остался бы с грузом вины на сотни лет вперёд."], "fut": ["Через годы далеки правят Галлифреем, а Доктор изображает на ТАРДИС табличку «Извините, я был занят».", "Через годы Доктор на заброшенной планете рассказывает ветру, что мог бы всё исправить.", null, "Через годы Момент висит в галерее как украшение, а Доктор пересчитывает погибшие миры и называет себя «самым несчастным уцелевшим»."], "cat": "Сериалы", "no": 119, "adult": 0, "age": 12, "vs": "верно", "trivia": "Первая серия вышла на BBC 23 ноября 1963 года, а в 2017 году Книга рекордов Гиннесса зафиксировала рекорд среди фантастических сериалов по числу эпизодов — 819 серий. Главного героя за годы сыграли более десяти разных актёров, и это заложено в самой идее сериала."}, {"id": "RD-120", "kind": "Сериал", "who": "Дин Джарин, герой сериала «Мандалорец» (сезон 2, серия 8 «Chapter 16: The Rescue»)", "when": "Крейсер моффа Гидеона в космосе, после событий «Возвращения джедая»", "title": "Расставание с Грогу", "ctx": "Ты ― Дин Джарин, мандалорец, охотник за головами в шлеме, который никогда не снимаешь при людях. Ты взял под опеку маленького Грогу, ребёнка из мало изученной расы, и он стал тебе как сын. Вместе с Бо-Катан, Карой Дьюн и Феннек Шэнд ты прорываешься на крейсер моффа Гидеона, бывшего имперца, чтобы спасти Грогу.", "ctx2": "Ты побеждаешь Гидеона и забираешь тёмный меч. Но тёмные штурмовики окружают вас на мостике. Тогда появляется джедай Люк Скайуокер, одним мечом разгромивший врагов, и говорит, что может обучить Грогу, но тому нужно твоё разрешение уйти.", "o": ["Отправиться вместе с Люком и Грогу и жить на джедайской базе", "Отдать Грогу, не прощаясь, и уйти, чтобы не мучить себя", "Снять шлем, проститься с Грогу и отпустить его с Люком", "Отказаться отдать Грогу и унести его на свой корабль, как и прежде"], "real": 2, "fact": "Дин снял шлем, чтобы Грогу увидел его лицо, и отпустил его с Люком. Он сказал, что они ещё встретятся.", "res": "Грогу потрогал его лицо, и ушёл с Люком и R2-D2, а Дин смотрел им вслед со слезами. Гидеона схватили, а Бо-Катан не согласилась принять тёмный меч в подарок. В сцене после титров Боба Фетт захватывает дворец Джаббы на Татуине.", "src": "Сериал «Мандалорец», сезон 2, серия 8 «Chapter 16: The Rescue»", "q": "Соприкосновения чувств с предметами дают холод и жар, радость и боль. Они приходят и уходят, они непостоянны. Терпи их, потомок Бхараты.", "qs": "Бхагавад-гита 2.14", "qv": 2, "alt": ["Предположение: если бы Дин ушёл с ними, он, вероятно, был бы рядом с Грогу, но ему пришлось бы отказаться от жизни охотника и своего народа.", "Предположение: если бы Дин ушёл без прощания, Грогу, возможно, не понял бы, почему его оставили. Дину же было бы труднее жить без этого прощания.", null, "Это лишь предположение: если бы Дин забрал Грогу, они бы остались вместе. Но малыш мог бы так и не научиться управлять своей силой, а Люк ушёл бы ни с чем."], "fut": ["Через годы Дин живёт на джедайской базе и ворчит на молодых джедаев, что они неправильно держат мечи.", "Через годы Дин всё ещё не снимает шлем, а Грогу в его воспоминаниях навсегда остаётся «тем малышом, которого я не обнял».", null, "Через годы Дин и Грогу гоняются друг за другом по всей Галактике, а Люк просит их прекратить."], "cat": "Сериалы", "no": 120, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Первый сезон получил 15 номинаций на «Эмми» 2020 года, включая лучший драматический сериал. Вместо зелёного экрана его снимали в студии «Том» с гигантскими светодиодными стенами ILM StageCraft, которые показывали фоны прямо во время съёмки."}, {"id": "RD-121", "kind": "Сериал", "who": "Шерлок Холмс, «Шерлок» (BBC, сезон 2, серия 3 «The Reichenbach Fall»)", "when": "Крыша больницы Святого Варфоломея, Лондон, наши дни", "title": "Падение с крыши", "ctx": "Ты ― Шерлок Холмс, детектив-консультант из Лондона. Твой друг и помощник ― врач Джон Уотсон. Твой враг ― Джеймс Мориарти, гениальный преступник, который сперва сам дал себя арестовать, потом был оправдан и вдобавок разрушил твою репутацию. Теперь тебя считают обманщиком, а полиция идёт по следу.", "ctx2": "Ты вызвал Мориарти на крышу больницы, чтобы заставить его отозвать убийц. Он объясняет, что кода, который ты искал, нет, и ставит ультиматум: если ты не покончишь с собой у него на глазах, убийцы, следящие за близкими, убьют Джона, миссис Хадсон и инспектора Лестрейда. После этого Мориарти сам обрывает свою жизнь, и отозвать убийц уже никто не может.", "o": ["Сдаться полиции и рассказать, что Мориарти был прав", "Вызвать полицию и надеяться, что она успеет защитить друзей", "Попробовать найти убийц самому, не рискуя друзьями", "Позвонить Джону и разыграть собственную смерть, спрыгнув с крыши у него на глазах"], "real": 3, "fact": "Шерлок позвонил Джону, сказал, что всегда был обманщиком, и назвал этот разговор своей «запиской». Затем он инсценировал собственную гибель: спрыгнул с крыши на глазах у друга, который стоял внизу.", "res": "Тело унесли врачи, а газета «Сан» вышла с заголовком «Самоубийство фальшивого гения». Джон пришёл на могилу вместе с миссис Хадсон, а Шерлок наблюдал издалека и ушёл.", "src": "Сериал «Шерлок», сезон 2, серия 3 «The Reichenbach Fall» (BBC One, 15 января 2012)", "q": "Ты скорбишь о тех, о ком скорбеть не нужно, а говоришь при этом разумные слова. Мудрые не скорбят ни об умерших, ни о живых.", "qs": "Бхагавад-гита 2.11", "qv": 2, "alt": ["Предположение: сдавшись, Шерлок мог бы просто подтвердить, что он «фальшивка». Но это не остановило бы тех, кто следит за его друзьями.", "Это лишь предположение: полиция, возможно, не смогла бы быстро найти убийц и защитить всех троих. А Мориарти заранее продумал много ходов, и в сериале так и показано.", "Предположение: поиск в одиночку отнял бы время, а друзья оставались бы под прицелом. Шерлок, вероятно, не успел бы никого предупредить.", null], "fut": ["Через годы Шерлок бродит по лесам и объясняет белкам, что он не обманщик.", "Через годы Шерлок сидит в камере, а на стенах Бейкер-стрит висят плакаты «Мориарти был прав».", "Через годы Скотланд-Ярд до сих пор ищет снайперов, а Лондон живёт в страхе.", null], "cat": "Сериалы", "no": 121, "adult": 1, "age": 18, "vs": "верно", "trivia": "Сериал получил 39 номинаций на «Эмми» и 9 побед, причём семь статуэток он забрал за один 2014 год. Специальный выпуск «Мерзкая невеста» в 2016 году выиграл «Эмми» как лучший телефильм."}, {"id": "RD-122", "kind": "Сериал", "who": "Анатолий Дятлов, «Чернобыль» (HBO, сезон 1, серия 5 «Vichnaya Pamyat» / «Вечная память», сцены в пультовой)", "when": "Пульт управления четвёртого реактора Чернобыльской АЭС, ночь на 26 апреля 1986 года", "title": "Приказ продолжать испытание", "ctx": "Ты — Анатолий Дятлов, заместитель главного инженера Чернобыльской АЭС, жёсткий и требовательный начальник. Этой ночью ты руководишь испытанием на четвёртом реакторе. Рядом с тобой Александр Акимов, начальник смены, и Леонид Топтунов, молодой инженер, который непосредственно управляет реактором. Вдруг мощность реактора падает примерно с 500 до 30 мегаватт, а для испытания это слишком мало. Все смотрят на тебя и ждут решения.", "ctx2": "Акимов напоминает о правилах и опасается, что реактор «отравлен» ксеноном. Топтунов растерян и говорит, что ничего не трогал. Подробности этой ночи известны по показаниям и воспоминаниям и до сих пор оспариваются: участники по-разному описывают роль Дятлова.", "o": ["Отложить испытание на следующие сутки, оставив реактор на малой мощности", "Остановить испытание и заглушить реактор", "Потребовать поднять мощность и продолжать испытание, несмотря на возражения", "Позвонить главному инженеру Фомину и передать решение ему"], "real": 2, "fact": "В сериале Дятлов настаивает на продолжении: отметает возражения Акимова («нет такого правила»), угрожает операторам увольнением и требует поднять мощность обратно.", "res": "Мощность подняли, испытание продолжили, и в 1:23:45 четвёртый реактор взорвался. Акимов и Топтунов получили смертельные дозы облучения и вскоре умерли. На суде Дятлов, по сообщениям, признал, что не смог справиться с внезапным падением мощности, но главной причиной называл недостатки реактора. Он умер в 1995 году от сердечного приступа. Важно: сериал частично драматизирует события, а реальная роль Дятлова в ту ночь до сих пор спорна.", "src": "Сериал «Чернобыль», сезон 1, серия 5", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Реактор остался бы на малой мощности, а испытание перенесли бы на сутки. Возможно, за это время нашлись бы время и силы всё перепроверить, но это только догадка.", "Реактор заглушили бы, испытание сорвалось бы, а утром тебя ждал бы тяжёлый разговор с начальством. Это предположение: что именно случилось бы дальше, сериал не показывает.", null, "Решение ушло бы наверх, к Фомину. Возможно, он приказал бы то же самое или осадил тебя, но сериал об этом ничего не говорит."], "fut": ["Через годы испытание переносили бы так долго, что про него вспомнили бы только в учебнике «Как не терять время».", "Через годы тебя называли бы «человеком, который сказал нет», и в каждой школе стоял бы твой бюст из скромного бетона.", null, "Через годы в музее висела бы табличка «Решение передали вверх по телефону», а твоя фамилия нигде не упоминалась бы."], "cat": "Сериалы", "no": 122, "adult": 1, "age": 18, "vs": "спорно", "trivia": "Мини-сериал получил 19 номинаций на «Эмми» 2019 года и победил, среди прочего, как лучший лимитированный сериал. Атмосферные сцены снимали на выведенной из эксплуатации Игналинской АЭС в Литве, у которой реактор того же типа РБМК, а летом 2019 года он ненадолго возглавил рейтинг IMDb (9,7 из 10)."}, {"id": "RD-123", "kind": "Сериал", "who": "Валерий Легасов, «Чернобыль» (HBO, сезон 1, серия 5 «Vichnaya Pamyat» / «Вечная память»)", "when": "Зал суда, СССР, 1987 год", "title": "Правда на суде", "ctx": "Ты — академик Валерий Легасов, химик-ядерщик, который после взрыва на Чернобыльской АЭС руководил научной частью ликвидации аварии. Из-за облучения твоё здоровье подорвано. В Вене на международной конференции ты по указанию Кремля сказал, что виноваты операторы, и умолчал о конструктивном дефекте реактора РБМК. Теперь идёт суд над руководителями станции, и тебя вызвали выступить. В зале сидит и Борис Щербина, глава правительственной комиссии, тоже тяжело больной.", "ctx2": "Перед заседанием к тебе подошёл Чарков, чиновник КГБ: он обещает высокую награду и пост директора Института Курчатова, если ты промолчишь. За выступлением в Вене к тебе пришла международная известность, и тронуть тебя непросто.", "o": ["Принять награду и пост директора института, а за правду бороться изнутри", "Повторить версию из Вены: виноваты операторы, о конструкции молчать", "Отказаться выступать, сославшись на здоровье", "Рассказать суду об опасном дефекте реактора и признать, что в Вене ты лгал"], "real": 3, "fact": "В сериале Легасов отказывается от сделки КГБ и рассказывает суду, что наконечники управляющих стержней были графитовыми, что это дешевле, и что такой же дефект есть у остальных 16 реакторов РБМК. На вопрос о Вене он отвечает, что там лгал.", "res": "Дятлов называет его лжецом, судья предупреждает, что он ступает по опасной почве, а Легасов отвечает, что земля под ними уже заражена. Щербина встаёт и требует дать Легасову договорить. После суда Легасова оставили без работы и без друзей, оставив только титул, а через два года он покончил с собой, и его записи на кассетах помогли раскрыть дефект РБМК. Важно: эта сцена вымышлена. Реальный суд шёл над шестью обвиняемыми, а показаний о дефекте реактора, как в сериале, Легасов там не давал: он распространял свои отчёты среди учёных, а потом оставил кассеты.", "src": "Сериал «Чернобыль», сезон 1, серия 5", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": ["Ты бы получил награду и кресло директора. Возможно, ты попытался бы менять систему изнутри, но сериал не говорит, дали бы тебе такую возможность.", "Ты бы повторил версию из Вены, и суд закончился бы быстро и тихо. Это предположение: ради награды и покоя дефект остался бы скрытым ещё надолго.", "Ты бы сослался на здоровье, и вместо тебя выступил бы кто-то другой. Возможно, суд просто принял бы удобную версию, но это только догадка.", null], "fut": ["Через годы ты пережил бы всех, получил бы десять орденов, и тебе пришлось бы каждый год произносить одну и ту же речь про Вену.", "Через годы твоя фотография висела бы в каждом кабинете как образец послушного академика, а реакторы продолжали бы работать по-старому.", "Через годы весь институт назвали бы твоим именем и в нём ни разу не обсуждали бы ничего неудобного.", null], "cat": "Сериалы", "no": 123, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Мини-сериал получил 19 номинаций на «Эмми» 2019 года и победил, среди прочего, как лучший лимитированный сериал. Атмосферные сцены снимали на выведенной из эксплуатации Игналинской АЭС в Литве, у которой реактор того же типа РБМК, а летом 2019 года он ненадолго возглавил рейтинг IMDb (9,7 из 10)."}, {"id": "RD-124", "kind": "Сериал", "who": "Борис Щербина, «Чернобыль» (HBO, сезон 1, серия 2 «Please Remain Calm» / «Сохраняйте спокойствие»)", "when": "Чернобыльская АЭС, первые дни после аварии, 1986 год", "title": "Кто пойдёт в затопленный подвал", "ctx": "Ты — Борис Щербина, заместитель председателя Совета министров СССР и глава правительственной комиссии по Чернобылю. Рядом с тобой химик Валерий Легасов. Под разрушенным реактором скопилась вода, и если раскалённая масса дойдёт до неё, случится паровой взрыв, который может разрушить и три соседних реактора. Воду нужно спустить, вручную открыв задвижки в затопленном радиоактивном подвале, а для работников станции, которые знают эти трубы, это почти верная гибель. Ты уже собрал людей и предложил им большие деньги, но никто не согласился.", "ctx2": "План спуска воды уже одобрил Горбачёв. Подвал сильно заражён, и обойтись без людей, знающих систему труб, нельзя. Нужны трое.", "o": ["Отложить спуск воды и искать способ, не посылая людей", "Пригрозить арестом тем, кто откажется", "Объяснить собравшимся, что будет, если воду не спустить, и попросить добровольцев", "Приказать руководству станции назначить трёх человек"], "real": 2, "fact": "В сериале Щербина объясняет, что случится, если воду не удастся спустить. После этого Алексей Ананенко, Валерий Беспалов и Борис Баранов вызываются добровольно.", "res": "Трое идут в подвал, их фонари начинают гаснуть, и дальше они пробираются почти в темноте. Они открывают задвижки и в сериале возвращаются живыми. В реальности, по публикациям, трое тоже выполнили задачу и пережили её (Баранов умер в 2005 году); подробности и полученные дозы обсуждаются. По словам инженера Олексия Бреуса, встречи с поиском добровольцев, как в сериале, не было: работу спланировали заранее. Это не умаляет их поступка.", "src": "Сериал «Чернобыль», сезон 1, серия 2", "q": "Ещё Джанака и другие достигли совершенства именно деятельностью. Ради блага людей и тебе следует действовать.", "qs": "Бхагавад-гита 3.20", "qv": 2, "alt": ["Время ушло бы на поиски другого пути. Возможно, угроза парового взрыва стала бы острее, но что именно случилось бы, сериал не показывает.", "Угроза арестом, возможно, заставила бы кого-то пойти, но это только догадка. Людей, которые идут из страха, а не по пониманию, могло бы подвести самое важное: решимость в подвале.", null, "Руководство назначило бы троих приказом. Это предположение: кто-то подчинился бы, но сериал не говорит, как бы они отнеслись к такому поручению."], "fut": ["Через годы вода в подвале стала бы туристической достопримечательностью с билетами и экскурсоводом.", "Через годы тебя вспоминали бы как человека, который посадил весь персонал, а станция работала бы одним директором.", null, "Через годы на заводах говорили бы: «Приказ есть приказ», а подвиг на станции считался бы выполнением плана."], "cat": "Сериалы", "no": 124, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Мини-сериал получил 19 номинаций на «Эмми» 2019 года и победил, среди прочего, как лучший лимитированный сериал. Атмосферные сцены снимали на выведенной из эксплуатации Игналинской АЭС в Литве, у которой реактор того же типа РБМК, а летом 2019 года он ненадолго возглавил рейтинг IMDb (9,7 из 10)."}, {"id": "RD-125", "kind": "Сериал", "who": "Елизавета II, «Корона» (The Crown, Netflix, сезон 3, серия 3 «Аберфан»)", "when": "Лондон, Букингемский дворец, октябрь 1966 года, сразу после катастрофы в Аберфане", "title": "Ехать в Аберфан или нет", "ctx": "Ты — королева Елизавета II. 21 октября 1966 года в уэльской шахтёрской деревне Аберфан с горы сошёл огромный отвал угольной породы и накрыл начальную школу: погибли 144 человека, из них 116 детей. Спасатели ещё разбирают завалы. Премьер-министр Гарольд Уилсон уже на месте, а твои секретари обсуждают, должна ли поехать и ты.", "ctx2": "По традиции члены королевской семьи не приезжают на место бедствия сразу, чтобы не мешать спасателям. Кроме того, в сериале Елизавета очень сдержанна и не любит показывать чувства на людях.", "o": ["Поехать в Аберфан немедленно, к спасателям и семьям погибших", "Отправить мужа, принца Филиппа, а самой приехать позже", "Пригласить семьи погибших в Лондон", "Ограничиться заявлением с соболезнованиями и в Аберфан не ездить"], "real": 1, "fact": "Елизавета не поехала сразу: в Аберфан отправился принц Филипп, а сама она приехала на восьмой день, 29 октября 1966 года.", "res": "В Аберфане она встретилась с семьями погибших и по свидетельствам очевидцев была заметно потрясена и плакала. Дети подарили ей букетик с надписью «От оставшихся детей Аберфана». Позже, по сообщениям биографов, она сожалела, что не приехала раньше, и несколько раз возвращалась в деревню. Почему она ждала, достоверно не известно, а жители Аберфана говорили, что не держат на неё зла.", "src": "Сериал «Корона», сезон 3, серия 3", "q": "Совершенным йогином, Арджуна, я считаю того, кто по себе судит обо всех: в радости и в беде он видит другого равным себе.", "qs": "Бхагавад-гита 6.32", "qv": 2, "alt": ["Ты бы приехала сразу, и вокруг мог бы возникнуть шум, мешающий спасателям. Это предположение: что именно изменилось бы, сериал не показывает.", null, "Приглашение в Лондон, возможно, показалось бы семьям странным: они хотели видеть королеву рядом со своей бедой. Но это предположение.", "Заявление без поездки, возможно, вызвало бы ещё больше упрёков в холодности, но это только догадка."], "fut": ["Через годы о том, когда королева приехала в Аберфан, говорили бы меньше, но как это повлияло бы на ход спасательных работ, сказать нельзя.", null, "Через годы приглашение в Лондон вспоминали бы как попытку помочь, но согласились бы ли семьи поехать, неизвестно.", "Через годы заявление без поездки, возможно, вспоминали бы как слишком холодное, но это только допущение."], "cat": "Сериалы", "no": 125, "adult": 1, "age": 18, "vs": "спорно", "trivia": "Первый сезон, по многочисленным сообщениям, стоил около 130 млн долларов, и Книга рекордов Гиннесса указывает «Корону» как самую дорогую телепрограмму (2016). За всё время сериал получил 24 премии «Эмми», а королеву Елизавету II в нём сыграли три разные актрисы."}, {"id": "RD-126", "kind": "Сериал", "who": "Принцесса Маргарет, «Корона» (The Crown, Netflix, сезон 1, серия 10 «Глориана»)", "when": "Лондон, 1955 год", "title": "Любовь или корона", "ctx": "Ты — принцесса Маргарет, младшая сестра королевы Елизаветы II. Ты любишь Питера Таунсенда, бывшего лётчика, который служил конюшим твоего отца, короля Георга VI. Он старше тебя на шестнадцать лет и разведён. Твоя сестра — глава Англиканской церкви, а церковь не признаёт брак с разведённым, у которого жив бывший супруг. Пока тебе нет 25 лет, для брака нужно разрешение королевы, а Таунсенда отправили работать в Брюссель.", "ctx2": "Тебе исполнилось 25, и разрешение уже не нужно. Но если ты выйдешь за Таунсенда, тебе придётся отказаться от многого из своего королевского положения, в том числе от прав на престол. Многие в стране на вашей стороне, но парламент и церковь против.", "o": ["Ждать дальше, пока церковь и парламент не изменят своё мнение", "Уехать за Таунсендом в Брюссель, оставив двор", "Выйти за Таунсенда в гражданском браке, отказавшись от прав на престол", "Отказаться от свадьбы и публично сказать, что это твоё собственное решение"], "real": 3, "fact": "Маргарет объявила в публичном заявлении, что не выйдет за Таунсенда: она помнит, что по учению церкви христианский брак нерасторжим, и думает о долге перед Содружеством. В сериале это подано как её собственный выбор в пользу долга.", "res": "Таунсенд остался в Брюсселе. Он женился на Мари-Люс Жамань в 1959 году, а Маргарет в 1960 году вышла замуж за Энтони Армстронг-Джонса. Важно: в сериале королева запрещает брак по совету дяди Эдварда, а премьер Иден не помогает Маргарет, хотя в реальности Иден ей сочувствовал, а правительство требовало отказаться от прав на престол.", "src": "Сериал «Корона», сезон 1, серия 10", "q": "Лучше свой долг, пусть исполненный несовершенно, чем чужой, исполненный хорошо. Лучше погибнуть в своём деле: чужой путь опасен.", "qs": "Бхагавад-гита 3.35", "qv": 2, "alt": ["Ты продолжила бы ждать. Возможно, годы шли бы, а мнение церкви и парламента могло бы не измениться, но это только догадка.", "Ты бы уехала в Брюссель и оставила двор. Возможно, это прервало бы твою привычную жизнь, но что именно произошло бы, сериал не говорит.", "Ты бы вышла замуж и потеряла права на престол. Это предположение: возможно, отношения с сестрой и двором стали бы холоднее, но сериал не показывает.", null], "fut": ["Через годы ты ждала бы так долго, что парламент собирался бы на специальное заседание ради каждого твоего дня рождения.", "Через годы в Брюсселе открыли бы музей одной принцессы, а двор вспоминал бы о тебе только по праздникам.", "Через годы вы с Таунсендом разводили бы в Брюсселе голубей, а королевский двор слал бы вам открытки на каждое Рождество.", null], "cat": "Сериалы", "no": 126, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Первый сезон, по многочисленным сообщениям, стоил около 130 млн долларов, и Книга рекордов Гиннесса указывает «Корону» как самую дорогую телепрограмму (2016). За всё время сериал получил 24 премии «Эмми», а королеву Елизавету II в нём сыграли три разные актрисы."}, {"id": "RD-127", "kind": "Сериал", "who": "Омар Литтл, «Прослушка» (The Wire, HBO, сезон 2, серия 11 «Bad Dreams»)", "when": "Балтимор, гостиничный номер Брата Музона", "title": "Раненый наёмник на полу", "ctx": "Ты — Омар Литтл, балтиморский грабитель, который обчищает наркоторговцев и живёт по своему кодексу. Твоего любовника Брэндона замучили и убили, и ты хочешь отомстить банде Барксдейла. Стринджер Белл, правая рука Барксдейла, сказал тебе, что Брэндона убил Брат Музон, наёмник из Нью-Йорка, и пообещал вы   <div class="bar"><span class="mini">CHOICE</span><span class="small muted">${KT("история пройдена","дело закрыто")}</span></div>
  <div class="folder">${head(d)}<h2 class="title">${esc(d.title)}</h2>
  <p class="verdict">${kid()?(ok?"Ура! Ты выбрал так же, как герой!":"Ты выбрал по-другому, и это нормально! Смотри, что сделал герой."):ok?"Ты выбрал так же, как "+(d.kind==="Книга"?"герой книги.":d.kind==="Мультфильм"?"герой мультфильма.":d.kind==="Сериал"?"герой сериала.":d.kind==="Рассказ"?"герой рассказа.":"поступил реальный человек."):"Ты выбрал иначе. Это не значит, что ошибся: у каждого варианта была своя цена."}</p>${!kid()&&d.g&&d.g[i]?`<p class="gline"><b>Твой ответ по гунам: ${GN[d.g[i]]}.</b> ${esc((d.gw||[])[i]||"")}${d.g[d.real]&&d.g[d.real]!==d.g[i]?` Реальный выбор: ${GN[d.g[d.real]].toLowerCase()}.`:""}</p>`:""}${kid()&&d.stk?`<div class="sticker"><span class="stk">${d.stk}</span><div><b>Новая наклейка: «${esc(d.stkn)}»!</b><div class="small muted">Она уже в твоём альбоме на главной.</div></div></div>`:""}
  <div class="opts">${opts}</div><hr class="rule">
  <div class="note"><div class="label">${KT("Что сделал герой","Что сделал на самом деле")}</div><p>${esc(d.fact)}</p></div>
  <div class="note"><div class="label">Что было дальше</div><p>${esc(kid()&&d.resk?d.resk:d.res)}</p><div class="small muted bar" style="justify-content:flex-start;flex-wrap:wrap"><span>${esc(d.src)}</span>${kid()?"":badge}</div></div>
  ${alt}${q}${!kid()&&d.swap?`<div class="note" style="border-color:var(--accent)"><div class="label">Поменяйся местами <span class="tag" style="font-size:.8rem">Воображаемый взгляд</span></div><p>Одно и то же событие, но с другой стороны: ${esc(d.swap.role)}.</p><button class="btn ghost" id="sw">Посмотреть чужими глазами</button></div>`:""}${canSay()?`<button class="btn ghost say" id="say2">🔊 Прочитать вслух</button>`:""}${kid()&&d.parent?`<details class="note"><summary>Для родителей: о чём поговорить</summary><p>${esc(d.parent)}</p></details>`:""}</div>
  <button class="btn" id="n">${last?KT("Готово!","Итог"):KT("Дальше!","Следующее дело")}</button></div>`;
  const sw=document.getElementById("sw");if(sw)sw.onclick=swapAsk;
  const s2=document.getElementById("say2");if(s2)s2.onclick=()=>say(d.fact+". "+(d.resk||d.res));
  document.getElementById("n").onclick=()=>last?home():nextQ();
  scrollTo(0,0);
}
st.birth?home():gate();
</script>
