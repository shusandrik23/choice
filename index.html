анцисканец в блоке 14 Освенцима. В июле 1941 года из блока сбежал заключённый. Заместитель коменданта Фрич обходит строй и выбирает десять человек для голодной камеры. Один из выбранных, Франциск Гаевничек, кричит о жене и детях.", "adult": 1, "vs": "исправлено", "age": 18}, {"id": "RD-032", "kind": "Жизнь", "who": "Дитрих Бонхёффер, пастор и богослов", "when": "июнь 1939", "title": "Вернуться в Германию", "ctx": "Ты в Нью-Йорке, коллеги нашли тебе работу и безопасное место. В Германии нацисты, твоя церковь под давлением, началась подготовка к войне. Тебя могут призвать в армию, а отказ грозит казнью.", "o": ["Остаться в США и работать, поддерживая церковь издалека.", "Вернуться в Германию и разделить судьбу своего народа.", "Вернуться и принять службу капелланом.", "Перебраться в Англию и действовать оттуда."], "real": 1, "fact": "Бонхёффер через несколько недель вернулся, написав, что без разделения испытаний не имеет права участвовать в восстановлении жизни церкви после войны.", "res": "Он связался с кругом заговорщиков, в 1943 был арестован и 9 апреля 1945 повешен в лагере Флоссенбюрг, за несколько недель до конца войны.", "src": "Письма и биографии Бонхёффера", "q": "Ещё Джанака и другие достигли совершенства именно деятельностью. Ради блага людей и тебе следует действовать.", "qs": "Бхагавад-гита 3.20", "qv": 2, "alt": ["Ты остаёшься в США и поддерживаешь церковь на расстоянии. Выступаешь, пишешь, но среди своих в Германии тебя считают тем, кто уехал.", null, "Служба капелланом связывает тебя с армией. Ты исполняешь приказы, которые считаешь безнравственными, или отказываешься и идёшь под суд.", "Из Англии ты ведёшь дела церкви по почте. Связь рвётся с началом войны, и работа сводится к редким письмам."], "fut": ["Ты остаёшься в США. Через двадцать лет ты уважаемый профессор, но в Германии тебя вспоминают как человека, который уехал.", null, "Ты принимаешь капелланскую службу. Через два года ты в форме, о которой мечтал бы не говорить.", "Ты в Англии, письма идут неделями. К 1943 переписка прерывается, а «Этика» остаётся ненаписанной."], "cat": "Совесть и мужество", "no": 32, "ctx2": "В июне 1939 года ты приехал в Нью-Йорк по приглашению Теологической семинарии. В Германии ты член Исповедующей церкви и противник режима. Друзья в США советуют остаться.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "S", "T", "R"], "gw": ["Желание безопасности и удобства, сохранение положения", "Долг и верность народу и церкви, без привязки к исходу", "Подчинение системе, слепое согласие на службу", "Расчёт на влияние и безопасность, действие из удобного места"]}, {"id": "RD-033", "kind": "Жизнь", "who": "Ирена Сендлер, социальная работница", "when": "октябрь 1943", "title": "Молчать под пытками", "ctx": "Ты помогала вывозить еврейских детей из Варшавского гетто и записывала имена, чтобы потом вернуть их семьям. Тебя арестовало гестапо. Следователи требуют назвать сообщников и места, где спрятаны списки.", "o": ["Назвать имена, чтобы прекратить пытки.", "Назвать только мёртвых.", "Назвать вымышленные имена.", "Молчать и не называть никого."], "real": 3, "fact": "Сендлер не выдала никого. Её приговорили к расстрелу, но подпольщики подкупили охрану, и в день казни её вывели из тюрьмы.", "res": "Списки были спрятаны. По традиционной оценке, Сендлер и её соратники помогли спасти около 2500 детей; современные историки называют меньшие числа. Многих детей удалось позже найти. Она жила скромно и до старости не считала себя героиней и говорила, что могла сделать больше.", "src": "Яд ва-Шем, биографические источники", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": ["Имена названы, и дети оказываются под угрозой. Часть семей арестована, а списки найдены, но боль останется навсегда.", "Только мёртвые имена звучат убедительно один день. Потом гестапо замечает странность и возвращается с новыми вопросами.", "Вымышленные имена быстро проверяют и разоблачают. Следователь понимает обман, и допрос становится жёстче.", null], "cat": "Совесть и мужество", "no": 33, "ctx2": "Ты работаешь в Варшаве по поддельным документам под псевдонимом «Иоланта», связана с подпольем «Жегота». По традиционной оценке, твоя сеть помогла вывезти около двух с половиной тысяч детей. Имена и новые адреса ты записала в списки и зарыла в банках.", "adult": 1, "vs": "спорно", "age": 18}, {"id": "RD-034", "kind": "Жизнь", "who": "Тиунэ Сугихара, японский вице-консул", "when": "июль–август 1940", "title": "Визы без разрешения", "ctx": "Ты вице-консул Японии в Каунасе. К консульству приходят тысячи беглецов-евреев. Токио трижды отказывает в выдаче транзитных виз без выполнения условий. Выдача виз в обход приказа может стоить тебе карьеры.", "o": ["Выдавать визы вопреки приказу.", "Подать в отставку и уехать.", "Выдать визы только нескольким известным людям.", "Выполнить приказ и отправить людей ни с чем."], "real": 0, "fact": "Сугихара принял решение выдавать визы самостоятельно и писал их от руки по восемнадцать-двадцать часов в сутки, около двух тысяч документов.", "res": "Спасённых вместе с семьями называют около шести тысяч. После войны Сугихару уволили из МИДа, он перебивался работой. Признание пришло лишь в 1980-х.", "src": "Яд ва-Шем, воспоминания спасённых", "q": "Кто ни к кому не питает вражды, дружелюбен и сострадателен, не говорит «моё» и «я», ровен в радости и в беде, терпелив, всегда доволен, собран, обуздан и твёрд в решимости, а ум и рассудок отдал Мне, тот Мне дорог.", "qs": "Бхагавад-гита 12.13–14", "qv": 2, "alt": [null, "Ты подаёшь в отставку и уезжаешь. Консульство работает по инструкциям, а очередь за дверью исчезает.", "Несколько знаменитых имён получают визы, а остальные получают отказ. Список для тех, кто выжил бы, остаётся коротким.", "Ты выполняешь приказ и отправляешь людей ни с чем. Тысячи беженцев остаются в Литве, а потом в оккупированной Европе."], "fut": [null, "Ты уезжаешь, и консульство закрывается. Очередь у дверей исчезает так же тихо, как собиралась.", "Несколько знаменитостей получают визы, остальные остаются. Через десять лет список спасённых короткий, а имя на нём одно.", "Ты выполняешь приказ. Тысячи беженцев возвращаются к границам, которые закрываются. Через несколько лет они оказываются по другую сторону войны."], "cat": "Совесть и мужество", "no": 34, "ctx2": "Литва присоединена к СССР, и консульства закрывают. Голландский консул выдаёт въезд на Кюрасао, а тебе нужно давать транзитные визы. Консульство должно закрыться к концу августа.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["S", "T", "R", "T"], "gw": ["Сострадание и долг совести, жертва карьерой", "Бегство от ответственности, уход от проблемы", "Избирательность ради статуса и выгоды, привязанность к положению", "Слепое подчинение приказу, равнодушие"]}, {"id": "RD-035", "kind": "Жизнь", "who": "Роза Паркс, швея и активистка", "when": "1 декабря 1955", "title": "Место в автобусе", "ctx": "Ты едешь с работы домой в Монтгомери. Белым пассажирам не хватает мест, и водитель требует, чтобы ты и ещё трое чернокожих уступили места. Ты устала не от работы, а от бесконечных уступок. За отказ могут арестовать, а ты член местной организации защиты прав.", "o": ["Перейти в заднюю часть автобуса и промолчать.", "Отказаться вставать и принять арест.", "Встать и уступить место.", "Сойти на следующей остановке и идти пешком."], "real": 1, "fact": "Паркс осталась сидеть. Её арестовали.", "res": "Начался бойкот автобусов в Монтгомери, он продлился 381 день. В 1956 Верховный суд США признал сегрегацию в автобусах неконституционной. Паркс потеряла работу и позже переехала.", "src": "Биография Паркс, материалы суда", "q": "Исполнитель, свободный от привязанности, не хвастливый, стойкий и рьяный, не меняющийся от успеха или неудачи, считается чистым.", "qs": "Бхагавад-гита 18.26", "qv": 2, "alt": ["Ты идёшь в заднюю часть и молчишь. Всё продолжается как прежде, а в Монтгомери нет события, которое объединило бы людей.", null, "Ты встаёшь и уступаешь. Бойкот не начинается, а сегрегация живёт ещё несколько лет, пока другой человек не откажется встать.", "Ты сходишь и идёшь пешком. Это тихий протест, но его никто не замечает, кроме тебя."], "fut": ["Ты молча идёшь в хвост автобуса. К 2000 году в Алабаме всё ещё висят таблички «Только для белых», и экскурсоводы показывают их туристам как «последний рубеж».", null, "Ты встаёшь. Через год о Монтгомери никто не слышит, а через семь лет на тот же автобус садится восемнадцатилетняя студентка и всё-таки отказывается. К 2026 году в учебниках её имя пишут как «Роза», а твоё в примечании.", "Ты сходишь и идёшь пешком шесть километров. К 1960 году вся твоя улица ходит пешком, но по обычным причинам: автобусы нельзя обойти без мостов."], "cat": "Совесть и мужество", "no": 35, "ctx2": "Ты шьёшь в магазине «Монтгомери Фэйр» и работаешь секретарём местного отделения NAACP. 1 декабря вечером в автобусе все места для белых заняты. Водитель Джеймс Блейк приказывает четверым чернокожим уступить свои. Ты сидишь в среднем ряду.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "S", "T", "T"], "gw": ["Покорность несправедливому порядку из страха ареста.", "Твёрдость принципа, готовность принять последствия без злобы.", "Слепое подчинение приказу, смирение с унижением.", "Бегство от конфликта, уклонение от ответственности."]}, {"id": "RD-036", "kind": "Жизнь", "who": "Джеки Робинсон, бейсболист", "when": "1945", "title": "Обещание не отвечать", "ctx": "Президент «Доджерс» Бранч Рикки зовёт тебя в клуб, чтобы сломать цветовой барьер. Он честно предупреждает: будут оскорбления, угрозы, грязная игра, и тебе придётся не отвечать, иначе проект провалится.", "o": ["Согласиться и пообещать не отвечать на оскорбления в первые годы.", "Отказаться: ты не обязан терпеть унижения ради чужих планов.", "Согласиться, но ответить на первое же оскорбление.", "Согласиться, но требовать отдельной охраны и защиты."], "real": 0, "fact": "Робинсон согласился на условие и в 1947 дебютировал в основном составе «Доджерс».", "res": "Он выдерживал оскорбления и угрозы, стал «Новичком года». Позже, когда условие сняли, он стал открыто бороться за равные права. Робинсон проложил путь другим чернокожим игрокам.", "src": "Биографии Робинсона", "q": "Могучий Арджуна, ум беспокоен, и его трудно обуздать, это верно. Но его можно подчинить упражнением и бесстрастием.", "qs": "Бхагавад-гита 6.35", "qv": 2, "alt": [null, "Ты отказываешься. Рикки находит другого игрока, возможно, менее выдержанного, и эксперимент проваливается на ранней стадии.", "Ты отвечаешь на первое же оскорбление, и газеты кричат о драчуне. Проект закрывают, а барьер стоит ещё годы.", "Личная охрана делает тебя мишенью для насмешек. Команда отдаляется, а болельщики видят в тебе исключение, а не игрока."], "fut": [null, "Рикки не находит замены, и в 1947 бейсбол остаётся белым. К 1975 году в лиге появляется первый чернокожий игрок, но уже как «эксперимент». К 2020 в музее бейсбола висит пустая рамка с подписью: «Здесь мог бы быть Джеки».", "Ты отвечаешь на первое оскорбление, и газеты пишут «Драчун из Доджерс». К 1950 лигу заливают протесты, а Рикки уже сомневается в своей затее.", "Личная охрана превращает тебя в «аттракцион». К 1960 вокруг тебя трибуны, где продают фото с охраной, а игрок исчезает за бизнесом."], "cat": "Совесть и мужество", "no": 36, "ctx2": "Ты играешь за «Канзас-Сити Монаркс». 28 августа 1945 года президент «Доджерс» Бранч Рикки три часа разыгрывает перед тобой сцены оскорблений. Он выбрал тебя за характер и игру. Тебе предстоит играть в фарм-клубе «Монреаль», а потом, может быть, в «Доджерс».", "adult": 0, "vs": "исправлено", "age": 12, "g": ["S", "R", "R", "R"], "gw": ["Самообуздание и служение большой цели без личной выгоды.", "Задетая гордость, самолюбие важнее общего дела.", "Импульсивная месть, не сдержать реакцию.", "Требование гарантий и защиты для себя."]}, {"id": "RD-037", "kind": "Жизнь", "who": "Мухаммед Али, чемпион мира по боксу", "when": "28 апреля 1967", "title": "Призыв во Вьетнам", "ctx": "Тебе 25 лет, ты чемпион мира. Тебя призывают в армию США для отправки во Вьетнам. Ты считаешь войну несправедливой, а твоя религия запрещает воевать. За отказ можно лишиться титула, лицензии и свободы.", "o": ["Согласиться на невоенную службу, не заявляя протест.", "Скрыться за границей.", "Отказаться от призыва.", "Пойти в армию и выступать на показательных боях."], "real": 2, "fact": "Али вышел на призывной пункт в Хьюстоне и отказался сделать шаг вперёд при вызове своего имени.", "res": "Его лишили титула и лицензии, приговорили к пяти годам и штрафу, но он оставался на свободе до апелляции. Он не боксировал около трёх с половиной лет, в 1971 Верховный суд отменил приговор.", "src": "Материалы дела Clay v. United States", "q": "Свой долг, пусть даже несовершенный, лучше чужого, хорошо исполненного. Кто делает дело, к которому его ведёт собственная природа, тот не берёт на себя вины.", "qs": "Бхагавад-гита 18.47", "qv": 2, "alt": ["Невоенная служба без протеста выглядит уступкой. Совесть не успокаивается, а карьера идёт как прежде.", "Ты скрываешься за границей. Тебя называют дезертиром, а возвращение в США откладывается на годы.", null, "Ты идёшь в армию и устраиваешь показательные бои. Титул остаётся, но ты превращаешься в рекламный плакат войны, с которой не согласен."], "fut": ["Ты соглашаешься на невоенную службу. К 1970 тебя отправляют в Германию возить грузы, а вместо «величайшего» в книгах о тебе пишут: «хороший боксёр, ушедший вовремя».", "Ты скрываешься в Канаде. К 1975 тебе дают гражданство, а к 2000 в Торонто тебя называют «тот боксёр, который не вернулся». Рингов у тебя нет, зато есть ферма.", null, "Ты в форме. На показательном бою в Сайгоне тебя фотографируют с автоматом, и этот снимок становится плакатом набора. К 1980 «Али» — торговая марка армии, а не чемпиона."], "cat": "Совесть и мужество", "no": 37, "ctx2": "Тебе двадцать пять лет, ты стал Мухаммедом Али в 1964 году. Тебя в 1966 году вновь признали годным к службе. 28 апреля 1967 года в Хьюстоне на призывном пункте офицер трижды выкликает твоё имя. Если шагнёшь вперёд, станешь солдатом, если нет, лишишься титула и лицензии.", "adult": 0, "vs": "верно", "age": 12, "g": ["T", "T", "S", "R"], "gw": ["Уход от конфликта и от высказывания правды из страха.", "Бегство от последствий и ответственности.", "Верность совести и вере, цена принята спокойно.", "Уступка ради славы, выгоды и сохранения положения."]}, {"id": "RD-038", "kind": "Жизнь", "who": "Николас Уинтон, биржевой маклер", "when": "конец 1938 – 1939", "title": "Поезда из Праги", "ctx": "Ты молодой англичанин и приехал в Прагу, где отчаявшиеся родители ищут спасение для детей. Англия принимает детей-беженцев, но нужны документы, деньги и приёмные семьи. Времени мало: война близка.", "o": ["Передать списки благотворительной организации и вернуться к работе.", "Взяться самому организовать вывоз детей в Англию.", "Заняться только поиском денег, оставив документы другим.", "Вернуться домой и сообщить о ситуации знакомым."], "real": 1, "fact": "Уинтон организовал отправку детей на поездах, собирая средства и семьи в Британии.", "res": "Удалось вывезти 669 детей, последний поезд с 250 детьми 1 сентября 1939 не вышел из-за начала войны. Свою историю он хранил в тайне почти пятьдесят лет, пока жена не нашла альбом с документами в 1988.", "src": "Биографические материалы", "q": "Совершенным йогином, Арджуна, я считаю того, кто по себе судит обо всех: в радости и в беде он видит другого равным себе.", "qs": "Бхагавад-гита 6.32", "qv": 2, "alt": ["Списки уходят организации, которая тратит месяцы на согласование. Война начинается раньше, чем найдены семьи.", null, "Ты собираешь деньги, а документы теряются в чужих руках. Дети остаются в Праге с чемоданом без разрешения.", "Ты возвращаешься домой и рассказываешь знакомым. Они сочувствуют, но не действуют, а поезда не отправляются."], "fut": ["Списки лежат в офисе организации, которая просит «подождать». К лету 1939 они пылятся в сейфе, а к 1945 бумаги находят другие люди, уже без адресатов.", null, "Ты собрал деньги, но документы остались у чужих людей. К 1950 на вокзале Праги ещё стоит чемодан, который никто так и не забрал.", "Ты возвращаешься домой. К 1989 году в твоём шкафу лежит выцветший блокнот со списком из 669 имён, и ты ни разу не открыл его. К 2000 на этих фамилиях стоят могилы по всей Европе."], "cat": "Совесть и мужество", "no": 38, "ctx2": "Тебе двадцать девять, ты биржевой маклер и приехал в Прагу по просьбе друга. Британский комитет по делам беженцев принимает детей, но требует приёмную семью и залог в пятьдесят фунтов за каждого. Ты принимаешь заявки в гостинице.", "adult": 0, "vs": "спорно", "age": 12, "g": ["T", "S", "R", "T"], "gw": ["Равнодушное самоустранение, перекладывание ответственности на других.", "Самоотверженный труд ради спасения детей без выгоды.", "Частичное участие, оставляя трудное другим.", "Бездействие, ограничившись разговорами."]}, {"id": "RD-039", "kind": "Жизнь", "who": "Михаил Горбачёв, генеральный секретарь ЦК КПСС", "when": "ноябрь 1989", "title": "Падение стены", "ctx": "В Восточной Германии люди выходят на улицы, 9 ноября открывается Берлинская стена. На территории ГДР стоят сотни тысяч советских солдат. Часть консервативных советников требует действовать силой. Раньше такие кризисы подавляли силой.", "o": ["Потребовать от ГДР удерживать власть любой ценой.", "Ввести войска только для охраны советских объектов.", "Ввести войска, как в 1953 и 1956 годах.", "Не применять силу и оставить войска в казармах."], "real": 3, "fact": "Горбачёв не использовал советские войска, которые остались в местах дислокации.", "res": "Через год Германия объединилась. Через два года распался СССР. Историки спорят, как оценивать этот выбор: одни видят в нём заслугу, другие ошибку.", "src": "Мемуары, исторические обзоры", "q": "Выше всех тот, кто одинаково относится к друзьям, недругам и равнодушным, к посредникам, ненавидящим и родным, к праведным и к грешным.", "qs": "Бхагавад-гита 6.9", "qv": 2, "alt": ["Требование держать власть любой ценой радует Хонеккера, но не народ. Восток Германии взрывается быстрее.", "Ввод войск «для охраны объектов» быстро превращается в столкновения. Любой выстрел делает события необратимыми.", "Войска выходят на улицы Берлина. Стена остаётся на месте, а кровь на асфальте превращает события в новый 1956 год. СССР теряет остатки репутации.", null], "fut": ["Хонеккер держится ещё десять лет, к 1999 году ГДР становится самым закрытым государством мира, а её граждане учат по телевидению, как выглядит Запад.", "Войска «охраняют объекты» и стреляют в первый же день. К 1992 Германия разделена линией новой холодной войны, а в школах учат, что 9 ноября — день траура.", "Танки входят в Берлин. Стена остаётся, и к 2000 она растянута вдоль всей Европы от Балтики до Адриатики. В 2026 году на ней продают открытки, но проходить через неё нельзя.", null], "cat": "Власть и война", "no": 39, "ctx2": "В октябре 1989 года ты приехал на сорокалетие ГДР и увидел, что Хонеккер отрицает кризис. 9 ноября под давлением толпы открывают стену.", "adult": 0, "vs": "спорно", "age": 12, "g": ["R", "R", "T", "S"], "gw": ["Цепляние за власть и контроль над сферой влияния.", "Попытка сохранить влияние и контроль полумерой.", "Слепое повторение силового насилия и разрушения.", "Отказ от насилия ради жизни людей, отпуская власть."]}, {"id": "RD-040", "kind": "Книга", "who": "Софи Завистовска, «Выбор Софи» (Уильям Стайрон, 1979)", "when": "Освенцим, 1943", "title": "Выбор у рампы", "ctx": "Апрель 1943 года, нацистский лагерь смерти Освенцим. Ты Софи, полька-католичка, мать двоих детей: сына Яна и младшей дочери Евы. Вас только что выгрузили из поезда на платформе, и эсэсовский врач решает, кого отправить на работу, а кого сразу на смерть. Он приказывает тебе выбрать одного ребёнка, которого оставят с тобой, а если откажешься, заберут обоих.", "o": ["Оставить сына и отдать дочь.", "Броситься на врача, не думая о последствиях.", "Отказаться выбирать, понимая, что тогда погибнут оба.", "Оставить дочь и отдать сына."], "real": 0, "fact": "В романе Софи оставляет сына Яна и отдаёт младшую дочь Еву.", "res": "Ян исчезает в детском лагере, а Софи не оправляется от пережитого. Роман показывает ситуацию, где правильного ответа нет, а вся ответственность лежит на тех, кто принудил её к выбору.", "src": "Роман У. Стайрона «Выбор Софи» (1979)", "q": "Слабость жалости охватила меня, ум растерян в вопросе о долге. Скажи мне точно, что для меня лучше: я твой ученик, прибегнувший к тебе, наставь меня.", "qs": "Бхагавад-гита 2.7", "qv": 2, "alt": [null, "Бросок на врача заканчивается мгновенной расправой. Дети остаются без матери и без выбора, а охрана даже не меняет строй.", "Отказ выбирать приводит к тому, что забирают обоих. Это не решение, а приговор, который принимает тот, кто заставляет выбирать.", "Ты оставляешь дочь и отдаёшь сына. Выбор не становится легче: в любом варианте его навязывают палачи, а не ты."], "cat": "Литература", "no": 40, "ctx2": "Врач пьян и говорит, что даёт тебе выбор только потому, что ты не еврейка. Ты понимаешь, что того, кого заберут, ты больше не увидишь. За спиной движется очередь, и на раздумья у тебя считаные секунды.", "adult": 1, "vs": "исправлено", "age": 18}, {"id": "RD-041", "kind": "Книга", "who": "Жан Вальжан, «Отверженные» (Виктор Гюго, 1862)", "when": "Аррас, XIX век", "title": "Чужой на скамье подсудимых", "ctx": "Франция, XIX век, городок Монтрей-сюр-Мер. Ты Жан Вальжан: тебя когда-то осудили за кражу хлеба и продержали на каторге девятнадцать лет, а теперь ты под чужим именем господин Мадлен, богатый фабрикант и мэр, которого любят за доброту к бедным. Ты узнаёшь, что в городе Аррасе судят бродягу, которого приняли за тебя, и ему грозит каторга до конца жизни. Если ты назовёшь своё настоящее имя, ты потеряешь положение и свободу и не сможешь больше помогать людям, которые на тебя рассчитывают.", "o": ["Анонимно отправить доказательства его невиновности.", "Явиться в суд и назвать своё имя.", "Промолчать: ты нужен сотням людей, а он один.", "Заплатить адвокату и исчезнуть из города."], "real": 1, "fact": "Вальжан едет в суд и открывает, кто он, спасая подсудимого.", "res": "Он теряет положение и вновь становится беглецом. Фантина умирает, не дождавшись дочери. Но Вальжан спасает чужую жизнь и сохраняет себя. Гюго ставит вопрос: что страшнее, потерять положение или совесть.", "src": "«Отверженные», часть I, книга 7", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": ["Анонимные доказательства теряются в канцелярии. Суд идёт своим ходом, а ты ждёшь известий, которые не приходят.", null, "Ты молчишь и остаёшься мэром. Город живёт, пока невиновный отправляется на каторгу, и ты видишь его лицо в зеркале.", "Ты платишь адвокату и исчезаешь. Невиновный получает защитника, а ты теряешь всё, что строил."], "fut": ["Анонимные доказательства теряются в канцелярии. К 1833 суд выносит приговор, а ты узнаёшь о нём из газеты за завтраком.", null, "Ты молчишь и остаёшься мэром. К 1835 городом процветает на твоих налогах, а в зеркале каждое утро тебя встречает невиновный, которого вместо тебя осудили. К 1860 он умирает на каторге, а ты открываешь больницу его имени.", "Ты платишь адвокату и исчезаешь. К 1840 невиновный свободен, а ты живёшь в монастыре, где рассказываешь монахам, как однажды чуть не стал героем."], "cat": "Литература", "no": 41, "ctx2": "Бродягу зовут Шанматье. Полицейский инспектор Жавер, который раньше подозревал в тебе беглого каторжника, теперь убеждён, что настоящий Вальжан найден. В городе тебя ждёт больная работница Фантина, которой ты обещал найти её дочь, а до начала суда в Аррасе надо успеть доехать за одну ночь.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "S", "R", "T"], "gw": ["Прячется от ответственности, чужой вред остаётся на нём.", "Правда и самопожертвование ради невиновного без расчёта.", "Привязанность к положению, оправдание выгоды.", "Откупиться и сбежать, уклонение от долга."]}, {"id": "RD-042", "kind": "Книга", "who": "Родион Раскольников, «Преступление и наказание» (Ф. М. Достоевский, 1866)", "when": "Петербург, XIX век", "title": "Признаться или нет", "ctx": "Петербург, XIX век. Ты Родион Раскольников, бедный бывший студент, гордый и измученный собственными мыслями. Ты убил топором старуху-процентщицу Алёну Ивановну, а заодно и её сестру Лизавету, случайно вошедшую в комнату, и пока тебя никто не поймал. Следователь Порфирий Петрович подозревает тебя, но прямых улик у него нет, и тебе надо решить, идти ли с повинной самому: это значит каторга, а молчание значит жить с тайной.", "o": ["Затаиться и ждать, пока дело закроют.", "Признаться только Соне и ждать, что будет.", "Скрываться дальше и бежать за границу.", "Прийти в контору и признаться."], "real": 3, "fact": "Раскольников поцеловал землю на площади, как велела Соня, и пошёл в участок с признанием.", "res": "Он получает восемь лет каторги, Соня едет за ним в Сибирь. В эпилоге начинается его внутреннее возрождение. Достоевский оставляет это лишь началом новой истории.", "src": "«Преступление и наказание», часть VI и эпилог", "q": "Кто думает о предметах чувств, у того возникает привязанность к ним; из привязанности рождается желание, из желания — гнев.", "qs": "Бхагавад-гита 2.62", "qv": 2, "alt": ["Ты затаиваешься и ждёшь. Порфирий Петрович не торопится, а тяжесть внутри тебя не уходит.", "Ты признаёшься одной Соне и ждёшь. Правда живёт в ней, но не в мире, и ты по-прежнему внутри клетки.", "Ты бежишь за границу и живёшь под чужим именем. Совесть едет с тобой, а мир не становится больше.", null], "fut": ["Ты затаиваешься. К 1870 дело так и не закрыто, а покоя ты не находишь. К 1900 в университетах тебя изучают как пример человека, выбравшего молчание.", "Ты признаёшься только Соне. К 1875 вы живёте в тихой квартире, а над вами коридор с зеркалом, в котором ты ни разу не видишь себя.", "Ты бежишь в Париж. К 1880 ты владелец ломбарда, и лишь по ночам слышишь шаги процентщицы. К 1900 твой портрет висит в Лувре с подписью «Анонимный благотворитель».", null], "cat": "Литература", "no": 42, "ctx2": "Соня Мармеладова, молодая девушка из нищей семьи, которая из-за нужды вынуждена зарабатывать на улице, любит тебя, и только ей ты открылся. Она верит в Бога и говорит, что надо принять страдание и искупить вину. Сам ты не уверен, что поступил дурно: ты убеждал себя, что необыкновенный человек вправе переступить закон, но покоя это не принесло.", "adult": 1, "vs": "верно", "age": 18, "g": ["T", "R", "T", "S"], "gw": ["Уход от выбора, надежда переждать.", "Полупризнание, гордость, желание контроля над исходом.", "Бегство и самообман, уход от ответственности.", "Честное принятие вины и расплаты."]}, {"id": "RD-043", "kind": "Книга", "who": "Гекльберри Финн, «Приключения Гекльберри Финна» (Марк Твен, 1884)", "when": "река Миссисипи, XIX век", "title": "Письмо мисс Уотсон", "ctx": "Ты Гекльберри Финн, бездомный мальчишка лет тринадцати, живёшь на американском Юге в XIX веке, когда рабство ещё законно. Ты сбежал от отца-пьяницы и поплыл по Миссисипи на плоту вместе с Джимом, рабом вдовы мисс Уотсон, которая когда-то тебя опекала; Джим бежал, потому что боялся, что его продадут. Тебя учили, что помогать беглому рабу — воровство и грех, за который попадёшь в ад. Но Джим стал тебе настоящим другом, и ты написал мисс Уотсон письмо, где сообщаешь, где он.", "o": ["Отправить письмо: так тебя учили.", "Рассказать обо всём Тому Сойеру и просить совета.", "Порвать письмо и помогать Джиму, пусть и «в аду».", "Отложить письмо, чтобы решить позже."], "real": 2, "fact": "Гек рвёт письмо, говоря: «Ну и ладно, пойду в ад».", "res": "Гек и Том пытаются освободить Джима, и тот оказывается уже свободным по завещанию. Твен показывает, как совесть может идти против воспитания.", "src": "«Приключения Гекльберри Финна», глава 31", "q": "Совершенным йогином, Арджуна, я считаю того, кто по себе судит обо всех: в радости и в беде он видит другого равным себе.", "qs": "Бхагавад-гита 6.32", "qv": 2, "alt": ["Письмо отправлено. Джима возвращают в рабство, а ты получаешь одобрение мисс Уотсон и чувство, что поступил правильно.", "Том Сойер превращает спасение Джима в приключение с мечами. Серьёзный выбор тонет в игре, но Джим всё равно в опасности.", null, "Ты откладываешь письмо, и Джим остаётся рядом ещё на несколько страниц. Решение не принято, а совесть не молчит."], "fut": ["Письмо отправлено. Джима везут обратно по реке. К 1900 Гек превращается в уважаемого судью, который до конца жизни не может проходить мимо плотов. К 1950 в его доме находят письмо, которое он так и не отправил.", "Том превращает побег в приключение с подкопами и сигналами. К 1880 вы оба знамениты, но Джим навсегда запомнил, как мальчики играли его свободой.", null, "Ты откладываешь письмо до утра. К утру Джим уже в другом штате, а ты всё ещё в раздумье. К 1890 вы встречаетесь стариками, и он не помнит, что ты колебался."], "cat": "Литература", "no": 43, "ctx2": "Двое мошенников, которые называют себя Королём и Герцогом и плывут с вами, продали Джима, и теперь он заперт на чужой ферме. Если отправить письмо, Джима вернут мисс Уотсон, и он останется рабом. Если не отправить, придётся по тогдашним понятиям стать преступником и грешником.", "adult": 0, "vs": "верно", "age": 12, "g": ["T", "R", "S", "T"], "gw": ["Слепое подчинение усвоенной морали вопреки совести.", "Ищет совет у авторитета, привязан к чужому одобрению.", "Сострадание и дружба выше страха и привычной морали.", "Откладывание решения, уклонение от выбора."], "swap": {"role": "Джим, беглый раб", "title": "Рискнуть свободой", "ctx": "Ты Джим, чернокожий раб, сбежавший от хозяйки на американском Юге. Твои друзья, мальчики Гек Финн и Том Сойер, только что помогли тебе бежать из запертой хижины, но в погоне Тому попала пуля в ногу. Гек уплыл за врачом, а ты по уговору прячешься неподалёку. Врач приехал, Том бредит от боли, и врач говорит, что один не справится и ему нужен помощник.", "o": ["Остаться в укрытии: Тому и так помогает врач.", "Сразу уплыть на плоту, пока тебя не поймали.", "Вернуться ночью, когда врач уйдёт.", "Выйти из укрытия и помогать врачу ухаживать за Томом."], "real": 3, "fact": "Ты вышел из укрытия и сказал, что поможешь. Ты ухаживал за Томом день и ночь, хотя рисковал свободой.", "res": "Врач потом говорил, что лучше и вернее помощника не видел. Но на рассвете, пока ты спал, тебя схватили, заперли в хижине, приковали за руки и за ноги и оставили на хлебе и воде до решения хозяина. Потом выяснилось, что хозяйка, мисс Уотсон, ещё раньше освободила тебя в своём завещании.", "src": "М. Твен, «Приключения Гекльберри Финна» (1884), гл. 40 и 42: etc.usf.edu/lit2go/21/the-adventures-of-huckleberry-finn/236/chapter-42/, owleyes.org/text/adventures-of-huckleberry-finn/read/chapter-xlii-hang-jim"}}, {"id": "RD-044", "kind": "Книга", "who": "Антигона, «Антигона» (Софокл, 441 до н. э.)", "when": "Фивы", "title": "Погребение брата", "ctx": "Ты Антигона, дочь прежнего царя Фив Эдипа, девушка твёрдая и упрямая. Два твоих брата, Этеокл и Полиник, убили друг друга в битве: Этеокл защищал город, а Полиник привёл на него чужое войско. Новый царь, твой дядя Креонт, велел похоронить Этеокла с почестями, а тело Полиника оставить без погребения как предателя, и казнить всякого, кто его похоронит. По вере твоего народа душа непогребённого не находит покоя.", "o": ["Подчиниться приказу и оставить брата без погребения.", "Попросить царя изменить приказ.", "Тайно ночью совершить обряд и скрыть это.", "Похоронить брата вопреки царю."], "real": 3, "fact": "Антигона посыпает тело землёй и совершает обряд, а перед Креонтом открыто признаётся в содеянном.", "res": "Креонт приговаривает её к заточению в пещере, она кончает с собой. Вслед за ней погибают сын царя Гемон и жена царя Эвридика. Трагедия оставляет вопрос о границах власти.", "src": "Софокл, «Антигона»", "q": "Люди будут вечно говорить о твоём бесчестье, а для человека, которого уважают, позор хуже смерти.", "qs": "Бхагавад-гита 2.34", "qv": 2, "alt": ["Ты подчиняешься приказу и оставляешь брата без погребения. Город спокоен, а ты живёшь, зная, что отказалась от последнего долга.", "Просьба к Креонту остаётся без ответа. Царь повторяет приказ, и ты теряешь время, а потом и возможность.", "Ночной обряд тайно совершён, но утром стража раскрывает следы. Ты отвечаешь так же, как и в оригинале, но без достоинства открытого поступка.", null], "fut": ["Ты подчиняешься. К 400 до н. э. Фивы спокойны, а ты стареешь в уединении, ни разу не придя на могилу, которой нет. Спустя тысячелетия в школьных программах нет «Антигоны», потому что некому её написать.", "Креонт отказывает. К закату ты стоишь у ворот города, где уже никто не слушает. Через сто лет в Фивах выбиты слова «Закон выше дочери».", "Тайный обряд раскрыт к утру. К полудню ты в пещере. К вечеру Креонт издаёт указ, запрещающий хоронить даже стражников.", null], "cat": "Литература", "no": 44, "ctx2": "Ты помолвлена с Гемоном, сыном Креонта. Сестра Исмена боится царя и отказалась тебе помогать, а у тела день и ночь стоит стража. Тело Полиника лежит в поле на съедение птицам и псам.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "R", "T", "S"], "gw": ["Слепое подчинение приказу ради безопасности.", "Желание добиться своего через власть.", "Скрытность и бегство от последствий.", "Долг перед умершим выполнен открыто, без расчёта."], "swap": {"role": "Креонт, царь Фив", "title": "Приговор Антигоне", "ctx": "Ты Креонт, царь Фив. В войне за город погибли оба брата-соперника, и тело Полиника, который пошёл на Фивы с чужим войском, ты запретил хоронить: пусть лежит в поле на съедение птицам. Кто-то всё же посыпал его землёй, и стражник привёл к тебе Антигону, сестру Полиника и невесту твоего сына Гемона. Она открыто признаёт вину и говорит, что твой приказ несправедлив; её сестра Исмена просит наказать и её, а Гемон умоляет тебя быть мягче. Ты должен решить, что сделать с Антигоной.", "o": ["Простить Антигону: она хоронила родного брата.", "Казнить её публично на площади.", "Замуровать её живой в пещере.", "Изгнать её из Фив навсегда."], "real": 2, "fact": "Ты приказал замуровать Антигону живой в пещере: так, по твоим словам, ты не навлечёшь на город гнев богов прямой казнью. Исмену ты, по совету хора фиванских старейшин, пощадил.", "res": "Слепой прорицатель Тиресий предупредил тебя, что боги отвергают жертвы Фив и что ты потеряешь сына. Ты испугался, велел похоронить Полиника и пошёл освобождать Антигону, но опоздал: она уже лишила себя жизни. Вслед за ней погибли твой сын Гемон и твоя жена Эвридика, и ты остался один с последствиями своего решения.", "src": "Софокл, «Антигона» (441 до н. э.); пересказ: Wikipedia, «Antigone (Sophocles play)» (en.wikipedia-on-ipfs.org)"}}, {"id": "RD-045", "kind": "Книга", "who": "Капитан Вир, «Билли Бадд, фор-марсовый» (Герман Мелвилл, 1891)", "when": "британский корабль, 1797", "title": "Приговор Билли", "ctx": "1797 год, британский военный корабль «Беллипотент», идёт война с Францией. Ты капитан Вир, образованный, строгий и справедливый человек, а на флоте только что прошли опасные мятежи, и командиры боятся новых. Молодого красивого матроса Билли Бадда любит вся команда, но Клаггарт, старший по надзору за порядком на корабле, ложно обвинил его перед тобой в подготовке мятежа. Билли в волнении заикается и не смог вымолвить ни слова, а потом ударил Клаггарта; тот упал и умер.", "o": ["Отпустить его тайно.", "Отдать дело командованию флота и ждать решения.", "Созвать суд и настоять на казни, следуя закону.", "Помиловать матроса: он убил без намерения."], "real": 2, "fact": "Вир собрал суд, убедил офицеров вынести приговор, и Билли был повешен.", "res": "Билли перед казнью сказал: «Благослови Бог капитана Вира». Вир умер позднее, шепча имя Билли. Мелвилл не даёт ответа, прав ли был капитан.", "src": "Г. Мелвилл, «Билли Бадд»", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Тайное освобождение раскрывается быстро. Тебя судят за измену присяге, а Билли, возможно, всё равно ловят.", "Дело уходит к флоту, и решение приходит через месяцы. Билли сидит в трюме, а экипаж гадает, что решат наверху.", null, "Ты милуешь матроса. Команда видит слабость командования, а после недавнего мятежа это может быть опасным. Корабль, возможно, взрывается бунтом."], "fut": ["Ты отпускаешь Билли тайно. К рассвету весь корабль знает. К 1799 тебя судят вместе с ним, а Мелвилл через сто лет пишет об этом не повесть, а летопись беззакония.", "Дело уходит в штаб флота. К весне приходит приказ: повесить обоих. К 1820 офицеры вспоминают этот корабль как «место, где закон боялся решения».", null, "Ты милуешь Билли. К ночи на корабле бунт, а через неделю в порту виселица для офицеров. К 1800 году адмиралтейство пишет новую инструкцию: «никакой жалости на борту»."], "cat": "Литература", "no": 45, "ctx2": "Ты знаешь, что обвинение было ложным и что Билли не хотел убивать. Но по военному закону за удар офицера, тем более смертельный, полагается повешение, и решение зависит от тебя. Ты боишься, что снисхождение в такое время сочтут слабостью, а казнь человека, невиновного в злом умысле, ляжет на твою совесть.", "adult": 0, "vs": "верно", "age": 12, "g": ["T", "T", "R", "S"], "gw": ["Тайное уклонение от долга и закона, самообман.", "Перекладывание ответственности на других.", "Закон и репутация от страха мятежа, подавление.", "Справедливое милосердие по сути поступка, ясность."]}, {"id": "RD-046", "kind": "Книга", "who": "Одиссей, «Одиссея» (Гомер, VIII в. до н. э.)", "when": "пролив между Сциллой и Харибдой", "title": "Между двух зол", "ctx": "Ты Одиссей, царь острова Итака, хитрый и бывалый мореход. Уже много лет ты возвращаешься домой после Троянской войны, и на корабле измученная команда. Колдунья Кирка, у которой вы гостили, предупредила тебя: путь лежит через узкий пролив между двумя скалами. У одной живёт шестиглавое чудовище Сцилла, которое схватит с корабля шестерых, а у другой Харибда, водоворот, способный утопить весь корабль.", "o": ["Идти ближе к Харибде, рискуя всем кораблём.", "Идти ближе к Сцилле, пожертвовав шестью.", "Рассказать команде и дать людям самим решить.", "Остановиться и ждать у пролива."], "real": 1, "fact": "Одиссей пошёл мимо Сциллы и не сказал команде о ней, чтобы они не бросили вёсла от страха.", "res": "Сцилла схватила шестерых гребцов. Одиссей назвал это самым горьким зрелищем в своих странствиях. Остальные спаслись.", "src": "Гомер, «Одиссея», песнь XII", "q": "Соприкосновения чувств с предметами дают холод и жар, радость и боль. Они приходят и уходят, они непостоянны. Терпи их, потомок Бхараты.", "qs": "Бхагавад-гита 2.14", "qv": 2, "alt": ["Ты идёшь ближе к Харибде. Водоворот проглатывает корабль целиком, а сказание о возвращении Одиссея на этом заканчивается.", null, "Ты рассказываешь команде всё. Люди бросают вёсла от страха, и корабль теряет ход там, где скорость решает всё.", "Ты останавливаешься у пролива. Течение несёт корабль к обоим чудовищам одновременно, а выбирать уже нечем."], "fut": ["Ты идёшь к Харибде. Водоворот съедает корабль. К 700 до н. э. на Итаке Пенелопа ткёт саван, который никто не просит закончить, а Гомер так и не пишет вторую половину.", null, "Ты рассказываешь команде о Сцилле. Люди бросают вёсла от ужаса. К закату вы в чреве у обоих чудовищ, а легенда называет вас «самой разговорчивой командой в истории».", "Ты ждёшь у пролива. Течение несёт корабль к скалам. К 600 до н. э. моряки называют этот пролив «Местом, где нельзя стоять»."], "cat": "Литература", "no": 46, "ctx2": "Кирка добавила, что со Сциллой не справиться и сражаться с ней бесполезно. Свернуть нельзя, другого пути домой нет, а берега не видно. Предупреждение Кирки до конца слышал только ты.", "adult": 0, "vs": "верно", "age": 12, "g": ["T", "S", "R", "T"], "gw": ["Безрассудный риск всем кораблём, пренебрегая людьми.", "Долг командира: меньшая потеря ради спасения остальных.", "Снятие с себя тяжести решения, популярность.", "Промедление и бездействие у опасности."]}, {"id": "RD-047", "kind": "Книга", "who": "Аттикус Финч, «Убить пересмешника» (Харпер Ли, 1960)", "when": "Алабама, 1930-е", "title": "Защита Тома Робинсона", "ctx": "Ты Аттикус Финч, адвокат в маленьком городке Мейкомб в штате Алабама, 1930-е годы, время Великой депрессии. Ты вдовец, спокойный и честный человек, и растишь двоих детей: сына Джема и дочь Скаут. Судья поручает тебе защищать Тома Робинсона, чернокожего рабочего, которого обвиняют в изнасиловании белой женщины. В этом городе присяжные почти всегда верят белым, а многие соседи уже дают понять, что за такую защиту тебя возненавидят.", "o": ["Передать дело другому адвокату.", "Взяться, но не слишком усердствовать.", "Взяться за защиту и сделать всё возможное.", "Отказаться от дела, чтобы защитить детей от травли."], "real": 2, "fact": "Аттикус берёт дело и защищает Тома по совести.", "res": "Присяжные выносят обвинительный приговор, хотя доказательства слабые. Том погибает при попытке побега. Боб Ивелл нападает на детей. Сюжет показывает, что решение можно принять правильно и всё равно проиграть.", "src": "Х. Ли, «Убить пересмешника»", "q": "Ещё Джанака и другие достигли совершенства именно деятельностью. Ради блага людей и тебе следует действовать.", "qs": "Бхагавад-гита 3.20", "qv": 2, "alt": ["Дело переходит к другому адвокату. Он выполняет формальности и не бросает вызова городу, а Том остаётся без защитника.", "Ты берёшься вполсилы. Приговор тот же, но без твоей настоящей речи, и дети знают, что отец мог иначе.", null, "Ты отказываешься от дела. Детям спокойнее в школе, но Том остаётся без защиты, а ты теряешь право называть себя собой."], "fut": ["Дело переходит к другому адвокату. К 1936 Том осуждён за три часа, а город отмечает это как «спокойное лето».", "Ты берёшься вполсилы. К 1940 Том осуждён, а Скаут по ночам повторяет: «Папа мог лучше». К 1990 она пишет письмо, которого ты так и не прочёл.", null, "Ты отказываешься. К 1950 Том Робинсон всё равно в тюрьме, а дети перестают приходить к тебе за советом. К 1990 в школьных библиотеках нет «Убить пересмешника», потому что в городе нечего рассказать."], "cat": "Литература", "no": 47, "ctx2": "Женщину обвиняет её отец Боб Ивелл, известный в городе скандалист, но слово белого там весит больше слова чернокожего. Шансов на оправдание мало. От твоего решения зависит жизнь подсудимого и то, как будут смотреть на тебя собственные дети, которые всё слышат в школе.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "T", "S", "R"], "gw": ["Бегство от ответственности, равнодушие к правде.", "Лицемерие, формальное исполнение без усилия.", "Долг и справедливость без привязки к успеху.", "Защита своего покоя и репутации от осуждения."]}, {"id": "RD-048", "kind": "Книга", "who": "Нора Хельмер, «Кукольный дом» (Генрик Ибсен, 1879)", "when": "норвежский город, XIX век", "title": "Закрыть за собой дверь", "ctx": "Ты Нора Хельмер, жена банковского служащего Торвальда Хельмера и мать троих детей, живёшь в норвежском городе в XIX веке. Когда муж тяжело заболел, ты тайно взяла деньги в долг, подделав подпись умершего отца, чтобы увезти его лечиться в Италию. Теперь Хельмер узнал: сначала он называл тебя лгуньей и преступницей и боялся за своё имя, а когда опасность миновала, простил и зовёт жить как прежде. Тебе надо решить, остаться в доме, где ты прожила много лет, или уйти.", "o": ["Уйти вместе с детьми.", "Простить мужа и остаться ради детей.", "Уйти из дома, оставив мужа и детей, чтобы понять себя.", "Остаться, но потребовать равных прав в семье."], "real": 2, "fact": "Нора уходит, хлопнув дверью, и оставляет мужа и детей.", "res": "Пьеса вызвала скандал, в Германии автор под давлением написал для постановки смягчённый финал. Ибсен оставил открытым вопрос, чем придётся заплатить за такую свободу.", "src": "Г. Ибсен, «Кукольный дом»", "q": "Человек должен поднимать себя сам и не давать себе падать: ум бывает другом человека, а бывает его врагом.", "qs": "Бхагавад-гита 6.5", "qv": 2, "alt": ["Ты уходишь с детьми. Положения женщины это не меняет: у тебя нет денег, жилья и прав на детей.", "Ты прощаешь мужа и остаёшься. Кукольный дом закрывается, а ты по-прежнему кукла в нём, только теперь без иллюзий.", null, "Ты остаёшься, но требуешь равных прав. Муж обещает подумать, и в доме идёт спор, который не заканчивается."], "fut": ["Ты уходишь с детьми. К 1885 у вас нет ни дома, ни денег. К 1900 дети пишут пьесу о матери, которая взяла их с собой, и называют её «Кукольный дом» наоборот.", "Ты прощаешь мужа. К 1900 дом блестит, а в шкафу висят платья, которые ты ни разу не носила. К 1950 внучка находит твоё письмо с надписью «никогда не отправлю».", null, "Ты остаёшься и требуешь равных прав. К 1890 вы всё ещё ведёте переговоры. К 1920 твоя правнучка возглавляет партию, которую ты бы не узнала."], "cat": "Литература", "no": 48, "ctx2": "Деньги ты одолжила у Крогстада, служащего того же банка, который потом пригрозил всё рассказать мужу, если потеряет место. Все эти годы ты тайком выплачивала долг и играла роль весёлой и послушной жены. Если уйти, придётся жить без денег и защиты, а в те годы закон и общество были на стороне мужа, и детей тебе могут не отдать.", "adult": 0, "vs": "спорно", "age": 12, "g": ["R", "T", "R", "R"], "gw": ["Привязанность к детям, желание контролировать и сохранить.", "Подчинение страху и привычке, самообман.", "Поиск себя, самоутверждение ценой семьи.", "Требует равенства, сохраняя выгоду и положение."], "swap": {"role": "Торвальд Хельмер, муж Норы", "title": "Письмо Крогстада", "ctx": "Ты Торвальд Хельмер, муж Норы, в доме Хельмеров в Норвегии конца XIX века. После праздника ты открываешь письмо от Крогстада, человека, у которого твоя жена когда-то взяла деньги. Из письма ты узнаёшь, что много лет назад Нора подделала подпись на долговой расписке, и теперь Крогстад держит её в руках. Нора стоит рядом и ждёт, что ты скажешь.", "o": ["Накинуться на Нору с упрёками, думая прежде всего о своей репутации.", "Обнять Нору и сказать, что вы справитесь вместе, что бы ни случилось.", "Пойти к Крогстаду и попытаться договориться с ним самому.", "Взять вину на себя и сказать, что подпись подделана с твоего ведома."], "real": 0, "fact": "Ты был потрясён и обрушился на Нору: назвал её лгуньей и преступницей, сказал, что она разрушила твоё счастье и будущее, что ты теперь в руках бесчестного человека. Ты решил замять дело, чтобы внешне всё осталось по-прежнему, «в глазах света».", "res": "Скоро пришло второе письмо: Крогстад вернул расписку и сообщил, что раскаялся. Ты тут же закричал, что спасён, сжёг бумаги в печи и объявил, что прощаешь Нору. Но Нора увидела, как быстро ты сменил тон, и сказала, что уходит; ты просил её остаться, но она ушла от тебя и от детей.", "src": "Г. Ибсен, «Кукольный дом» (1879), действие 3: marxists.org/subject/women/fiction/ibsen/doll/ch03.htm, owleyes.org/text/dolls-house/read/act-iii"}}, {"id": "RD-049", "kind": "Книга", "who": "Фродо Бэггинс, «Властелин колец» (Дж. Р. Р. Толкин, 1954–55)", "when": "Роковая гора", "title": "У края пропасти", "ctx": "Ты Фродо Бэггинс, скромный хоббит из тихой страны Шир, которому выпало нести Кольцо Всевластия. Его создал Тёмный властелин Саурон, чтобы править миром, и если оно вернётся к нему, наступит вечная тьма. Уничтожить Кольцо можно только в огне Роковой горы в стране Мордор, и ты нёс его туда долгие месяцы. Теперь ты стоишь у самой расселины с огнём, силы на исходе, а Кольцо уже почти не даёт думать ни о чём другом.", "o": ["Оставить Кольцо себе.", "Отдать Кольцо Сэму, чтобы он бросил.", "Бросить Кольцо в огонь, как договаривались.", "Спуститься и вернуть Кольцо Гэндальфу."], "real": 0, "fact": "Фродо объявляет Кольцо своим и надевает его.", "res": "Голлум вырывает Кольцо, откусив палец, и падает в огонь вместе с ним. Кольцо уничтожено, но не волей Фродо. Толкин показывает, что даже самые стойкие не всегда способны выдержать до конца.", "src": "Дж. Р. Р. Толкин, «Возвращение короля»", "q": "У этого пути к гибели три двери: похоть, гнев и жадность. Поэтому от этой тройки нужно отказаться.", "qs": "Бхагавад-гита 16.21", "qv": 2, "alt": [null, "Кольцо у Сэма, и через минуту оно уже в его кармане. Сэм сильнее тебя, но Кольцо не выбирает по силе.", "Ты бросаешь Кольцо в огонь, как и договаривались. Мордор рушится, а Голлум остаётся без цели, возможно, живым.", "Ты возвращаешь Кольцо Гэндальфу. Маг принимает его, и вся история меняется до неузнаваемости: у Кольца нового хозяина."], "fut": [null, "Это только допущение: Кольцо у Сэма, и дальше история пошла бы иначе. Что именно случилось бы, роман не говорит.", "Это только допущение: Кольцо брошено в огонь по договорённости, а судьба Голлума осталась бы неизвестной.", "Это только допущение: у Кольца появился бы другой хозяин, а как это отразилось бы на мире, роман не говорит."], "cat": "Литература", "no": 49, "ctx2": "Почти до конца с тобой дошёл Сэм, твой верный друг и бывший садовник. По пятам за вами идёт Голлум, существо, которое владело Кольцом много лет и теперь живёт мечтой вернуть его. Чем ближе огонь, тем больше Кольцо становится для тебя не бременем, а чем-то своим.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "T", "S", "T"], "gw": ["Жадность к власти над кольцом, привязанность.", "Бегство от ответственности, перекладывание ноши.", "Верность долгу, выполнение обещанного.", "Отказ от задачи, бегство от тяжести долга."]}, {"id": "RD-050", "kind": "Книга", "who": "Татьяна Ларина, «Евгений Онегин» (А. С. Пушкин, 1823–1831)", "when": "Петербург", "title": "Письмо и ответ", "ctx": "Ты Татьяна Ларина, выросла в деревне тихой и начитанной девушкой, а теперь ты петербургская княгиня, жена знатного генерала. Когда тебе было семнадцать, ты влюбилась в столичного дворянина Евгения Онегина и в письме призналась ему в любви, а он вежливо отказал и прочитал тебе нравоучение. Прошли годы, Онегин вернулся из странствий, увидел тебя на балу и сам влюбился. Теперь он пишет тебе письма с мольбой о встрече, а ты знаешь, что до сих пор любишь его.", "o": ["Уйти к Онегину.", "Отказать Онегину и остаться верной мужу.", "Уехать в деревню, избегая обоих.", "Встретиться с Онегиным тайно и решить позже."], "real": 1, "fact": "Татьяна признаётся, что любит Онегина, но отдана другому и будет вечно верна.", "res": "Онегин остаётся один. Пушкин обрывает роман на этой сцене.", "src": "А. С. Пушкин, «Евгений Онегин», глава 8", "q": "Свой ум — друг тому, кто им овладел, а тому, кто им не владеет, он враждебен, как враг.", "qs": "Бхагавад-гита 6.6", "qv": 2, "alt": ["Ты уходишь к Онегину. Свет не прощает, генерал глубоко задет, а Онегин, возможно, вновь остывает.", null, "Ты уезжаешь в деревню. Письма Онегина приходят туда же, и разговор откладывается, не закончившись.", "Тайная встреча растягивается на месяцы. Слухи доходят до мужа, а ты теряешь и верность, и любовь."], "fut": ["Ты уходишь к Онегину. К 1835 свет закрывает перед вами двери, а генерал в отставке пишет мемуары, в которых вас нет. К 1850 Онегин снова скучает, а ты остаёшься одна в чужом городе.", null, "Ты уезжаешь в деревню. Письма находят тебя и там. К 1845 ты читаешь их при свече и не отвечаешь, а к 1870 эти письма публикуют без тебя.", "Тайные встречи тянутся. К 1833 слухи доходят до мужа, а к 1840 тебя знает весь Петербург как «ту Ларину». К 1860 письма Онегина читают уже как документ."], "cat": "Литература", "no": 50, "ctx2": "Твой муж, пожилой генерал, заслуженный военный, а в свете тебя считают образцом достоинства. Однажды Онегин приходит к тебе домой и застаёт тебя за его письмом. На кону твоя любовь, твоя честь и верность данному слову.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "S", "T", "R"], "gw": ["Страсть, желание личного счастья вопреки долгу.", "Верность долгу и обету без расчёта на награду.", "Бегство от выбора, избегание ответственности.", "Страсть и желание удержать обе стороны."], "swap": {"role": "Евгений Онегин, помещик", "title": "Ответ на письмо", "ctx": "Ты Евгений Онегин, молодой помещик, живёшь в русской деревне. Твоя соседка, совсем юная Татьяна Ларина, прислала тебе письмо и призналась, что любит тебя, хотя в те времена девушке не полагалось писать первой. Искренность письма тебя тронула. Теперь тебе надо решить, как с ней поступить.", "o": ["Встретиться с ней и честно сказать, что ты не создан для семейной жизни.", "Ответить взаимностью и просить её руки.", "Показать письмо знакомым и посмеяться.", "Вообще не отвечать и избегать Татьяну."], "real": 0, "fact": "Ты решил ответить так же открыто, без уловок. Ты сказал, что если бы создан был для семьи, то выбрал бы только её, но для счастья не создан: ты скоро привыкнешь и разлюбишь, а её слёзы будут тебя только раздражать. Ты предложил ей братскую любовь и посоветовал владеть собой, потому что не всякий поймёт её так, как ты.", "res": "Позже ты убил на дуэли своего друга Ленского и уехал. Спустя годы ты встретил Татьяну уже замужней светской дамой и влюбился в неё. Она ответила, что любит тебя, но отдана другому и будет ему верна.", "src": "А. С. Пушкин, «Евгений Онегин», гл. 4, строфы XII–XVI (английский перевод: york.ac.uk/depts/maths/histstat/pml1/onegin/russrev.docx); конец сюжета: гл. 6 и 8"}}, {"id": "RD-051", "kind": "Жизнь", "who": "Софи и Ханс Шолль, студенты Мюнхенского университета", "when": "18 февраля 1943", "title": "Листовки в университете", "ctx": "Вы с братом входите в подпольную группу «Белая роза», которая распространяет листовки против нацистского режима. В чемодане остались неразданные листовки. Университет полон людей, занятия вот-вот закончатся, а за дверями стоит вахтёр. Гестапо ищет авторов листовок.", "o": ["Оставить листовки у аудиторий и уйти до конца лекций.", "Сбросить остаток листовок с верхнего этажа во двор, где их увидят все.", "Спрятать листовки в университетском подвале и вернуться позже.", "Унести чемодан домой и сжечь листовки."], "real": 1, "fact": "Брат и сестра разложили листовки в пустых коридорах университета, а оставшиеся сбросили с галереи в атриум.", "res": "Их заметил университетский служитель и сообщил в гестапо. Через четыре дня суд приговорил Шолль к смерти, и приговор исполнили в тот же день. Листовки позже переправили в Англию и сбрасывали над Германией с самолётов.", "src": "Биографии «Белой розы»", "q": "На этом пути не пропадает ни одно усилие и нет вреда от неудачи. Даже малая доля этого знания избавляет от великого страха.", "qs": "Бхагавад-гита 2.40", "qv": 2, "alt": ["Листовки остаются у дверей аудиторий, и вы уходите до конца лекций. Возможно, вас не замечают, а возможно, находят тех, кто их читал.", null, "Листовки прячутся в подвале и ждут. Возвращение через день оказывается опаснее, чем разбрасывание сегодня.", "Ты уносишь чемодан и сжигаешь листовки. Группа продолжает работу ещё месяц, а потом гестапо находит другой след."], "fut": ["Листовки остаются у дверей аудиторий. К весне их читают в аудиториях, а к лету о них говорят уже в коридорах. К 1950 в университете висит доска без имён.", null, "Листовки ждут в подвале. Через день их находит уборщик. К 1950 об этой группе помнят лишь одну деталь: подвал.", "Ты уносишь чемодан и сжигаешь листовки. Группа работает ещё месяц, и гестапо находит другой след. К 1945 «Белая роза» известна лишь как несколько фамилий в протоколе, а не как пример для поколений."], "cat": "Совесть и мужество", "no": 51, "ctx2": "Тебе двадцать один год, ты изучаешь биологию и философию. Брат Ханс, двадцати четырёх лет, учится на врача. Группа «Белая роза» напечатала шесть листовок. Шестую вы написали после поражения под Сталинградом вместе с профессором Куртом Хубером. Вы уже отправляли листовки по почте.", "adult": 0, "vs": "спорно", "age": 12, "g": ["R", "S", "T", "T"], "gw": ["Осторожный расчёт, желание влияния и самозащиты.", "Открытое свидетельство правды, принятое с риском смерти.", "Страх и бегство, прятание опасного.", "Страх и уничтожение дела, отказ от борьбы."]}, {"id": "RD-052", "kind": "Жизнь", "who": "Андрей Сахаров, физик и правозащитник", "when": "осень 1981", "title": "Голодовка за невестку", "ctx": "Ты в ссылке в Горьком. Властям нужно твоё молчание, и они держат тебя под надзором. Невестке жены, Елизавете Алексеевой, отказывают в выезде к мужу в США. Протесты письмами не помогают, а здоровье у тебя слабое.", "o": ["Пойти на сделку с властями: молчать в обмен на разрешение.", "Продолжать писать письма и ждать, пока решение изменится.", "Попросить западных учёных организовать кампанию и ничего не делать самому.", "Объявить голодовку, требуя разрешить ей выезд."], "real": 3, "fact": "Сахаров вместе с женой Еленой Боннэр объявил голодовку, требуя выезда Алексеевой.", "res": "Через 17 дней голодовки Алексеевой разрешили выехать, и голодовку прекратили. Во время голодовки Сахарова с женой госпитализировали в Горьком. Позже, в 1984 году, он снова голодал, добиваясь лечения для жены.", "src": "Мемуары Сахарова, исторические обзоры", "q": "Делай то, что должно делать: действие лучше бездействия. Если ничего не делать, не удастся даже поддерживать жизнь тела.", "qs": "Бхагавад-гита 3.8", "qv": 2, "alt": ["Сделка с властями купила бы разрешение за молчание. Ты не критикуешь режим, а режим не меняется.", "Письма уходят и остаются без ответа. Елизавета не получает визу, а ты теряешь ещё год сил на надежду.", "Западные учёные пишут петиции, а ты молчишь. Кампания слабеет без твоего голоса, и власти ждут, пока она забудется.", null], "fut": ["Ты соглашаешься молчать. К 1983 тебе возвращают часть прав, но молчание остаётся тяжёлым компромиссом.", "Письма уходят без ответа. Елизавета остаётся без визы. К 1985 она встречает мужа в Бостоне уже пожилой.", "Западные учёные пишут петиции. Власти ждут. К 1984 кампания затихает, а в Горьком остаётся только тишина, нарушаемая визитами КГБ.", null], "cat": "Совесть и мужество", "no": 52, "ctx2": "С января 1980 года ты в ссылке в Горьком, за тобой следят. Невестке жены Елизавете Алексеевой не дают выехать к мужу Алексею Семёнову в США. Письма не помогают. Здоровье у тебя слабое, а власти могут принудительно госпитализировать и кормить.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "T", "T", "S"], "gw": ["Торг с властью, обмен молчания на выгоду.", "Пассивное ожидание, привычная беспомощность.", "Перекладывает действие на других, уклоняется сам.", "Самоотверженный поступок ради невестки, рискуя собой."]}, {"id": "RD-053", "kind": "Жизнь", "who": "Нильс Бор, физик", "when": "сентябрь 1943", "title": "Бежать из Дании", "ctx": "Дания оккупирована, и ты знаешь, что готовятся аресты датских евреев. Твоя мать была еврейкой. Тебе передают предупреждение о скором аресте, а нацисты и союзники хотят использовать твои знания.", "o": ["Остаться в институте и работать, как будто ничего не происходит.", "Спрятаться в Дании и ждать конца оккупации.", "Бежать в Швецию и просить принять беженцев.", "Перейти на сторону Германии, чтобы защитить институт."], "real": 2, "fact": "Бор бежал на рыбацком катере в Швецию и сразу стал добиваться, чтобы Швеция приняла датских евреев.", "res": "Швеция открыла границу, и более семи тысяч датских евреев удалось переправить через пролив. Бор затем добрался до Британии и США, где работал над атомным проектом.", "src": "Биографии Бора, история спасения датских евреев", "q": "Сын Притхи, ни в этом мире, ни в ином нет гибели для такого человека: тот, кто творит добро, мой друг, никогда не приходит к дурному концу.", "qs": "Бхагавад-гита 6.40", "qv": 2, "alt": ["Ты остаёшься в институте и работаешь. Через неделю гестапо приходит за списками, а твою мать, как еврейку, не защищает ни имя, ни награды.", "Ты прячешься в Дании. Укрытие держится месяцы, а потом тебя находят, и расследование ударяет по всей семье.", null, "Переход на сторону Германии спасает институт, но не совесть. Оккупанты используют тебя в пропаганде, и союзники перестают тебе доверять."], "fut": ["Ты остаёшься в институте. К 1944 гестапо приходит за списками. Для твоей матери нет ни имени, ни наград, ни защиты. К 1950 Копенгаген без Бора, а атомная физика идёт без него.", "Ты прячешься в Дании. К 1944 тебя находят. К 1950 физики Европы вспоминают тебя как человека, который ждал слишком долго.", null, "Ты переходишь на сторону Германии. К 1945 тебя судят как пособника, а в учебниках физики твоё имя пишут мелким шрифтом."], "cat": "Наука", "no": 53, "ctx2": "Ты живёшь в Копенгагене, оккупированной Германии. В августе 1943 года введено военное положение.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "T", "S", "R"], "gw": ["Самообман, делает вид, что опасности нет.", "Пассивное прятание, ожидание, избегание действий.", "Ясное действие: спасение себя и помощь другим.", "Союз с силой ради власти и контроля."]}, {"id": "RD-054", "kind": "Жизнь", "who": "Эдуард VIII, король Великобритании", "when": "10 декабря 1936", "title": "Корона или любовь", "ctx": "Ты король и хочешь жениться на американке Уоллис Симпсон, дважды разведённой. Правительство и церковь против: брак несовместим с титулом главы церкви. Обсуждается морганатический брак, но правительство и доминионы его отвергают.", "o": ["Подписать отречение и жениться на Уоллис.", "Настоять на браке и объявить королевой Уоллис вопреки правительству.", "Жениться тайно и скрывать брак.", "Отказаться от брака и остаться королём."], "real": 0, "fact": "Эдуард подписал отречение и 11 декабря выступил по радио, объяснив, что не может нести бремя без поддержки любимой женщины.", "res": "Престол перешёл к брату Георгу VI. Эдуард стал герцогом Виндзорским и жил за границей. Его позднее критиковали за контакты с нацистской Германией.", "src": "Исторические обзоры", "q": "Кто думает о предметах чувств, у того возникает привязанность к ним; из привязанности рождается желание, из желания — гнев.", "qs": "Бхагавад-гита 2.62", "qv": 2, "alt": [null, "Ты объявляешь Уоллис королевой вопреки правительству. Кабинет подаёт в отставку, парламент отказывается признать брак, и страну охватывает кризис.", "Тайный брак держится недолго. Газеты узнают раньше, чем ты соберёшь доводы, и скандал вспыхивает без твоих объяснений.", "Ты остаёшься королём и отказываешься от брака. Корона сохранена, но человек под ней несчастен, а дворец — холодная клетка."], "fut": [null, "Ты объявляешь Уоллис королевой. К 1937 кабинет уходит, парламент отказывается, а к 1940 Британия — республика, которую никто не просил.", "Тайный брак держится два месяца. К 1937 газеты печатают фото, а к 1940 парламент принимает закон о будущем королей. Тебе остаётся быть историческим примером.", "Ты остаёшься королём. К 1945 корона у тебя на голове уже тяжела, как свинец. К 1972 ты умираешь во дворце, а Уоллис остаётся женщиной в письмах, которые ты не отправил."], "cat": "Власть и война", "no": 54, "ctx2": "С января 1936 года ты король, и Уоллис Симпсон в октябре получила предварительное решение о разводе со вторым мужем. Премьер Болдуин против. Англиканская церковь, доминионы и парламент не одобряют.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "R", "T", "S"], "gw": ["Страсть и личное желание, ставя любовь выше долга.", "Упрямство, желание добиться своего любой ценой.", "Обман и скрытность, бегство от ответственности.", "Долг перед страной выше личного желания."]}, {"id": "RD-055", "kind": "Жизнь", "who": "Горацио Нельсон, вице-адмирал", "when": "2 апреля 1801", "title": "Слепой глаз", "ctx": "Ты ведёшь британскую эскадру в бою у Копенгагена. Бой идёт тяжело, потери растут. Командующий Паркер поднимает сигнал «прекратить бой». Если ты подчинишься, остановишь бой, если нет, рискуешь и флотом, и карьерой.", "o": ["Запросить у Паркера разъяснения и временно остановиться.", "Сделать вид, что не заметил сигнала, и продолжить бой.", "Отвести часть кораблей, а остальным приказать продолжать.", "Подчиниться сигналу и отвести корабли."], "real": 1, "fact": "По преданию, Нельсон приложил подзорную трубу к слепому глазу и сказал, что не видит сигнала. Приказ отступать он не выполнил.", "res": "Нельсон предложил перемирие, датчане его приняли, и бой закончился победой Британии. Нельсона не наказали. Выражение «приложить подзорную трубу к слепому глазу» стало поговоркой.", "src": "Исторические обзоры; подробности предания спорны", "q": "Мудр среди людей тот, кто видит бездействие в действии и действие в бездействии. Он собран и един с истиной, даже когда занят любым делом.", "qs": "Бхагавад-гита 4.18", "qv": 2, "alt": ["Запрос разъяснений тянется, пока датские батареи перезаряжаются. Бой теряет темп, а победа упускается.", null, "Часть кораблей отходит, остальные идут вперёд. Строй ломается, и они остаются одни под огнём.", "Ты подчиняешься сигналу и отводишь корабли. Дания гордится выстоявшей обороной, а твоя репутация падает."], "fut": ["Запрос затянулся. К вечеру датские батареи перезаряжены. К 1802 на британских картах нет Копенгагена, а твоя фамилия в списках потерь.", null, "Часть кораблей отходит. Строй ломается. К 1805 в британском флоте появляется новая тактика: «не разделять эскадру».", "Ты отводишь корабли. К 1805 у Трафальгара вместо Нельсона стоит осторожный адмирал, а к 1815 Наполеон добирается до Лондона раньше, чем в нашей реальности."], "cat": "Власть и война", "no": 55, "ctx2": "Датские корабли стоят в линии, твои садятся на мель. Ты в 1794 году потерял зрение на правый глаз.", "adult": 0, "vs": "спорно", "age": 12}, {"id": "RD-056", "kind": "Жизнь", "who": "Андрей Тарковский, режиссёр", "when": "10 июля 1984", "title": "Остаться на Западе", "ctx": "Ты снимаешь в Италии фильм «Ностальгия». В СССР тебе мешают работать, твои проекты закрывают. Сын и тёща остались дома, возвращаться опасно. Если останешься, возможно, не увидишь семью долго.", "o": ["Вернуться ненадолго, чтобы забрать семью.", "Объявить, что не вернёшься, и добиваться выезда семьи.", "Скрыться, не объявляя о решении, и ждать.", "Вернуться в СССР и продолжить бороться за право снимать."], "real": 1, "fact": "На пресс-конференции в Милане Тарковский заявил, что остаётся на Западе.", "res": "Сына и тёщу не выпускали из СССР до 1986 года, когда Тарковский уже был тяжело болен. Тарковский успел снять «Жертвоприношение» и умер в Париже в декабре 1986.", "src": "Воспоминания, биографии", "q": "Человек должен поднимать себя сам и не давать себе падать: ум бывает другом человека, а бывает его врагом.", "qs": "Бхагавад-гита 6.5", "qv": 2, "alt": ["Короткий визит домой превращается в запрет на выезд. Паспорт остаётся в стенах министерства, а Италия — воспоминанием.", null, "Ты скрываешься, не сообщая решения. Слухи опережают тебя, и в СССР семья узнаёт обо всём из газет.", "Ты возвращаешься в СССР и продолжаешь бороться за право снимать. Проекты закрывают, а ты остаёшься рядом с семьёй, но без фильмов."], "fut": ["Короткий визит. На границе у тебя отбирают паспорт. К 1985 «Ностальгия» остаётся недоснятой, а режиссёр, который мог её закончить, преподаёт во ВГИКе.", null, "Ты скрываешься. Слухи опережают тебя. К 1985 семья узнаёт обо всём из газет, а к 1986 ты уже не можешь объясниться.", "Ты возвращаешься в СССР. К 1986 тебе не дают снять ни одного фильма, а в 2000-м твои сценарии находят в архиве. К 2026 их ставят молодые режиссёры, которые не знают, что они были запрещены."], "cat": "Искусство и слово", "no": 56, "ctx2": "С 1982 года ты снимаешь «Ностальгию» в Италии, фильм получает приз в Каннах. Жена Лариса рядом, но сын Андрей и тёща остались в Москве. Летом 1984 года в Милане ты должен решить, возвращаться ли.", "adult": 0, "vs": "спорно", "age": 12, "g": ["R", "S", "T", "R"], "gw": ["Расчёт и желание контролировать оба исхода.", "Открытая правда, выбор в пользу творчества и семьи.", "Скрытность, пассивное выжидание.", "Стремление к признанию и борьбе внутри системы."]}, {"id": "RD-057", "kind": "Жизнь", "who": "Рудольф Нуреев, танцовщик", "when": "16 июня 1961", "title": "Аэропорт Ле Бурже", "ctx": "Ты на гастролях Кировского театра в Париже. Тебе приказывают вернуться в Москву раньше труппы, сотрудники КГБ сопровождают тебя. Дома тебя ждёт ссылка на периферийную сцену. Если не вернёшься, ты не увидишь родных, а возможно, и родину.", "o": ["Подчиниться и вернуться, надеясь на лучшее.", "Сослаться на болезнь и остаться в Париже на время.", "Уйти ночью к друзьям и скрываться.", "Попросить убежища у французской полиции прямо в аэропорту."], "real": 3, "fact": "В аэропорту Ле Бурже Нуреев бросился к французским полицейским и попросил политического убежища.", "res": "Он стал одной из мировых звёзд балета. Родных он смог навестить лишь в 1987, когда ему разрешили на короткий срок приехать в Уфу.", "src": "Биографии Нуреева", "q": "Делай то, что должно делать: действие лучше бездействия. Если ничего не делать, не удастся даже поддерживать жизнь тела.", "qs": "Бхагавад-гита 3.8", "qv": 2, "alt": ["Ты возвращаешься в Москву. Тебя ждут допросы, ссылка на провинциальную сцену, и мировая звезда не вспыхивает.", "Ты ссылаешься на болезнь и остаёшься в Париже. КГБ даёт сутки, и притворство не выдерживает врачебной проверки.", "Ты уходишь к друзьям и скрываешься. Через день розыск находит тебя, и разговор в аэропорту уже не состоится.", null], "fut": ["Ты возвращаешься в Москву. К 1962 ты танцуешь в провинции, а к 1980 тебя забыли. К 2026 в Лондоне нет музея балета имени Нуреева, потому что некому его назвать.", "Ты ссылаешься на болезнь. КГБ даёт сутки. К 1962 тебя возвращают в Москву в смирительной рубашке «по состоянию здоровья».", "Ты скрываешься у друзей. К рассвету полиция находит тебя. К 1962 слово «выбор» в твоей биографии пишется в кавычках.", null], "cat": "Искусство и слово", "no": 57, "ctx2": "Рядом сотрудники КГБ. Во французском аэропорту ты знаешь, что в СССР тебя ждёт опала.", "adult": 0, "vs": "верно", "age": 12, "g": ["T", "R", "T", "R"], "gw": ["Покорность из страха, слепое подчинение.", "Хитрость, оттягивание ради сохранения выгоды.", "Прятки и бегство от последствий.", "Жажда свободы и творчества, решительный личный выбор."]}, {"id": "RD-058", "kind": "Жизнь", "who": "Александр Солженицын, писатель", "when": "октябрь 1970", "title": "Нобелевская церемония", "ctx": "Тебе присудили Нобелевскую премию по литературе. Власти осуждают тебя, твои книги не печатают. Ты можешь поехать в Стокгольм получить награду, но тогда, по твоим опасениям, тебя не пустят обратно.", "o": ["Не ехать и получить премию позже.", "Поехать в Стокгольм и остаться на Западе.", "Отказаться от премии.", "Поехать и вернуться, рискуя остаться за границей."], "real": 0, "fact": "Солженицын не поехал на церемонию 1970 года, опасаясь, что его не впустят в СССР.", "res": "Он получил диплом и медаль в Стокгольме только в декабре 1974, после высылки из СССР в феврале того же года.", "src": "Воспоминания Солженицына", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": [null, "Ты едешь и остаёшься на Западе. Нобелевская лекция звучит в Стокгольме, а в СССР тебя называют предателем, и книги исчезают из рук.", "Отказ от премии лишает тебя международного щита. Власти без помех расправляются, и мир о тебе слышит позже.", "Ты едешь и возвращаешься, но на границе тебя не впускают. Свою речь ты читаешь за рубежом, а страна, о которой пишешь, закрыта."], "fut": [null, "Ты едешь и остаёшься. К 1975 «Архипелаг» издан на двадцати языках, а ты живёшь в Вермонте и тоскуешь по языку, который здесь никто не слышит. К 2026 твоё имя знают, а прозу перестали читать.", "Ты отказываешься от премии. К 1974 власти без помех высылают тебя. К 1990 о тебе вспоминают как о том, кто мог сказать громче.", "Ты едешь, на границе тебя не впускают. Речь звучит из Стокгольма в записи. К 1975 страна, о которой ты писал, закрыта для тебя, как для всех остальных."], "cat": "Искусство и слово", "no": 58, "ctx2": "Ты автор «Одного дня Ивана Денисовича». С 1969 года ты исключён из Союза писателей. Шведская сторона предлагала вручить премию в Москве в закрытой обстановке, но председателю Шведской академии отказали в визе. Если поедешь в Стокгольм, вернуться можно не успеть.", "adult": 0, "vs": "исправлено", "age": 12}, {"id": "RD-059", "kind": "Жизнь", "who": "Жан-Поль Сартр, философ", "when": "октябрь 1964", "title": "Отказ от Нобелевской премии", "ctx": "Тебе присуждают Нобелевскую премию по литературе. Ты всегда говорил, что писатель не должен превращаться в институт, и отказывался от официальных наград. Премия принесёт деньги и влияние.", "o": ["Отказаться от премии.", "Принять, но передать деньги благотворительности.", "Принять и вести себя как прежде.", "Принять премию и использовать деньги для своих идей."], "real": 0, "fact": "Сартр отказался от премии, объяснив, что не принимает официальных почестей.", "res": "Шведская академия всё равно объявила его лауреатом. Отказ вызвал споры: одни видели в нём принципиальность, другие позу.", "src": "Письма Сартра, биографии", "q": "Мира достигает человек, который отбросил все желания и идёт вперёд без стремлений, без «моё» и без самомнения.", "qs": "Бхагавад-гита 2.71", "qv": 2, "alt": [null, "Деньги передаются в благотворительность, но имя Нобелевского лауреата превращает тебя в монумент. Критики перестают спорить с тобой, а начинают цитировать.", "Ты принимаешь и ведёшь себя как прежде. Но жюри и публика уже смотрят на тебя иначе, и каждый поступок читается как выступление лауреата.", "Ты принимаешь премию и тратишь деньги на левые издания. Идеи поддержаны, но принцип «писатель не институт» остаётся только лозунгом."], "fut": [null, "Ты передаёшь деньги на благотворительность. К 1980 лауреат Нобелевской премии Сартр становится монументом, а не собеседником.", "Ты принимаешь и ведёшь себя как прежде. К 1970 у тебя на стене висит диплом, а в кармане привычка выступать от имени лауреата.", "Ты принимаешь премию и тратишь на левые журналы. К 1975 принцип «писатель не институт» превращается в лозунг, а ты — в директора института собственного имени."], "cat": "Искусство и слово", "no": 59, "ctx2": "В 1945 году ты отказался от ордена Почётного легиона. В 1964 году ты написал письмо в Шведскую академию с просьбой не включать тебя в список, но письмо пришло слишком поздно. Журналисты ждут ответа.", "adult": 0, "vs": "исправлено", "age": 12}, {"id": "RD-060", "kind": "Жизнь", "who": "Альберт Швейцер, музыкант, теолог, врач", "when": "1905", "title": "Стать врачом в Африке", "ctx": "Тебе тридцать. Ты известный органист, исследователь Баха и приват-доцент теологии. Тебе прочили большую карьеру в Европе. Но ты прочитал о нужде людей в Африке и считаешь, что должен помочь делом, а не словами.", "o": ["Помогать, не покидая карьеры, во время отпуска.", "Отправиться миссионером без медицинского образования.", "Остаться в Европе и помогать деньгами.", "Поступить на медицинский факультет и уехать врачом в Африку."], "real": 3, "fact": "Швейцер объявил друзьям, что будет учиться на врача. Он окончил медицинский факультет и в 1913 основал больницу в Ламбарене.", "res": "Много лет он лечил людей в Габоне и в 1953 получил Нобелевскую премию мира за 1952 год. Критики упрекали его в патернализме, а друзья в упрямстве.", "src": "Автобиография Швейцера", "q": "Как неучи действуют, привязавшись к делу, так и знающий должен действовать без привязанности, желая направить людей.", "qs": "Бхагавад-гита 3.25", "qv": 2, "alt": ["Помощь во время отпуска превращается в туристическую поездку. Через год ты помнишь Африку по фотографиям.", "Ты едешь миссионером без медицины. Людям нужен врач, и ты, вместо лекарств, привозишь молитвы.", "Ты остаёшься в Европе и помогаешь деньгами. Больница в Ламбарене не строится, а твоё имя остаётся в списках учёных.", null], "fut": ["Помощь в отпуске превращается в поездку. К 1920 Африка для тебя — альбом фотографий. К 1950 имя Швейцера связывают с органом, а не с людьми.", "Ты едешь миссионером без медицины. К 1915 у тебя двадцать новообращённых и ни одного вылеченного. К 1930 тебя заменяет врач, который приезжает на пароходе с лекарствами.", "Ты остаёшься в Европе и помогаешь деньгами. К 1950 в Габоне нет больницы, в Страсбурге нет органиста, а Бах звучит на пластинках без твоего имени.", null], "cat": "Совесть и мужество", "no": 60, "ctx2": "1905 год, Страсбург. Тебе тридцать, ты приват-доцент теологии, директор колледжа Святого Фомы и органист. Тебя называют надеждой Европы. Твоя близкая подруга Елена Бреслау, городской инспектор по делам сирот, поддерживает твой замысел.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "T", "R", "S"], "gw": ["Желание сохранить карьеру, половинчатое служение.", "Бессознательный поступок без знаний, ведущий к бессилию.", "Откуп от долга, сохраняя привычную жизнь.", "Самоотверженное служение через подготовку и труд."]}, {"id": "RD-061", "kind": "Жизнь", "who": "Роберт Ли, офицер армии США", "when": "апрель 1861", "title": "Предложение командовать", "ctx": "Ты один из лучших офицеров армии США. Президент Линкольн через посредника предлагает тебе возглавить армию Союза. Твой штат Виргиния собирается выйти из Союза, чтобы присоединиться к Конфедерации, которая выступает за сохранение рабства.", "o": ["Принять предложение, но не воевать против Виргинии.", "Принять командование и воевать за Союз.", "Отказаться и выйти в отставку, чтобы возглавить войска Виргинии.", "Отказаться и остаться вне войны."], "real": 2, "fact": "Ли отказался от предложения Линкольна и вскоре ушёл в отставку, чтобы защищать Виргинию.", "res": "Он командовал армией Северной Виргинии и стал символом Юга. Конфедерация проиграла в 1865. Оценка его выбора остаётся предметом споров: многие считают, что он защищал рабство.", "src": "Исторические обзоры", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Ты принимаешь предложение, но отказываешься воевать против Виргинии. Это нельзя назвать командованием, и Вашингтон ищет другого генерала.", "Ты принимаешь командование и воюешь за Союз. Виргиния считает тебя изменником, а твоя семья теряет дом в Арлингтоне раньше.", null, "Ты остаёшься вне войны. Обе стороны ждут твоего слова, а ты теряешь влияние, не сделав выбора."], "fut": ["Ты принимаешь, но не воюешь против Виргинии. К 1861 Вашингтон ищет другого генерала. К 1865 имя Ли в списках второстепенных.", "Ты принимаешь командование. К 1862 Виргиния объявляет тебя изменником, а в Арлингтоне ставят пикеты. К 1865 ты побеждаешь Юг, но проигрываешь родной штат.", null, "Ты остаёшься вне войны. К 1862 обе стороны забывают о тебе. К 1870 ты пишешь мемуары о войне, в которой не участвовал."], "cat": "Власть и война", "no": 61, "ctx2": "17 апреля Виргиния принимает решение о выходе из Союза. Ты полковник армии США с тридцатидвухлетней службой. 18 апреля Фрэнсис Блэр встречается с тобой от имени Линкольна. В Арлингтоне, твоём доме, живёт семья.", "adult": 0, "vs": "спорно", "age": 12}, {"id": "RD-062", "kind": "Жизнь", "who": "Мартин Лютер Кинг, пастор", "when": "4 апреля 1967", "title": "Речь о Вьетнаме", "ctx": "Ты лидер движения за гражданские права. Союзники советуют не критиковать войну во Вьетнаме, потому что так ты потеряешь поддержку президента Джонсона и помощь в законах. Но ты видишь, что война разрушает бедные общины.", "o": ["Высказаться осторожно, не называя виновных.", "Выступить публично против войны.", "Дать частное интервью, не выступая публично.", "Промолчать и сосредоточиться на гражданских правах."], "real": 1, "fact": "Кинг произнёс речь «За пределами Вьетнама» в церкви Риверсайд в Нью-Йорке, осудив войну.", "res": "Его критиковали газеты и часть союзников, Белый дом охладел. Через год он был убит в Мемфисе. Позднее речь признали одной из ключевых в его жизни.", "src": "Текст речи Кинга", "q": "Что делает лучший, то повторяют и остальные; какой пример он подаёт, за тем и идёт весь мир.", "qs": "Бхагавад-гита 3.21", "qv": 2, "alt": ["Осторожное высказывание без имён выгляди
