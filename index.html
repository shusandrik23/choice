const DATA=[{"id": "RD-001", "kind": "Жизнь", "who": "Станислав Петров, подполковник ПВО СССР", "when": "26 сентября 1983", "title": "Ракеты, которых нет", "ctx": "Ты дежурный офицер командного пункта системы раннего предупреждения под Москвой. Спутники показывают запуск одной американской ракеты, потом ещё четырёх. Инструкция требует немедленно доложить о ядерном ударе. До решения у тебя минуты, а отношения СССР и США на пределе.", "o": ["Доложить, что это ложная тревога, и остаться на посту без подтверждения.", "Передать решение вышестоящему генералу, не оценивая сигнал самому.", "Запросить подтверждение у второго пункта и ждать, пока ракеты не долетят.", "Доложить о ракетном нападении по инструкции: система не ошибается."], "real": 0, "fact": "Петров счёл сигнал ложным: ударить пятью ракетами было бы странно, а наземные радары их не подтвердили. Он доложил о сбое системы.", "res": "Тревога оказалась ошибкой: спутник принял блики солнца на облаках за запуски. Петрова не наградили, по его словам, его упрекали за неряшливое ведение журнала. Известность пришла только в 1990-х.", "src": "Рассказы Петрова, публикации об инциденте 1983 года (детали в разных источниках расходятся)", "q": "Это знание, более тайное, чем любая тайна, я тебе открыл. Обдумай его до конца, а потом поступай так, как сам решишь.", "qs": "Бхагавад-гита 18.63", "qv": 2, "alt": [null, "Генерал, получив четыре тревожных сигнала за несколько минут, скорее всего, переложил бы решение выше. Цепочка передач съела бы время, и ошибка превратилась бы в приказ.", "Ожидание подтверждения идёт минуты, а ракеты, будь они настоящими, долетели бы за ту же четверть часа. Если сигнал ложный, ты просто проседаешь над пультом, а если нет, ожидание становится приговором.", "Вероятно, командование поднимает ракеты в ответный удар по сигналу, который был лишь бликом солнца на облаках. В самой мрачной версии история кончается на отметке «без выживших» и о системе предупреждения уже некому писать отчёт."], "fut": [null, "К вечеру генерал, получивший «передачу решения», уже разбудил главнокомандующего. Через неделю в мире действует правило: любой дежурный офицер обязан доложить, не думая. Ошибки перестают быть возможными, и мир живёт на краю до первого бликующего облака.", "Пока ты ждёшь подтверждений, часы идут. В альтернативном 1983-м всё заканчивается красиво и быстро, а спустя десятилетия в архивах находят пометку: «Система сработала верно. Время подтверждения ушло на размышление».", "Через час на картах нет ни Москвы, ни Вашингтона. Школьные учебники будущего, если они появятся, начнут историю с «Дня, когда сигнал оказался верным». Единственный вопрос, который останется, звучит так: а был ли это сигнал?"], "cat": "Власть и война", "no": 1, "ctx2": "Ты на командном пункте «Серпухов-15», где работает спутниковая система «Око». Ты обычно не дежуришь здесь и заменяешь коллегу. Три недели назад советская авиация сбила южнокорейский «Боинг», и в обеих столицах царит напряжение. Наземные радары увидят ракеты только тогда, когда те поднимутся над горизонтом, а до этого остаются считаные минуты.", "adult": 0, "vs": "спорно", "age": 12, "g": ["S", "T", "T", "T"], "gw": ["Ясная оценка, ответственность за решение без страха наказания", "Бегство от ответственности, слепое подчинение иерархии", "Пассивное ожидание, отказ от решения перед угрозой", "Слепое следование инструкции, вера в непогрешимость системы"]}, {"id": "RD-002", "kind": "Жизнь", "who": "Василий Архипов, начальник штаба бригады подводных лодок", "when": "27 октября 1962", "title": "Торпеда с ядерной боеголовкой", "ctx": "Ты на подводной лодке Б-59 у берегов Кубы. Американские эсминцы бросают глубинные бомбы, связи с Москвой нет, воздух отравлен, жара. Командир считает, что началась война, и хочет пустить ядерную торпеду. Для пуска нужно согласие трёх офицеров, и ты третий.", "o": ["Потребовать всплыть и выяснить обстановку, отказав в согласии.", "Согласиться, но предложить пустить торпеду по пустому месту как предупреждение.", "Поддержать пуск: если война уже идёт, медлить нельзя.", "Уйти на глубину и ждать, пока бомбардировка прекратится."], "real": 0, "fact": "По воспоминаниям участников, Архипов отказался давать согласие и убедил командира всплыть и связаться с Москвой.", "res": "Лодка всплыла и вернулась домой. Этот эпизод стал известен публично лишь спустя десятилетия. Историки спорят о деталях, но по распространённой версии для пуска на этой лодке требовалось согласие трёх офицеров (на большинстве лодок хватало двух).", "src": "Воспоминания участников, материалы Архива национальной безопасности США", "q": "Из гнева рождается помрачение, из помрачения — потеря памяти, из потери памяти — гибель рассудка. А когда рассудок погиб, гибнет и сам человек.", "qs": "Бхагавад-гита 2.63", "qv": 2, "alt": [null, "Выстрел «в пустоту» как предупреждение выглядел бы для американцев как ядерная атака. Предсказать реакцию нельзя, но очень вероятно, что эскадра ответила бы тем же.", "Согласие троих офицеров оборачивается пуском торпеды по американской авианосной группе. В гипотетическом продолжении Карибский кризис вырастает из блокады в ядерный обмен, и 27 октября 1962 становится последней датой в расписании человечества.", "Погружение глубже оставило бы лодку без воздуха и связи, а эсминцы продолжили бы сброс глубинных бомб. Перегретый экипаж мог принять пуск единственным выходом."], "fut": [null, "Предупредительный «выстрел в пустоту» понимают как нападение. Через неделю обе стороны находятся в состоянии ядерной войны, которое потом называют «Недолгим октябрём».", "Через сутки оба флота обмениваются ударами. Кубинский кризис попадает в школьные учебники как последняя глава перед паузой в человеческой истории. В хронике остаётся строчка о подлодке, чья команда не дождалась ответа Москвы.", "Лодка уходит на глубину, но воздуха там не хватает. Через несколько часов экипаж принимает решение, которое не принимал никто из выживших в нашей истории. Конец у этого рассказа тихий."], "cat": "Власть и война", "no": 2, "ctx2": "Лодка Б-59 дизельная, и у берегов Кубы она всплывает редко. Аккумуляторы почти разряжены, кондиционеры отказали, в отсеках около пятидесяти градусов, а воздух отравлен углекислым газом. Связи с Москвой нет уже несколько суток.", "adult": 0, "vs": "спорно", "age": 12, "g": ["S", "R", "T", "T"], "gw": ["Бесстрашный отказ ради предотвращения войны, ясность суждения", "Компромисс-жест: показать силу, сохранить лицо и контроль", "Поддаётся панике и страху, ведёт к разрушению", "Пассивное бегство от решения, надежда переждать"]}, {"id": "RD-003", "kind": "Жизнь", "who": "Оскар Шиндлер, промышленник", "when": "1944", "title": "Фабрика или бегство", "ctx": "Ты немецкий фабрикант в оккупированной Польше, на твоём заводе работают евреи, и ты платишь взятки, чтобы они остались живы. Фронт приближается, лагерь вот-вот закроют, рабочих отправят в Освенцим. Ты можешь закрыть дело и уйти с деньгами.", "o": ["Закрыть завод, забрать деньги и уехать до прихода Красной армии.", "Перенести завод в Судеты и увезти рабочих, потратив на это состояние.", "Оставить рабочих лагерному начальству и попросить не трогать хотя бы часть.", "Договориться только о нескольких ключевых специалистах, остальных не спасать."], "real": 1, "fact": "Шиндлер добился переноса производства в Брюннлиц, а списки рабочих составлялись и менялись при участии заключённых и его сотрудников, заплатив эсэсовцам крупные суммы за людей из списка.", "res": "Около 1100–1200 человек пережили войну. Сам Шиндлер остался без средств и после войны жил нелегко, ему помогали спасённые и еврейские организации. В 1993 году о нём сняли фильм.", "src": "Мемориал Яд ва-Шем, биографические источники", "q": "Дар, который отдают просто потому, что давать нужно, ничего не ожидая взамен, в подходящее время и в подходящем месте человеку достойному, называют чистым.", "qs": "Бхагавад-гита 17.20", "qv": 2, "alt": ["Ты уезжаешь с деньгами и чистой совестью, но не слишком чистой. Около тысячи двухсот человек остаются на милость лагерного начальства, и о заводе вспоминают как о недолгом периоде, когда у них была надежда.", null, "Просьба «не трогать хотя бы часть» разбилась бы о равнодушие начальства. Лагеря эвакуируют по общему графику, и никто не станет разбирать, кто работал на тебя.", "Ты оставляешь пару десятков нужных специалистов. Они переживают войну, остальные остаются там, где решения принимают другие, и список превращается в календарь потерь."], "fut": ["Ты уезжаешь с деньгами и живёшь долго и богато в Аргентине. Лишь на склоне лет понимаешь, что никто не знает твоего имени, и никто никогда не споёт о заводе, который ты закрыл.", null, "Тот, кого ты просил «не тронуть», оказывается в списке на следующий день. Спустя десятилетия внуки будут искать в архивах хотя бы одно имя из этих списков и не найдут.", "Двадцать спасённых специалистов вырастают в двадцать семей, но остальные остаются без защиты. Через пятьдесят лет на твоей могиле написано «справедливый», а рядом ни одного из тех, кого ты не спас."], "cat": "Совесть и мужество", "no": 3, "ctx2": "Завод эмалированной посуды в Кракове даёт тебе деньги и право держать на нём рабочих. Есть приказ эвакуировать лагеря перед приходом Красной армии. Новое место в Брюннлице придётся выбивать у чиновников, платя им, и каждого человека в списке придётся вписывать лично. Лагерное начальство не обязано тебе верить.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "S", "T", "R"], "gw": ["Спасение собственного богатства и положения ради выгоды", "Самоотверженная жертва состоянием ради спасения людей", "Бегство от ответственности, малодушная просьба вместо действий", "Расчётливый выбор полезных, прагматичная выгода и контроль"]}, {"id": "RD-004", "kind": "Жизнь", "who": "Авраам Линкольн, президент США", "when": "лето 1862", "title": "Когда объявлять свободу", "ctx": "Ты президент в разгар Гражданской войны. У тебя готов проект Прокламации об освобождении рабов, но армия Севера терпит поражения. Госсекретарь предупреждает, что документ, выпущенный сейчас, прозвучит как отчаянный шаг.", "o": ["Убрать проект в стол и вернуться к вопросу после войны.", "Отложить до победы на поле боя, чтобы документ выглядел решением, а не мольбой.", "Издать прокламацию немедленно, не откладывая ни дня.", "Отдать решение Конгрессу и принять его вердикт."], "real": 1, "fact": "Линкольн спрятал проект и ждал победы. После сражения при Энтитеме он издал предварительную прокламацию 22 сентября 1862, окончательную 1 января 1863.", "res": "Прокламация не освободила рабов в одночасье, но изменила цели войны, а окончательная прокламация открыла путь к массовому набору чернокожих в армию. Позже 13-я поправка закрепила отмену рабства.", "src": "Архивы Национального архива США", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Проект лежит в столе до конца войны, и армии Севера воюют без главного лозунга. Темнокожие не вступают в армию Союза, а война тянется дольше и обходится дороже.", null, "Прокламация, выпущенная при поражениях Севера, читается как отчаянный манёвр. Европейские газеты смеются, а Британия, возможно, признаёт Конфедерацию. В самом мрачном варианте Союз проигрывает войну, и рабство живёт ещё десятилетия.", "Конгресс устраивает долгие дебаты, часть штатов блокирует, а лозунг теряет силу. К моменту голосования война идёт уже без того, на что рассчитывал президент."], "fut": ["Проект лежит в столе до конца войны, но война завершается без отмены рабства. Через пятьдесят лет в США всё ещё две страны, говорящие на одном языке, но не одинаково понимающие слово «свобода».", null, "Прокламация, выпущенная в самый тёмный месяц, оказывается воспринята как крик отчаяния. Британия признаёт Конфедерацию, а к 1900 году на юге США всё ещё работают плантации. Темнокожие граждане получают права в 1960-х, а не в 1860-х.", "Конгресс спорит год, и к лету 1863-го Союз ослабевает. К концу десятилетия правительство в Вашингтоне занимается условиями мира, а не свободой."], "cat": "Власть и война", "no": 4, "ctx2": "Летом 1862 года ты показал проект прокламации кабинету. Армия Севера не смогла взять Ричмонд и отступила на полуострове, а Юг перехватил инициативу. Европейские правительства следят, кого признать: Север или Юг.", "adult": 0, "vs": "исправлено", "age": 12}, {"id": "RD-005", "kind": "Жизнь", "who": "Гарри Трумэн, президент США", "when": "июль 1945", "title": "Бомба или вторжение", "ctx": "Ты президент и вчера узнал об успешном испытании атомного оружия. Планы вторжения на японские острова обещают тяжёлые потери с обеих сторон. Япония не принимает условия капитуляции. Советский Союз готовится вступить в войну на Дальнем Востоке.", "o": ["Применить бомбу по японским городам и ускорить конец войны.", "Отложить решение и ждать вступления СССР в войну.", "Устроить показательный взрыв над ненаселённой территорией.", "Смягчить условия капитуляции и вести переговоры дальше."], "real": 0, "fact": "Трумэн разрешил использовать бомбу. 6 августа бомбардировке подверглась Хиросима, 9 августа Нагасаки.", "res": "Япония объявила о капитуляции 15 августа 1945. Историки до сих пор спорят, что именно привело к капитуляции и были ли альтернативы. Погибли более сотни тысяч человек, многие умирали годами позже.", "src": "Материалы Потсдамской конференции, историография", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": [null, "Пока ты ждёшь, СССР вступает в войну, и Япония оказывается между двух огней. В гипотетической версии Дальний Восток делится по другим границам, а карта холодной войны выглядит иначе.", "Взрыв над ненаселённой территорией впечатляет весь мир, но в Токио его, возможно, принимают за блеф. Война тянется к высадке, а историки через десятилетия спорят, что сохранило бы больше жизней.", "Смягчённые условия капитуляции спасают, возможно, часть жизней, но Токио тянет время. Военные отказываются считать это победой союзников, и война идёт дальше."], "fut": [null, "СССР успевает вступить в войну и занимает северные острова Японии, а может быть и больше. В альтернативной Японии возникает вторая Корея, разделённая по линии фронта.", "Взрыв над пустыней впечатляет мир, но в Токио его принимают за блеф. Война тянется до зимы, а потом высадка превращает остров в кладбище. Историки до сих пор спорят, что унесло больше жизней.", "Мягкие условия капитуляции принимают, но милитаристы не согласны. Через два года в Японии происходит новый переворот, а мир тревожно смотрит на Токио."], "cat": "Власть и война", "no": 5, "ctx2": "Потсдамскую декларацию с требованием капитуляции Япония отвергла. Планируется высадка на Кюсю осенью, и военные ждут тяжёлых потерь. СССР обещал вступить в войну против Японии примерно через три месяца после победы над Германией.", "adult": 0, "vs": "спорно", "age": 12, "swap": {"role": "Хирохито, император Японии", "title": "Решение императора", "ctx": "Ты император Японии Хирохито, август 1945 года. Города разрушены бомбёжками, на Хиросиму и Нагасаки сброшены атомные бомбы, Советский Союз вступил в войну. Шестеро главных министров и военачальников разделились поровну. Премьер Судзуки, министр иностранных дел Того и морской министр Енай хотят принять условия союзников из Потсдамской декларации, сохранив императорскую власть. Армейский министр Анами и начальники штабов Умэдзу и Тоёда требуют ещё условий, например самим разоружаться и не допускать оккупации, и тебя просят разрешить спор, чего раньше никогда не бывало.", "o": ["Продолжать войну по плану обороны «Кэцу-го» и ждать вторжения.", "Принять Потсдамскую декларацию с одним условием: сохранить императорскую власть.", "Поддержать армию: принять декларацию только с четырьмя условиями.", "Принять Потсдамскую декларацию без всяких условий."], "real": 1, "fact": "Ты поддержал предложение с одним условием: сохранить императорский институт. Ты сказал, что надо «вынести невыносимое». Среди причин ты назвал потерю веры в план обороны, растущие разрушения от бомбёжек и обстановку в стране, прежде всего нехватку еды и страх бунта.", "res": "Шестёрка, а затем и всё правительство приняли твоё решение. Союзники согласились принять капитуляцию, но поставили императора под власть командующего оккупационными войсками; снова начался спор, и ты вмешался, сказав, что тебя устраивает американский ответ. 15 августа в Токио часть военных попыталась сорвать запись твоего обращения о капитуляции, но мятеж подавили.", "src": "Национальный музей Второй мировой войны (США), «Japan's Surrender»: nationalww2museum.org/war/articles/japans-surrender-military-coup-1945"}}, {"id": "RD-006", "kind": "Жизнь", "who": "Уинстон Черчилль, премьер-министр Великобритании", "when": "26–28 мая 1940", "title": "Мир с Гитлером", "ctx": "Франция рушится, британская армия окружена у Дюнкерка. Министр иностранных дел предлагает через Муссолини узнать условия мира с Германией. Ты только что стал премьером, и твоя позиция в кабинете шаткая.", "o": ["Продолжить войну и отказаться от любых переговоров.", "Передать решение парламенту без собственной позиции.", "Согласиться на посредничество Муссолини и выяснить, чего хочет Гитлер.", "Заявить о готовности к переговорам, но готовиться к обороне тайно."], "real": 0, "fact": "Черчилль выступил против переговоров и перед расширенным кабинетом получил поддержку. Кабинет решил драться.", "res": "Из Дюнкерка эвакуировали около 338 тысяч человек. Британия выстояла в битве за Британию, а война затянулась на пять лет. Историки до сих пор спорят, насколько реальны были условия Гитлера.", "src": "Протоколы военного кабинета", "q": "Считай одинаковыми радость и боль, выгоду и убыток, победу и поражение — и вступай в бой. Так ты не возьмёшь на себя вины.", "qs": "Бхагавад-гита 2.38", "qv": 2, "alt": [null, "Парламент спорит неделю, а немцы уже в Дюнкерке. Без твоей позиции кабинет раскалывается, и решение принимают те, кто первым устал.", "Посредничество Муссолини запускает торг: Гитлер соглашается, но на условиях, которые превращают Британию в сателлита. Дюнкерк эвакуирует армию в страну, которая уже не воюет, а Европа замирает в нацистской тени.", "Публичная готовность к переговорам рушит дух нации, а тайные приготовления быстро становятся известны. Вероятно, правительство не доживает до зимы."], "fut": [null, "Парламент спорит, а в Дюнкерке тем временем решается всё. Без твоей позиции кабинет раскалывается на две партии, и каждая подписывает собственный мир.", "Муссолини посредничает, Гитлер выдвигает условия. К 1941 Британия — союзник рейха, и Европа 80 лет живёт в тени свастики. В альтернативном учебнике «Дюнкерк» — год примирения.", "Публичные намёки на переговоры лишают страну стойкости. Правительство падает к осени, а новые лица делают то, что обещал Гитлер. Через десять лет в Лондоне другой язык приказов."], "cat": "Власть и война", "no": 6, "ctx2": "Военный кабинет заседает три дня подряд. Ты знаешь, что любой намёк на переговоры станет известен и ослабит стойкость страны.", "adult": 0, "vs": "спорно", "age": 12, "g": ["S", "T", "T", "R"], "gw": ["Твёрдость долга, ясность перед лицом угрозы без расчёта выгоды", "Бегство от ответственности, слабость позиции перекладывается на парламент", "Страх и поддакивание, отсутствие ясной воли", "Двойная игра ради сохранения власти и контроля"]}, {"id": "RD-007", "kind": "Жизнь", "who": "Джон Кеннеди, президент США", "when": "октябрь 1962", "title": "Ракеты на Кубе", "ctx": "Разведка нашла на Кубе советские ракеты. Военные советуют бомбить площадки и вторгнуться. Ты понимаешь, что ответом может быть ядерная война. Времени мало, а помощники разделились.", "o": ["Объявить морской карантин Кубы и вести переговоры.", "Ничего не предпринимать публично, только тайно написать Хрущёву.", "Начать вторжение на Кубу, чтобы устранить угрозу раз и навсегда.", "Нанести воздушный удар по ракетным площадкам."], "real": 0, "fact": "Кеннеди объявил морской карантин 22 октября, оставив место для диалога. Параллельно через брата Роберта пошли тайные переговоры.", "res": "28 октября Хрущёв согласился убрать ракеты. Позже стало известно о тайном обещании США вывести ракеты из Турции. Мир остановился в шаге от войны.", "src": "Материалы Исполкома Совета нацбезопасности США", "q": "Мудрецом с твёрдым умом называют того, кто не падает духом в несчастье, не жаждет радостей и свободен от страсти, страха и гнева.", "qs": "Бхагавад-гита 2.56", "qv": 2, "alt": [null, "Тайное письмо без публичных мер выглядит слабостью. Хрущёв не торопится, ракеты на Кубе становятся действующими, и США получают угрозу в двух сотнях километров от Флориды.", "Вторжение на Кубу встречает советские войска, о которых американская разведка не знала. В гипотетической версии бои идут неделю, а ядерная тактика становится обсуждаемым вариантом.", "Воздушный удар уничтожает часть ракет, но не все. Хрущёв отвечает в Берлине или на Кубе, и конфликт, начатый как точечная операция, быстро выходит из-под контроля."], "fut": [null, "Тайная записка не помогает: Хрущёв воспринимает молчание как слабость. К 1963 году ракеты на Кубе действуют, а США существуют под их тенью.", "Вторжение застаёт врасплох американцев и русских одновременно. К 1963 году Куба становится пустыней, а Карибский бассейн остаётся зоной, которую обходят самолёты.", "Воздушный удар разрушает часть ракет, остальные пускают в ответ. Берлин превращается в первый горящий город третьей мировой. Через пятьдесят лет люди отмечают дату «Дня после»."], "cat": "Власть и война", "no": 7, "ctx2": "16 октября тебе показали снимки самолёта-разведчика U-2 с ракетными площадками на Кубе. Совет по нацбезопасности спорит несколько дней: начальники штабов требуют удара и вторжения. Позже выяснится, что на острове уже около сорока тысяч советских военных и тактическое ядерное оружие, но тебе это ещё неизвестно.", "adult": 0, "vs": "верно", "age": 12, "g": ["S", "T", "R", "R"], "gw": ["Взвешенное решение, сдержанность ради предотвращения войны", "Пассивность и самообман, бегство от решения", "Жажда силы и окончательной победы, импульсивная агрессия", "Силовой удар ради контроля и престижа"], "swap": {"role": "Никита Хрущёв, глава СССР", "title": "Ответ Кеннеди", "ctx": "Ты Никита Хрущёв, руководитель Советского Союза, осень 1962 года. Твои ракеты стоят на Кубе, а американский флот вводит морской карантин и требует их убрать. Ты уже написал Кеннеди два письма: в первом предложил убрать ракеты, если США обещают не нападать на Кубу, а во втором добавил, что США должны убрать свои ракеты «Юпитер» из Турции. Кеннеди проигнорировал второе письмо и ответил на первое. Его брат Роберт неофициально сообщил послу Добрынину, что «Юпитеры» из Турции скоро уберут, но об этом нельзя говорить публично. Тебе надо решить, что делать дальше.", "o": ["Потребовать публичного обмена: Куба за Турцию, иначе не уступать.", "Тянуть время и ждать, пока США уступят первыми.", "Ужесточить позицию: держать ракеты на Кубе и готовиться к войне.", "Принять предложение Кеннеди и объявить, что ракеты будут вывезены."], "real": 3, "fact": "Ты принял предложение. 28 октября Москва по радио передала твоё сообщение Кеннеди: отдан новый приказ демонтировать «наступательное» оружие и вернуть его в СССР.", "res": "Кеннеди сразу принял это решение и назвал его «государственным». Фидель Кастро был в ярости. Обещание про Турцию осталось тайным: «Юпитеры» убрали в апреле 1963 года. Считается, что эта уступка помогла сместить тебя в 1964 году.", "src": "history.state.gov/milestones/1961-1968/cuban-missile-crisis; cfr.org/articles/twe-remembers-jfk-and-khrushchev-agree-deal-cuban-missile-crisis-day-thirteen; history.com (Khrushchev orders withdrawal of missiles from Cuba); протокол Президиума ЦК КПСС от 28 октября 1962 (Wilson Center)"}}, {"id": "RD-008", "kind": "Жизнь", "who": "Махатма Ганди, лидер ненасильственного движения", "when": "февраль 1922", "title": "Остановить победу", "ctx": "Движение несотрудничества охватило Индию, англичане растеряны. В деревне Чаури-Чаура толпа сожгла полицейский участок, погибли 22 полицейских. Лидеры движения уверены, что до победы рукой подать.", "o": ["Осудить виновных и продолжить, но с жёсткими правилами.", "Продолжить движение: насилие случайно, нельзя останавливать историю.", "Свернуть кампанию, потому что движение вышло из-под ненасильственного контроля.", "Передать руководство более радикальным лидерам и уйти в сторону."], "real": 2, "fact": "Ганди приостановил кампанию по всей стране и объявил пятидневный пост в знак покаяния.", "res": "Многие соратники, включая Неру, были потрясены. В марте Ганди арестовали, дали шесть лет, а освободили в 1924. Движение потеряло темп, но принцип ненасилия остался его основой.", "src": "Автобиография Ганди, исторические обзоры", "q": "Мне дорог тот, кто не тревожит мир, и кого мир не тревожит, кто свободен от вспышек радости, обиды, страха и смятения.", "qs": "Бхагавад-гита 12.15", "qv": 2, "alt": ["Жёсткие правила на бумаге не удержали бы миллионы людей. Движение раскалывается на тех, кто за правила, и тех, кто за мщение.", "Кампания продолжается, и насилие множится: после Чаури-Чаура случается второй и третий пожар. Англичане отвечают жёстко, и независимость Индии превращается в долгую партизанскую войну.", null, "Радикалы принимают руководство и меняют метод. Ненасилие остаётся красивым словом в книгах, а освобождение приходит позже и через кровь."], "fut": ["Жёсткие правила превращаются в дисциплину армии. Через десять лет Индия получает независимость от толпы, а не от переговоров.", "Кампания продолжается, насилие растёт. Англия отвечает расстрелами, и независимость приходит в 1960-х, но в виде кровавой войны, о которой вспоминают как о вынужденной необходимости.", null, "Радикалы берут верх и меняют метод. Мир учится у Индии не ненасилию, а партизанской войне."], "cat": "Совесть и мужество", "no": 8, "ctx2": "Погибли двадцать два человека. Ты уверен, что движение утратило ненасильственный характер.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "T", "S", "T"], "gw": ["Стремление сохранить плоды движения, привязанность к результату", "Слепое оправдание насилия, самообман ради победы", "Верность принципу ненасилия вопреки желанной победе", "Бегство от ответственности, уход от решения"]}, {"id": "RD-009", "kind": "Жизнь", "who": "Нельсон Мандела, заключённый", "when": "февраль 1985", "title": "Свобода на условиях", "ctx": "Ты провёл в тюрьме 22 года. Президент ЮАР Боте предлагает освобождение, если ты публично откажешься от вооружённой борьбы. Твоя семья рядом, здоровье слабеет, борьба идёт без тебя.", "o": ["Принять, но потом отречься от слов.", "Попросить время и передать ответ через адвокатов, затянув решение.", "Принять условие: выйти на свободу и продолжить борьбу снаружи.", "Отказаться: свобода без права на участие в политике это не свобода."], "real": 3, "fact": "Ответ Манделы прочитала его дочь Зинзи на митинге в Соуэто: свобода должна быть безусловной, а заключённые не могут вести договоры.", "res": "Мандела оставался в заключении до 11 февраля 1990. Позже он стал президентом ЮАР. Многие считают, что его отказ укрепил моральный авторитет движения.", "src": "Речь Зинзи Манделы 1985", "q": "Кого эти касания не мучают, лучший из людей, кто ровен и в боли, и в радости, и стоек, тот достоин бессмертия.", "qs": "Бхагавад-гита 2.15", "qv": 2, "alt": ["Отречение от слов позже превращается в скандал. Правительство использует это против тебя, а движение теряет моральное преимущество.", "Затягивание решения даёт властям повод сказать, что ты колеблешься. Вероятно, тебе предложат условия ещё жёстче, а время идёт.", "Ты выходишь на свободу и сразу попадаешь в опалу у товарищей по борьбе. Многие считают это капитуляцией, и твой авторитет, возможно, тает за год.", null], "fut": ["Отречение, а потом возвращение к борьбе делают тебя символом двуличия. Через пять лет правительство использует эту запись, чтобы расколоть движение.", "Затягивание решения выглядит нерешительностью. К 1990 году лидером становится другой человек, а ты остаёшься тихим пенсионером.", "Ты выходишь на свободу и теряешь доверие товарищей. К 1990 году движение раскалывается, а Южная Африка идёт к войне, которой удалось избежать.", null], "cat": "Совесть и мужество", "no": 9, "ctx2": "Ты сидишь в тюрьме больше двадцати двух лет, сначала на острове Роббен, потом в Поллсморе. Здоровье подводит. Президент Боте предложил свободу на условии отказа от насилия и объявил об этом в парламенте. Движение растёт на улицах и за границей, а правительство не сдаётся.", "adult": 0, "vs": "верно", "age": 12}, {"id": "RD-010", "kind": "Жизнь", "who": "Галилео Галилей, учёный", "when": "1633", "title": "Отречься или нет", "ctx": "Ты стар и болен, предстоишь перед инквизицией. Тебя обвиняют в защите учения Коперника. Тебе дают понять, что отказ отречься грозит тюрьмой, пыткой и костром, как для Бруно. Ты убеждён, что прав.", "o": ["Заявить, что это лишь математическая гипотеза, а не утверждение о мире.", "Твёрдо стоять на своём и принять любые последствия.", "Сбежать в протестантскую страну и продолжить там.", "Публично отречься от учения Коперника."], "real": 3, "fact": "22 июня 1633 Галилей встал на колени и отрёкся. Знаменитое «И всё-таки она вертится» не подтверждено современными источниками.", "res": "Его приговорили к тюремному заключению, которое вскоре заменили домашним арестом до конца жизни. В заточении он написал «Беседы о двух новых науках», изданные в 1638. Католическая церковь признала ошибку лишь в конце XX века.", "src": "Протоколы суда над Галилеем", "q": "Соприкосновения чувств с предметами дают холод и жар, радость и боль. Они приходят и уходят, они непостоянны. Терпи их, потомок Бхараты.", "qs": "Бхагавад-гита 2.14", "qv": 2, "alt": ["Гипотеза вместо утверждения даёт временную передышку. Инквизиция не верит, и тебе предъявляют новое обвинение в лукавстве.", "Ты стоишь на своём и тебя отправляют в тюрьму, возможно, на костёр. «Беседы о двух новых науках» остаются ненаписанными, а механика движется медленнее.", "Побег в протестантскую страну спасает от инквизиции, но делает тебя беглецом. Католический мир закрывает двери, а работа идёт в бедности.", null], "fut": ["Гипотеза вместо утверждения даёт временную передышку, но инквизиция считает это лукавством. Приговор мягче, но «Беседы» остаются ненаписанными.", "Ты стоишь на своём. Костёр на Кампо-деи-Фьори горит, но мир уже знает его формулы. Науку замедляют на несколько десятилетий, а Ньютон получает полки с неполными бумагами.", "Протестантская страна принимает тебя как героя. Через десять лет ты основываешь школу, куда едут учёные Европы, а Рим остаётся без главной научной звезды.", null], "cat": "Наука", "no": 10, "ctx2": "Ты опубликовал «Диалог о двух главнейших системах мира», и Папа Урбан VIII, когда-то твой друг, остался недоволен. Тебе шестьдесят девять, ты болен, и тебя вызвали в Рим, а приговор огласили в монастыре Санта-Мария-сопра-Минерва.", "adult": 0, "vs": "исправлено", "age": 12}, {"id": "RD-011", "kind": "Жизнь", "who": "Сократ, философ", "when": "399 до н. э.", "title": "Побег перед казнью", "ctx": "Тебя приговорили к смерти по обвинению в неуважении к богам и развращении юношей. Друг Критон подкупил стражу и предлагает бежать. Тебе 70 лет, у тебя дети, и приговор многие считают несправедливым.", "o": ["Попросить друзей собрать деньги на выкуп наказания.", "Бежать в другой город и жить в изгнании.", "Остаться и принять казнь, потому что закон надо чтить и тогда, когда он ошибается.", "Бежать, но потом вернуться и оспорить приговор."], "real": 2, "fact": "По Платону («Критон», «Федон»), Сократ отказался бежать и выпил цикуту.", "res": "Его смерть стала символом верности принципам. Последователи, прежде всего Платон, развили его учение. Афиняне впоследствии, по преданию, раскаялись.", "src": "Платон, «Критон» и «Федон»", "q": "Для рождённого смерть неизбежна, для умершего неизбежно новое рождение. Поэтому о том, чего не миновать, тебе не стоит скорбеть.", "qs": "Бхагавад-гита 2.27", "qv": 2, "alt": ["Выкуп оставляет тебя в Афинах без права учить. Ученики остаются без наставника, а философия превращается в кружок по интересам.", "Ты бежишь в Фессалию и живёшь в изгнании. Афиняне говорят, что философ нарушил закон, а сам ты больше не можешь говорить, что закон выше жизни.", null, "Побег с возвращением превращает тебя в посмешище. Суд повторяется, и приговор уже не вызывает сочувствия."], "fut": ["Выкуп устраивает суд. Сократ остаётся жив, но запрещает себе вести беседы. Ученики расходятся, и школа не возникает.", "Ты бежишь и живёшь в Фессалии. Афины забывают тебя за год. Платон пишет диалоги о философе, который не умер, а потому не стал символом.", null, "Побег и возвращение превращают тебя в комичного старика. Афиняне смеются, и философия получает репутацию забавы."], "cat": "Совесть и мужество", "no": 11, "ctx2": "Суд из пятисот одного афинянина признал тебя виновным, а потом приговорил к смерти. Исполнение отложено на месяц, пока священный корабль не вернётся с Делоса. Ты в тюрьме, и друзья готовят побег.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "R", "S", "R"], "gw": ["Торг, попытка договориться и смягчить исход, привязанность к жизни", "Бегство ради сохранения жизни и привязанности к семье", "Верность закону и долгу без привязки к исходу", "Хитрый расчёт: избежать казни и сохранить возможность борьбы"]}, {"id": "RD-012", "kind": "Жизнь", "who": "Мартин Лютер, монах и профессор", "when": "апрель 1521", "title": "Вормс", "ctx": "Тебя вызвали на рейхстаг в Вормс перед императором. Тебе показывают твои книги и требуют отречься. Ты знаешь, что Гус был сожжён после такого же вызова, несмотря на охранную грамоту.", "o": ["Отказаться, пока тебя не убедят доводами из Писания и разума.", "Попросить отсрочку и уехать, не отвечая.", "Отречься и сохранить жизнь и положение.", "Бежать до начала слушания."], "real": 0, "fact": "Лютер попросил день на размышление, а затем заявил, что не отречётся, пока его не убедят Писанием и ясными доводами. Фраза «На том стою» известна по более поздним записям.", "res": "Император объявил его вне закона, но курфюрст Фридрих Мудрый спрятал его в замке Вартбург, где Лютер перевёл Новый Завет на немецкий. Это дало толчок Реформации.", "src": "Протоколы рейхстага в Вормсе", "q": "Лучше свой долг, пусть исполненный несовершенно, чем чужой, исполненный хорошо. Лучше погибнуть в своём деле: чужой путь опасен.", "qs": "Бхагавад-гита 3.35", "qv": 2, "alt": [null, "Отсрочка без ответа возвращает тебя в Виттенберг без охраны. Император не прощает, и охранная грамота истекает.", "Отречение сохраняет жизнь и положение. Реформация, возможно, остаётся ссорой монахов, а печатные станки заняты другими спорами.", "Бегство до слушания выглядит признанием вины. Тебя ловят на дороге, и дело завершается быстрее, чем рождаются сторонники."], "fut": [null, "Без охранной грамоты дорога в Виттенберг становится дорогой к костру. Реформация обходится без главного оратора.", "Ты отрекаешься и остаёшься профессором. Реформация откладывается на поколение, а Библия остаётся у священников.", "Бегство делает тебя изгнанником. Через десять лет о тебе помнит один печатник, а Европа делится по другим линиям."], "cat": "Совесть и мужество", "no": 12, "ctx2": "В 1517 году ты вывесил свои тезисы, а в январе 1521 года тебя отлучили от церкви. Император Карл V вызвал тебя в Вормс и дал охранную грамоту.", "adult": 0, "vs": "верно", "age": 12, "g": ["S", "T", "R", "T"], "gw": ["Верность совести и истине, готовность принять последствия", "Уклонение и бегство от ответа", "Отречение ради жизни и положения, привязанность к статусу", "Страх и бегство от слушания"]}, {"id": "RD-013", "kind": "Жизнь", "who": "Дмитрий Шостакович, композитор", "when": "1936", "title": "После «Сумбура вместо музыки»", "ctx": "«Правда» разгромила твою оперу «Леди Макбет Мценского уезда», по слухам, по указанию Сталина. Вокруг арестовывают знакомых. Ты заканчиваешь четвёртую симфонию, самую смелую свою работу.", "o": ["Переписать симфонию в духе «социалистического реализма».", "Выпустить симфонию как есть, не меняя ни одной ноты.", "Снять симфонию с репетиций, не объясняя причин.", "Уехать на гастроли и остаться за границей."], "real": 2, "fact": "Четвёртая симфония была снята с репетиций перед премьерой: по официальному сообщению, по просьбе Шостаковича, по свидетельству Гликмана, под давлением чиновников. Затем написал Пятую, подаваемую как творческий ответ на критику.", "res": "Четвёртая симфония прозвучала только в 1961. Пятая стала триумфом. Историки спорят о её двойном смысле. Шостакович остался в СССР и пережил ещё несколько кампаний.", "src": "Биографии композитора", "q": "Мудр среди людей тот, кто видит бездействие в действии и действие в бездействии. Он собран и един с истиной, даже когда занят любым делом.", "qs": "Бхагавад-гита 4.18", "qv": 2, "alt": ["Переписанная под «реализм» симфония выходит бесцветной. Ты получаешь премии, но теряешь собственный голос.", "Симфония звучит на премьере и разваливается о партийную критику. Тебя вычёркивают из репертуара, а возможно, и из списка живых.", null, "Гастроли и невозвращение спасают от гнева власти, но не от одиночества. Семья остаётся в Ленинграде, и за неё отвечают."], "fut": ["Ты пишешь «социалистический реализм» и получаешь премии. Через пятьдесят лет Шостаковича цитируют в справочниках, но не слушают.", "Четвёртая симфония звучит и губит тебя. Ты получаешь «десять лет без права переписки», и русская музыка XX века теряет главную фигуру.", null, "Ты остаёшься на Западе и пишешь свободно. В Ленинграде арестовывают родных, а симфонии получают идеальное звучание и пустой дом."], "cat": "Искусство и слово", "no": 13, "ctx2": "28 января 1936 года «Правда» напечатала статью «Сумбур вместо музыки» после того, как Сталин побывал на твоей опере. Четвёртую симфонию ты ещё дописываешь, и в ней нет ничего, что понравилось бы власти.", "adult": 0, "vs": "спорно", "age": 12}, {"id": "RD-014", "kind": "Жизнь", "who": "Борис Пастернак, писатель", "when": "октябрь 1958", "title": "Нобелевская премия", "ctx": "Тебе присудили Нобелевскую премию по литературе за «Доктора Живаго», роман, запрещённый в СССР. Ты отправляешь телеграмму с благодарностью. Тебя исключают из Союза писателей, в газетах кампания, звучат угрозы выслать из страны.", "o": ["Принять премию, но не ехать.", "Отказаться от премии, чтобы остаться на родине.", "Уехать из СССР и подать на политическое убежище.", "Принять премию и поехать в Стокгольм, рискуя не вернуться."], "real": 1, "fact": "Пастернак сначала принял премию, а через шесть дней под давлением отправил телеграмму с отказом.", "res": "Он остался в СССР, умер в 1960. Нобелевская медаль была вручена его сыну в 1989 году. Многие друзья считали, что другого выбора у него не было.", "src": "Переписка и воспоминания, документы Нобелевского комитета", "q": "На этом пути не пропадает ни одно усилие и нет вреда от неудачи. Даже малая доля этого знания избавляет от великого страха.", "qs": "Бхагавад-гита 2.40", "qv": 2, "alt": ["Принять премию и не ехать выглядит компромиссом. Власти не прощают и этого: исключение из Союза писателей всё равно происходит.", null, "Эмиграция даёт свободу слова, но отнимает язык среды. Роман читают на Западе, а ты тоскуешь по подмосковным дачам.", "Ты едешь в Стокгольм и обратно, возможно, не возвращаешься. Нобелевская лекция звучит на весь мир, а родная страна закрывает перед тобой дверь."], "fut": ["Компромисс не спасает: тебя исключают из Союза писателей всё равно. Через пять лет ты умираешь в той же дачной тишине, только без Нобелевской речи.", null, "Эмиграция даёт тебе свободу и лишает тебя среды. Через десять лет ты пишешь по-английски и тоскуешь по русскому.", "Ты едешь в Стокгольм и не возвращаешься. «Доктор Живаго» становится фильмом раньше, чем хоть раз издаётся на родине, а ты теряешь дачу в Переделкине."], "cat": "Искусство и слово", "no": 14, "ctx2": "23 октября 1958 года Шведская академия присудила тебе премию. Роман «Доктор Живаго» запрещён в СССР и издан в Италии в 1957 году. Союз писателей собирается исключить тебя, а газеты называют предателем. Тебе говорят, что выезд из страны возможен, но обратно тебя могут не впустить.", "adult": 0, "vs": "верно", "age": 12}, {"id": "RD-015", "kind": "Жизнь", "who": "Мария и Пьер Кюри, учёные", "when": "1898–1902", "title": "Патент на радий", "ctx": "Вы с мужем получили чистый радий, это открытие, которое может принести огромные деньги. Вы живёте скромно, лаборатория плохая, денег не хватает. Патент на метод выделения закрепил бы права за вами.", "o": ["Запатентовать, но сделать условия для научного использования льготными.", "Продать права промышленникам.", "Не патентовать, чтобы наука и медицина развивались свободно.", "Запатентовать метод и обеспечить семью и лабораторию."], "real": 2, "fact": "Супруги не стали патентовать способ получения радия и открыто передали его учёным и промышленникам.", "res": "Работа с радием ускорилась по всему миру. Сами Кюри оставались небогатыми, лаборатории не хватало денег, а по мнению биографов, работа с радиоактивными веществами подорвала здоровье обоих. Мария получила две Нобелевские премии.", "src": "Биографии Кюри, письма", "q": "Поэтому всегда делай то, что нужно делать, без привязанности к плодам: кто действует без привязанности, тот достигает высшего.", "qs": "Бхагавад-гита 3.19", "qv": 2, "alt": ["Льготный патент превращается в бюрократическую папку. Исследователи долго согласовывают лицензии, а открытия приходят позже.", "Продажа прав промышленникам даёт богатство, а радий используют как косметику и тоник. Рекламные щиты обещают здоровье и вызывают ожоги.", null, "Патент приносит деньги и новую лабораторию, но замедляет науку. Радий дорожает, и онкобольным он становится недоступен."], "fut": ["Льготные условия превращаются в клубок согласований. Научный прогресс замедляется на десятилетие.", "Радий продан и превращён в тоник «для бодрости». К 1930 году тысячи людей страдают от лучевой болезни, а твоё имя на бутылке.", null, "Патент делает лабораторию богатой и закрытой. Радий дорожает, лечение становится роскошью, а цена на излучение растёт в разы."], "cat": "Наука", "no": 15, "ctx2": "Вы с Пьером работаете в сыром сарае на улице Ломон и перерабатываете тонны урановой руды. В декабре 1898 вы объявили о радии, а к 1902 выделили около десятой доли грамма хлорида радия. Денег не хватает. Патент мог бы изменить вашу жизнь, но вы колеблетесь.", "adult": 0, "vs": "спорно", "age": 12, "g": ["R", "R", "S", "R"], "gw": ["Желание сохранить выгоду и контроль, смешанный компромисс", "Стремление к деньгам и выгоде", "Бескорыстие, отказ от плодов ради общего блага", "Выгода и обеспечение семьи, привязанность к результату"]}, {"id": "RD-016", "kind": "Жизнь", "who": "Джонас Солк, создатель вакцины от полиомиелита", "when": "1955", "title": "Кому принадлежит вакцина", "ctx": "Твоя вакцина против полиомиелита прошла испытания на миллионах детей и признана безопасной. Фонд ждёт, что ты передашь права или оформишь их. Продажа лицензий сделала бы тебя богатым человеком.", "o": ["Запатентовать вакцину и получать отчисления.", "Не патентовать вакцину, сделав её общим достоянием.", "Продать права фармацевтической компании.", "Передать права фонду, который финансировал испытания."], "real": 1, "fact": "На вопрос журналиста, чья это вакцина, Солк ответил: «Народа. Патента нет. Разве можно запатентовать солнце?».", "res": "Позже юристы заявляли, что патент всё равно вряд ли удалось бы получить. Вакцинация распространилась широко, заболеваемость резко упала. Солк не стал богатым человеком.", "src": "Интервью Эдварду Марроу, 1955", "q": "Твоё право — только на действие, но никогда на его плоды. Пусть плоды не будут побуждением к поступку, но и бездействию не поддавайся.", "qs": "Бхагавад-гита 2.47", "qv": 2, "alt": ["Отчисления делают тебя миллионером, но вакцина стоит дорого. Часть детей остаётся без прививок, а имя Солка связывают с наживой.", null, "Фармкомпания получает монополию и устанавливает цену по своим расчётам. Кампания охватывает богатые районы, а болезнь живёт ещё долго.", "Фонд владеет правами, и цена растёт под давлением бюджета. Вакцинация идёт медленно и неравномерно."], "fut": ["Отчисления делают тебя миллионером, а вакцину недоступной. К 1960-м полиомиелит остаётся болезнью бедных, а имя Солка стоит на банкноте компании.", null, "Фармкомпания получает монополию. К 1970-м у вакцины две цены: для богатых и для остальных.", "Фонд берёт цену под давление бюджета. К 1960 вакцинация идёт медленно, а болезнь живёт ещё два десятилетия."], "cat": "Наука", "no": 16, "ctx2": "12 апреля 1955 года объявлены итоги испытаний вакцины на почти двух миллионах детей. Страна ликует. Частные компании ждут лицензию, фонд, который тебя финансировал, надеется на права. Телеведущий Эдвард Марроу спрашивает, кому принадлежит вакцина.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "S", "R", "R"], "gw": ["Стремление к выгоде и доходу от открытия", "Бескорыстный дар ради всех детей, отказ от плодов", "Продажа ради богатства и выгоды", "Передача под контроль организации, не вполне бескорыстная"]}, {"id": "RD-017", "kind": "Жизнь", "who": "Алан Тьюринг, математик", "when": "1952", "title": "Тюрьма или принудительная терапия", "ctx": "Тебя судят за «грубую непристойность» из-за отношений с мужчиной. По закону того времени это считалось преступлением, и сегодня такой закон признан несправедливым. Суд предлагает выбор: тюрьма или условное освобождение с обязательной гормональной терапией.", "o": ["Выбрать тюрьму и сохранить тело и достоинство.", "Согласиться на гормональное лечение год.", "Уехать из страны до приговора.", "Оспаривать приговор, отказавшись от любого наказания."], "real": 1, "fact": "Тьюринг принял условное освобождение: в течение года ему вводили эстроген.", "res": "В 1954 году он умер от отравления цианидом. Дознание признало смерть самоубийством, но эта версия оспаривается. Королевское помилование последовало в 2013 году, закон об отмене подобных приговоров принят в 2017 году.", "src": "Биография Эндрю Ходжеса", "q": "Совершенным йогином, Арджуна, я считаю того, кто по себе судит обо всех: в радости и в беде он видит другого равным себе.", "qs": "Бхагавад-гита 6.32", "qv": 2, "alt": ["Тюрьма сохраняет тело от гормонов, но не от унижения. После срока ты выходишь с судимостью, и работа в закрытых проектах для тебя закрыта.", null, "Ты уезжаешь из страны до приговора. Британская разведка видит в этом предательство, а университеты закрывают двери.", "Отказ от любого наказания приводит к ужесточению приговора. Судья видит в этом вызов, и срок только растёт."], "fut": ["Ты выбираешь тюрьму и выходишь без работы. Британия теряет математика, который мог бы создать то, что вычислительная техника создаст на двадцать лет позже.", null, "Ты уезжаешь, и разведка видит в этом предательство. Университеты закрывают двери, а компьютеры оказываются за океаном.", "Отказ от наказания приводит к ужесточению приговора. Тьюринг сидит дольше, и «тест Тьюринга» так и остаётся наброском."], "cat": "Наука", "no": 17, "ctx2": "Тебя арестовали после твоего заявления о краже в доме и допроса о связи с Арнольдом Мюрреем. Суд состоялся 31 марта 1952. Условное освобождение означает год лечения эстрогеном и потерю допуска к секретной работе.", "adult": 1, "vs": "спорно", "age": 18}, {"id": "RD-018", "kind": "Жизнь", "who": "Альберт Эйнштейн, физик и пацифист", "when": "август 1939", "title": "Письмо президенту", "ctx": "Ты убеждённый пацифист. Физики Силард и Вигнер сообщают, что Германия, возможно, работает над ядерным оружием. Они просят тебя подписать письмо президенту США. Ты знаешь, что оно может запустить создание бомбы.", "o": ["Отказаться: ты не хочешь участвовать в создании оружия.", "Подписать письмо, чтобы нацисты не получили бомбу первыми.", "Написать личное письмо, не касаясь оружия, только о научных рисках.", "Подписать, но потребовать международного контроля."], "real": 1, "fact": "Эйнштейн подписал письмо Рузвельту 2 августа 1939.", "res": "Письмо ускорило создание ядерной программы США. Сам Эйнштейн в проекте не участвовал, а позже говорил, что сожалеет о письме: знай он, что у Германии бомбы не будет, он бы не шевельнул и пальцем.", "src": "Письмо Эйнштейна–Силарда; воспоминания", "q": "Не бросай дело, к которому ты призван по своей природе, даже если в нём есть изъян: у любого дела есть недостатки, как у огня есть дым.", "qs": "Бхагавад-гита 18.48", "qv": 2, "alt": ["Ты отказываешься, и письмо уходит без подписи. Сильд и Вигнер ищут других подписантов, а письмо, возможно, затеряется в бюрократии на месяцы.", null, "Личное письмо о научных рисках читают как рассуждение физика. Администрация не придаёт ему значения, и программа стартует позже.", "Требование международного контроля превращается в формулировку на полях. Президент слушает, но решение принимают другие."], "fut": ["Письмо уходит без подписи. Через год Рузвельт получает другое, от других людей, и программа стартует с задержкой. Атомное оружие появляется на год позже или на год раньше, и никто не знает, что стало бы лучше.", null, "Личное письмо о научных рисках лежит в папке. Бомба появляется в конце войны, а может быть, уже после неё.", "Подписанное письмо с требованием контроля превращает Эйнштейна в «автора идеи международного надзора». Через двадцать лет это нужнее, чем сама бомба."], "cat": "Наука", "no": 18, "ctx2": "Летом 1939 года к тебе в Лонг-Айленд приехали физики Силард и Вигнер. В конце 1938 года в Берлине открыли деление урана. Силард подготовил письмо, а тебя просят подписать его как самого известного учёного. Ты всю жизнь выступал против войны.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "S", "T", "R"], "gw": ["Уклонение от ответственности, чистота совести ценой равнодушия", "Ответственный долг перед миром, взвешенное решение без личной выгоды", "Бегство от главного, самообман формальным письмом", "Стремление контролировать результат, условие ради влияния"]}, {"id": "RD-019", "kind": "Жизнь", "who": "Йозеф Ротблат, физик", "when": "1944", "title": "Уйти из проекта", "ctx": "Ты работаешь в Лос-Аламосе над атомной бомбой. Ты шёл на это, опасаясь, что бомбу создаст Гитлер. Теперь выясняется, что немцы далеки от бомбы, но проект продолжается.", "o": ["Публично объявить о причинах и обратиться к прессе.", "Остаться и работать, но тихо саботировать.", "Выйти из проекта и хранить молчание.", "Остаться: проект слишком важен, и твой вклад нужен."], "real": 2, "fact": "Ротблат покинул проект; под угрозой ареста он согласился не говорить коллегам об истинной причине ухода. Он, по распространённой оценке, остался единственным учёным, ушедшим из Манхэттенского проекта по моральным соображениям.", "res": "Позже он стал одним из основателей Пагуошского движения учёных за разоружение и в 1995 вместе с Пагуошскими конференциями получил Нобелевскую премию мира.", "src": "Воспоминания и интервью Ротблата", "q": "Сын Притхи, ни в этом мире, ни в ином нет гибели для такого человека: тот, кто творит добро, мой друг, никогда не приходит к дурному концу.", "qs": "Бхагавад-гита 6.40", "qv": 2, "alt": ["Публичное заявление приводит к аресту по закону о секретности. Тебя изображают предателем, а пресса путает причины.", "Тихий саботаж быстро замечают. Расследование идёт по всему отделу, и под подозрение попадают коллеги.", null, "Ты остаёшься, и твоё имя ставят среди создателей бомбы. Вклад велик, а совесть тяжелее, чем можно вынести."], "fut": ["Публичное заявление приводит к аресту. Пресса обвиняет тебя в шпионаже, и антиядерное движение теряет одного из будущих лидеров.", "Саботаж раскрыт, под подозрение попадают коллеги. Манхэттенский проект в итоге получает новую систему допуска.", null, "Ты остаёшься и становишься одним из «отцов бомбы». Через десять лет получаешь награды, а через двадцать пишешь письма о том, что не должен был."], "cat": "Наука", "no": 19, "ctx2": "Ты польский физик, приехал в Лос-Аламос из Ливерпуля. Жена осталась в Польше. Весной 1944 года на ужине ты слышал, как генерал Гровс сказал, что цель проекта запугать Советский Союз.", "adult": 0, "vs": "исправлено", "age": 12}, {"id": "RD-020", "kind": "Жизнь", "who": "Эрнест Шеклтон, полярный исследователь", "when": "9 января 1909", "title": "В 97 милях от полюса", "ctx": "Вы идёте к Южному полюсу, оставшиеся запасы малы, люди ослабли. До полюса осталось около 97 морских миль. Ты видишь, что добраться можно, но вернуться вряд ли.", "o": ["Отправить вперёд самого сильного одного, остальным ждать.", "Повернуть назад, чтобы спасти людей.", "Разделиться на две группы и пойти разными путями.", "Идти до конца: шанс прославиться другого не будет."], "real": 1, "fact": "Шеклтон повернул назад. Жене он сказал, что лучше быть живым ослом, чем мёртвым львом.", "res": "Все вернулись живыми. Полюс достиг Руал Амундсен в 1911. Шеклтон остался героем, а позже вновь вернулся в Антарктику.", "src": "Дневники экспедиции «Нимрод»", "q": "Кто умерен в еде и отдыхе, в трудах и в сне, и в бодрствовании, для того йога становится избавлением от страданий.", "qs": "Бхагавад-гита 6.17", "qv": 2, "alt": ["Один сильный уходит вперёд и либо возвращается героем, либо исчезает во льдах. Остальные ждут на пайке и теряют силы.", null, "Две группы расходятся и теряют друг друга в метели. Ни одна не достигает полюса, а продуктов не хватает ни той, ни другой.", "Ты идёшь до полюса и достигаешь его ценой отряда. Слава огромна, но на обратном пути запасы заканчиваются, и экспедиция становится трагедией."], "fut": ["Один уходит вперёд и становится героем без отряда. Остальные ждут напрасно.", null, "Две группы расходятся и теряют друг друга. История экспедиции остаётся белым пятном до следующего столетия.", "Ты идёшь до полюса и достигаешь его. Обратный путь забирает всю экспедицию. Через сто лет памятник стоит в Лондоне, но на нём нет ни одного живого имени."], "cat": "Риск и путь", "no": 20, "ctx2": "Экспедиция «Нимрод» идёт к полюсу с пони, но те уже погибли. С тобой Фрэнк Уайлд, Эрик Маршалл и Джеймсон Адамс. Запасов на обратный путь остаётся впритык. Вы достигли 88°23′ южной широты.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "S", "R", "R"], "gw": ["Расчёт на победу и славу, пожертвовав слабыми", "Долг перед людьми выше славы, самоотверженность", "Соперничество и расчёт, ради цели рискуя группой", "Жажда славы, привязанность к результату"]}, {"id": "RD-021", "kind": "Жизнь", "who": "Чесли Салленбергер, пилот", "when": "15 января 2009", "title": "Гудзон", "ctx": "Самолёт набирает высоту над Нью-Йорком, как вдруг оба двигателя отказывают после столкновения со стаей птиц. У тебя меньше четырёх минут. Диспетчер предлагает вернуться в Ла-Гуардию или сесть в Тетерборо.", "o": ["Просить диспетчера найти ближайшую дорогу или поле.", "Вернуться на аэродром, откуда вылетели.", "Садиться на реку Гудзон.", "Идти на посадку в Тетерборо."], "real": 2, "fact": "Салленбергер сообщил диспетчеру, что сядет на Гудзон, и посадил самолёт на воду.", "res": "Все 155 человек на борту выжили. Позже Национальный совет по безопасности на транспорте США (NTSB) проверял в симуляциях, можно ли было вернуться на аэродром, и признал посадку на воду разумным решением в тех обстоятельствах.", "src": "Отчёт NTSB", "q": "Утвердись в йоге и действуй, отбросив привязанность и оставаясь ровным в успехе и в неудаче, Дхананджая. Эту ровность и называют йогой.", "qs": "Бхагавад-гита 2.48", "qv": 2, "alt": ["Поиск дороги или поля вокруг Манхэттена обречён: застройка сплошная. У самолёта остаются секунды, а у посадки нет площадки.", "Возвращение на аэродром требовало точного разворота без двигателей. Это лишь допущение: в гипотетической версии не хватило бы высоты и времени, и исход был бы тяжелее.", null, "Это лишь допущение: до Тетерборо самолёт мог и не дотянуть, а исход зависел бы от многих обстоятельств."], "fut": ["Поиск дороги или поля уносит секунды. История «чуда на Гудзоне» остаётся ненаписанной.", "Это лишь допущение: если бы самолёт не долетел до аэродрома, последствия были бы тяжёлыми, а правила действий при отказе двигателей, возможно, пересмотрели бы раньше.", null, "Это лишь допущение: если бы до Тетерборо не хватило высоты, последствия были бы тяжёлыми."], "cat": "Риск и путь", "no": 21, "ctx2": "15 января 2009 года рейс 1549 вылетел из Ла-Гуардии в Шарлотт. На высоте около 850 метров самолёт попал в стаю гусей. Оба двигателя отказали. На борту 155 человек. Ты летишь вместе с вторым пилотом Скайлзом, диспетчер называет ближайшие аэродромы.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "T", "S", "R"], "gw": ["Перекладывание решения на другого, растерянность и пассивность", "Привычное решение без ясной оценки, шаблон вместо анализа", "Ясная оценка ситуации, ответственное решение ради спасения людей", "Желание достичь цели вопреки риску, цепляние за привычный план"]}, {"id": "RD-022", "kind": "Жизнь", "who": "Дуайт Эйзенхауэр, главнокомандующий союзных войск", "when": "4–5 июня 1944", "title": "День высадки", "ctx": "Погода над Ла-Маншем ухудшается, высадка в Нормандии назначена на 5 июня. Метеорологи обещают короткое окно хорошей погоды 6 июня. Если отложить, следующий шанс только через две недели, а войска уже в портах.", "o": ["Отложить операцию на две недели.", "Начать только воздушную операцию, а морскую отложить.", "Отменить высадку и пересмотреть план.", "Начать вторжение 6 июня."], "real": 3, "fact": "Выслушав метеорологов, Эйзенхауэр приказал начинать. Он заранее написал записку, в которой брал вину за возможную неудачу на себя.", "res": "Высадка прошла с большими потерями, но закрепилась на побережье. Это открыло второй фронт и привело к освобождению Западной Европы.", "src": "Мемуары Эйзенхауэра", "q": "Делай то, что должно делать: действие лучше бездействия. Если ничего не делать, не удастся даже поддерживать жизнь тела.", "qs": "Бхагавад-гита 3.8", "qv": 2, "alt": ["Две недели ожидания позволяют противнику узнать о планах. Шторм 19 июня превращает лучший график в самую тяжёлую ночь операции, и высадка откладывается ещё.", "Одна воздушная операция без морской повисает в воздухе. Десантники остаются без поддержки, и наступление захлёбывается.", "Отмена высадки откладывает освобождение Европы на год. Красная армия приходит дальше на запад, а карта послевоенного мира выглядит иначе.", null], "fut": ["Две недели отсрочки раскрывают планы. Через месяц на побережье уже стоит укреплённый вал, а освобождение Европы переносится на следующий год.", "Одна воздушная операция без десанта не удаётся. Через неделю противник перебрасывает резервы, и Нормандия остаётся недостижимой.", "Высадка отменена. Красная армия доходит до Рейна, и послевоенная Европа говорит по-русски до Атлантики.", null], "cat": "Власть и война", "no": 22, "ctx2": "Метеоролог Джеймс Стагг сообщает, что 5 июня погода ужасна, но 6 июня будет короткое окно. Сто пятьдесят тысяч человек готовы выйти в море.", "adult": 0, "vs": "верно", "age": 12, "g": ["T", "R", "T", "S"], "gw": ["Страх и промедление, избегание риска", "Половинчатое решение, желание сохранить контроль и выгоду", "Отказ от ответственности, бегство от решения", "Ясная оценка и ответственное решение по долгу"]}, {"id": "RD-023", "kind": "Жизнь", "who": "Николай II, император", "when": "март 1917", "title": "Отречение", "ctx": "В стране беспорядки, армия колеблется, генералы советуют отречься. Ты отдалён от столицы, твой поезд стоит в Пскове. Сын болен гемофилией.", "o": ["Применить силу и подавить восстание.", "Отречься от престола.", "Передать власть сыну, не отрекаясь за себя.", "Бежать за границу."], "real": 1, "fact": "Николай отрёкся за себя и за сына в пользу брата Михаила. В манифесте он написал, что не хочет расставаться с любимым сыном. Михаил на следующий день отказался принять власть, пока народ не решит через Учредительное собрание.", "res": "Монархия пала, власть перешла к Временному правительству. В 1918 году императора с семьёй расстреляли в Екатеринбурге.", "src": "Материалы отречения 1917", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Подавление силой может удаться в столице, но армия на фронте не подчиняется. В гипотетической версии страна делится на лагеря раньше, а гражданская война начинается весной 1917.", null, "Передача власти сыну без твоего отречения делает Алексея заложником. Регентство Михаила превращается в спор между Думой и генералами.", "Бегство за границу спасает семью, но обрывает династию. Монархия падает без прощального акта, а мир смотрит на беглого императора."], "fut": ["Подавление силой выигрывает неделю. Через месяц армия отказывается стрелять, а к лету Россия оказывается в гражданской войне раньше, чем она случилась на самом деле.", null, "Регентство превращается в борьбу двух дворов. К 1918 страна делится на три государства.", "Бегство за границу спасает семью. Династия умирает в изгнании, а Россия получает республику без императорских теней."], "cat": "Власть и война", "no": 23, "ctx2": "Ты в Пскове, в вагоне императорского поезда. Генерал Алексеев запросил командующих фронтами, и они считают, что нужно отречься. Генерал Рузский и председатель Думы Родзянко говорят то же самое. Сначала ты готов передать престол сыну, а брата Михаила сделать регентом. Но ты спрашиваешь врача Фёдорова о болезни сына, гемофилии. Врач отвечает, что она неизлечима, и что после твоего отречения сына, скорее всего, разлучат с родителями.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "S", "R", "T"], "gw": ["Удержание власти силой, привязанность к трону", "Отказ от власти ради мира в стране, без привязанности", "Расчёт сохранить власть и династию при уступке", "Бегство от ответственности и долга"], "swap": {"role": "Михаил Александрович, великий князь", "title": "Корона на один день", "ctx": "Ты великий князь Михаил Александрович, младший брат императора Николая II. В марте 1917 года Николай отрёкся от престола за себя и за сына в твою пользу. 3 марта (по старому стилю) к тебе приезжают члены Временного правительства и Государственной думы, среди них Керенский, Родзянко и Милюков. Милюков и Гучков настаивают, чтобы ты принял престол, остальные советуют отказаться; в стране революция, и непонятно, пойдёт ли за тобой армия.", "o": ["Принять престол сразу и править как император.", "Принять престол, но стать конституционным монархом при Думе.", "Отказаться сейчас и передать решение Учредительному собранию.", "Отказаться навсегда и уехать из страны."], "real": 2, "fact": "Ты отказался принимать власть сейчас. Ты боялся, что революция перейдёт в гражданскую войну, и не был уверен, что принять престол полезно для страны. В акте ты записал, что форму правления определит Учредительное собрание, а до того власть принадлежит Временному правительству.", "res": "Манифесты Николая II и твой обнародовали 5 марта. Петроградский Совет потребовал арестовать царскую семью, включая тебя: с весны 1917 года ты жил под домашним арестом в Гатчине, а в 1918 году тебя выслали в Пермь. В ночь с 12 на 13 июня 1918 года тебя и твоего секретаря Николая Джонсона расстреляли.", "src": "cyclowiki.org (Михаил Александрович, сын Александра III); news.rambler.ru/community/36323926 (совещание 3 марта 1917); aif.ru/society/history/rokovoe_otrechenie_chto_pogubilo_monarhiyu_v_rossii"}}, {"id": "RD-024", "kind": "Жизнь", "who": "Ашока, правитель Магадхи", "when": "около 261 до н. э.", "title": "После Калинги", "ctx": "Ты выиграл жестокую войну: по твоим же эдиктам, погибло около ста тысяч, сто пятьдесят тысяч угнали в плен. Ты видишь поле битвы и чувствуешь, что победа ничего не принесла. Власть при тебе, армия сильна.", "o": ["Заключить мир, но сохранить власть силой страха.", "Распустить армию и уйти в монахи.", "Отказаться от завоеваний и править по закону «дхармы».", "Продолжить завоевания и объединить весь юг."], "real": 2, "fact": "Ашока по собственным эдиктам раскаялся, принял учение Будды и стал править «дхаммой». Армию он не распустил.", "res": "Он строил дороги, больницы и колодцы, выбил указы на скалах. Буддизм распространился далеко за пределы Индии. Государство после его смерти распалось.", "src": "Скальные эдикты Ашоки", "q": "У этого пути к гибели три двери: похоть, гнев и жадность. Поэтому от этой тройки нужно отказаться.", "qs": "Бхагавад-гита 16.21", "qv": 2, "alt": ["Мир, купленный страхом, держится, пока держится армия. Эдиктов о милосердии нет, а Индия помнит тебя как жестокого правителя.", "Ты уходишь в монахи и бросаешь государство. Наследники делят власть до твоего возвращения, и империя трескается раньше.", null, "Завоевания продолжаются, и государство растёт, но казна пустеет. Дороги и больницы не строятся, а эдикты на скалах говорят только о победах."], "fut": ["Мир, купленный страхом, держится, пока держится армия. Через сто лет об Ашоке помнят как о жестоком правителе.", "Ты уходишь в монахи. Империя дробится на пять царств к концу твоей жизни, а буддизм остаётся местным учением.", null, "Завоевания продолжаются, империя растёт, но казна пустеет. Через двадцать лет Индия объединена мечом и сломана налогами, а скальные эдикты воспевают только победы."], "cat": "Власть и война", "no": 24, "ctx2": "Около 261 года до н. э. твоя армия захватила Калингу. Ты унаследовал империю Маурьев и привык побеждать. Теперь на поле боя ты видишь, как плачут вдовы.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "T", "S", "R"], "gw": ["Удержание власти страхом, привязанность к силе", "Бегство от обязанностей, полный отказ от долга правителя", "Раскаяние и служение людям, правление по дхарме", "Жажда завоеваний и власти, ненасытное расширение"]}, {"id": "RD-025", "kind": "Жизнь", "who": "Юлий Цезарь, полководец", "when": "10 января 49 до н. э.", "title": "Рубикон", "ctx": "Сенат требует, чтобы ты распустил армию и вернулся в Рим частным лицом, где тебя ждёт суд. Ты стоишь у реки Рубикон, границы провинции. Перейдёшь с войском, и это будет война с Римом.", "o": ["Уйти в изгнание и жить в провинции.", "Остаться в Галлии и вести переговоры.", "Распустить войска и явиться на суд.", "Перейти Рубикон с одним легионом."], "real": 3, "fact": "Цезарь перешёл Рубикон со своим легионом. Светоний приписывает ему слова «Жребий брошен».", "res": "Началась гражданская война, Цезарь победил и стал диктатором. В 44 до н. э. его убили заговорщики. Республика пала.", "src": "Светоний, «Жизнь двенадцати цезарей»", "q": "Это желание, это гнев, рождённый страстью: оно ненасытно и очень порочно. Знай, что здесь оно — твой враг.", "qs": "Бхагавад-гита 3.37", "qv": 2, "alt": ["Изгнание превращает тебя в скромного провинциала. Рим не вспоминает о тебе, а Республика заканчивается иначе.", "В Галлии идут переговоры, но они тянутся, а легионы без жалованья недовольны. Помпей собирает войска, и война начинается на его условиях.", "Ты распускаешь армию и являешься на суд. Враги в сенате добиваются осуждения, а Рим живёт ещё несколько лет под республикой, которая рассыпается и без тебя.", null], "fut": ["Изгнание делает тебя скромным провинциалом. Рим переходит к диктатуре чужими руками.", "Переговоры затягиваются. Помпей собирает легионы, и война начинается на его условиях. «Альеа якта эст» остаётся не сказанной.", "Ты распускаешь войска и приходишь на суд. Враги осуждают тебя за день. Через десять лет Рим всё равно становится империей, но уже с другим лицом на монетах.", null], "cat": "Власть и война", "no": 25, "ctx2": "Ты завоевал Галлию за восемь лет и стал богатым и популярным. Помпей, когда-то твой союзник, в 52 до н. э. был избран консулом без коллеги, а теперь опирается на сенат. В январе 49 года сенат приказал тебе распустить армию. Твои сторонники, народные трибуны, бежали из Рима. С тобой один легион.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "R", "S", "R"], "gw": ["Бегство от конфликта и ответственности, уход в тень", "Расчётливая торговля, удержание власти и войска", "Подчинение закону ради мира, готовность отвечать", "Рывок к власти, амбиция и импульсивный риск"]}, {"id": "RD-026", "kind": "Жизнь", "who": "Макс Брод, друг и душеприказчик Кафки", "when": "1924", "title": "Сжечь рукописи", "ctx": "Умер твой друг Франц Кафка. В завещании он просит сжечь все его неопубликованные рукописи: «Процесс», «Замок», дневники. Он знал, что ты можешь отказаться, и заранее предупреждал, что ты не выполнишь.", "o": ["Передать рукописи архиву без публикации.", "Сжечь часть, оставив только самое важное.", "Не сжигать, а издать рукописи.", "Сжечь всё, как просил друг."], "real": 2, "fact": "Брод не выполнил просьбу и опубликовал «Процесс» (1925), «Замок» (1926) и «Америку» (1927).", "res": "Кафка стал одним из самых влиятельных писателей XX века. Спор, был ли Брод вправе нарушить волю друга, не затихает до сих пор. Рукописи Брод вывез в Палестину в 1939 году, перед самой войной, а позже они стали предметом многолетнего суда в Израиле.", "src": "Биографии Кафки", "q": "Человек должен поднимать себя сам и не давать себе падать: ум бывает другом человека, а бывает его врагом.", "qs": "Бхагавад-гита 6.5", "qv": 2, "alt": ["Архив прячет рукописи на десятилетия. Читатели узнают Кафку только в семидесятых, а влияние на литературу сдвигается.", "Сожжённая половина выбирается наугад, и теряется то, что ты ценил меньше всего. Остальное выходит в искалеченном виде.", null, "Рукописи сгорают, и мир остаётся без «Процесса» и «Замка». Кафка остаётся автором нескольких рассказов, о которых помнят специалисты."], "fut": ["Архив прячет рукописи на сорок лет. Кафку открывают в семидесятых, и экзистенциализм приходит позже.", "Сжигается половина, и теряется то, что ты ценил меньше. Остальное выходит искалеченным, и Кафка остаётся автором странных рассказов.", null, "Рукописи сгорают. Мировая литература XX века остаётся без «Процесса» и «Замка», а слово «кафкианский» не входит в словари."], "cat": "Искусство и слово", "no": 26, "ctx2": "Кафка умер 3 июня 1924 года в санатории под Веной от туберкулёза. При жизни он издал немного рассказов. Вы дружите с 1902 года. Завещание с просьбой сжечь рукописи он написал давно, и ты ещё тогда сказал, что не выполнишь его.", "adult": 0, "vs": "исправлено", "age": 12}, {"id": "RD-027", "kind": "Жизнь", "who": "Император Август", "when": "19 до н. э.", "title": "«Энеида» в огонь", "ctx": "Умирает Вергилий и просит сжечь рукопись «Энеиды», потому что поэма не закончена. Ты правитель, и ты узнаёшь о его просьбе. Поэма прославляет Рим и твой род.", "o": ["Приказать издать поэму, внеся минимальные правки.", "Спрятать рукопись в личный архив.", "Поручить доработать поэму другому поэту.", "Выполнить волю поэта и сжечь рукопись."], "real": 0, "fact": "Август распорядился издать «Энеиду». Её подготовили друзья Вергилия Варий и Тукка, почти ничего не меняя.", "res": "«Энеида» стала главной поэмой Рима. Незаконченные строки остались в тексте как следы авторской работы.", "src": "Светоний и Донат, «Жизнь Вергилия»", "q": "Что делает лучший, то повторяют и остальные; какой пример он подаёт, за тем и идёт весь мир.", "qs": "Бхагавад-гита 3.21", "qv": 2, "alt": [null, "Рукопись лежит в личном архиве. Через поколения её находят, но влияние на латинскую культуру уже ушло.", "Другой поэт дописывает «Энеиду» по-своему и ломает ритм. Читатели помнят чужие строки вместо вергилиевских.", "Поэма сгорает, и Рим остаётся без национального эпоса. Школьники учат другие стихи, а миф об Энее знают лишь учёные."], "fut": [null, "Рукопись лежит в архиве. Через поколение её находят, но влияние на латинский мир уже ушло.", "Другой поэт дописывает «Энеиду». Ритм ломается, и мировая поэзия получает длинную, но не вергилиеву поэму.", "Поэма сгорает. Рим остаётся без национального эпоса, а Данте, возможно, вёл бы путь без проводника Вергилия."], "cat": "Искусство и слово", "no": 27, "ctx2": "Вергилий умер в Брундизии 21 сентября 19 года до н. э., вернувшись из Греции. Над «Энеидой» он работал одиннадцать лет. В двенадцати песнях остались недописанные полустишия.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "T", "R", "S"], "gw": ["Ради славы Рима и рода, власть над результатом", "Самообман, скрытие рукописи из страха потерять её", "Контроль над результатом и ради престижа", "Уважение воли поэта, отказ от выгоды"]}, {"id": "RD-028", "kind": "Жизнь", "who": "Людвиг Витгенштейн, философ", "when": "1919", "title": "Отдать состояние", "ctx": "Ты один из богатейших людей Австрии после отца. Вернувшись с войны, ты хочешь жить по-другому. Родственники не понимают тебя.", "o": ["Сохранить наследство и заниматься философией.", "Отдать всё имущество родственникам и жить на скромное жалованье.", "Раздать деньги бедным.", "Вложить капитал в благотворительный фонд и руководить им."], "real": 1, "fact": "Витгенштейн отдал наследство брату и сёстрам и стал сельским учителем. До этого он в 1914 тайно передавал деньги художникам, включая Рильке и Тракля.", "res": "Он преподавал в деревнях Нижней Австрии, потом вернулся в философию и Кембридж. Его работа «Логико-философский трактат» вышла в 1921.", "src": "Биографии Витгенштейна", "q": "Кто делает должное, не ища плода, тот и отрёкшийся, и йогин; а не тот, кто лишь не разводит огня и не совершает обрядов.", "qs": "Бхагавад-гита 6.1", "qv": 2, "alt": ["Ты сохраняешь состояние и пишешь философию в кабинете. Тебя похваливают на вечерах, а твоя резкость превращается в манеру.", null, "Деньги, розданные бедным, быстро кончаются. Через год половина получателей возвращается с просьбами, а ты разоряешься морально.", "Благотворительный фонд поглощает время и силы. Философия уходит на второй план, а «Трактат» остаётся недописанным."], "fut": ["Ты сохраняешь состояние и пишешь в кабинете. Через двадцать лет тебя помнят как богатого чудака, а «Трактат» остаётся любопытной книгой.", null, "Деньги раздаются бедным и заканчиваются за год. Ты разоряешься, а философия так и остаётся неоконченной.", "Фонд поглощает силы. Через десять лет ты успешный филантроп без книг."], "cat": "Искусство и слово", "no": 28, "ctx2": "После смерти отца в 1913 году ты получил огромное состояние. В Первую мировую ты служил в австрийской армии и написал «Логико-философский трактат» и в 1918 году попал в плен в Италии. Ты считаешь, что деньги мешают думать.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["R", "S", "S", "R"], "gw": ["Привязанность к имуществу, удобство при внешней духовности", "Отказ от богатства, скромная жизнь, без привязанности к плодам", "Сострадательная щедрость без расчёта, отказ от богатства", "Удержание контроля над капиталом и влиянием"]}, {"id": "RD-029", "kind": "Жизнь", "who": "Лев Толстой, писатель", "when": "28 октября (10 ноября) 1910", "title": "Уйти из дома", "ctx": "Тебе 82 года. Дома ссоры из-за завещания и авторских прав, жена Софья Андреевна ревнует к последователям. Ты давно хотел жить просто. Ночью ты решаешь, что дальше так нельзя.", "o": ["Уйти из дома ночью с врачом, никому не сказав куда.", "Остаться, терпеть и объясниться с женой.", "Сменить завещание и уехать ненадолго.", "Отдать права на сочинения и остаться дома."], "real": 0, "fact": "Толстой тайно покинул Ясную Поляну с врачом Маковицким. В пути заболел и остановился на станции Астапово.", "res": "7 ноября (20 по новому стилю) он умер в доме начальника станции. Жена приехала, но её сначала не пускали к умирающему.", "src": "Дневники Толстого, воспоминания", "q": "Мира достигает человек, который отбросил все желания и идёт вперёд без стремлений, без «моё» и без самомнения.", "qs": "Бхагавад-гита 2.71", "qv": 2, "alt": [null, "Ты остаёшься, терпишь и объясняешься. Скандалы в доме продолжаются, а завещание всё равно становится предметом спора.", "Новое завещание и короткая поездка превращаются в ещё один виток склоки. Дом по-прежнему ждёт тебя полным родственников.", "Права на сочинения переданы, но ссоры не затихают. Жена обижена, а ученики настаивают на большем."], "fut": [null, "Ты остаёшься и терпишь. Через год скандалы разрастаются, а завещание ломает семью. Ясная Поляна превращается в поле судебных дел.", "Новое завещание вызывает новую ссору. Через десять лет Ясная Поляна принадлежит никому.", "Права на сочинения переданы, но ссора не затихает. Ученики делят наследие, и книги теряются в сносках."], "cat": "Искусство и слово", "no": 29, "ctx2": "Ты живёшь в Ясной Поляне. Летом 1910 года ты тайно подписал завещание в лесу. Дневники читаются всеми, дом полон недоверия.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["S", "T", "R", "S"], "gw": ["Стремление к простоте и отречению от привязанностей", "Терпение без ясности, пассивность и избегание решения", "Привязанность к правам и результату, расчёт ради контроля", "Отказ от собственности ради простоты и мира"]}, {"id": "RD-030", "kind": "Жизнь", "who": "Януш Корчак, врач и педагог", "when": "август 1942", "title": "Остаться с детьми", "ctx": "Ты директор еврейского сиротского дома в Варшавском гетто. Приказ: всех детей, около ста девяноста, отправляют на Умшлагплац. Друзья достают для тебя документы и предлагают убежище на «арийской» стороне. Дети тебя любят и не понимают, что происходит.", "o": ["Попытаться спрятать часть детей, а самому остаться.", "Просить немцев разрешить остаться хотя бы младшим.", "Отказаться и пойти с детьми.", "Принять помощь и спастись, продолжая бороться за детей снаружи."], "real": 2, "fact": "Корчак отказался от предложений спастись и пошёл с детьми к поезду, по рассказам свидетелей, держа за руки самых маленьких.", "res": "Корчак и дети были отправлены в Треблинку и погибли. Он остался в памяти как пример верности детям. Детали последнего пути известны по свидетельствам очевидцев и частично легендарны.", "src": "Свидетельства очевидцев, биографии", "q": "Ещё Джанака и другие достигли совершенства именно деятельностью. Ради блага людей и тебе следует действовать.", "qs": "Бхагавад-гита 3.20", "qv": 2, "alt": ["Ты прячешь часть детей, а остальные уходят без объяснений. Оставшиеся в укрытии не получают ни еды, ни врача, и скрытность оказывается хрупкой.", "Просьба оставить младших остаётся без ответа. Приказ никого не щадит, а время уходит.", null, "Ты принимаешь убежище и вынужден жить с тем, что дети уехали без тебя. Возможно, снаружи ты ещё долго помогаешь другим, но этот день остаётся самой тяжёлой точкой биографии."], "cat": "Совесть и мужество", "no": 30, "ctx2": "Ты руководишь детским домом «Дом сирот» в Варшавском гетто, где около ста девяноста детей. 5–6 августа 1942 года, в ходе ликвидации гетто, дом сирот выселяют. Знакомые по обе стороны стены предлагают убежище и документы только для тебя. Дети идут строем, и ты знаешь, куда.", "adult": 1, "vs": "спорно", "age": 18}, {"id": "RD-031", "kind": "Жизнь", "who": "Максимилиан Кольбе, священник", "when": "июль 1941", "title": "Десять заложников", "ctx": "Ты узник Освенцима. Из блока сбежал заключённый, в наказание заместитель коменданта выбирает десять человек для голодной камеры. Один из выбранных кричит о жене и детях. Ты не выбран.", "o": ["Попросить за этого человека, не предлагая себя.", "Вызваться умереть вместо отца семьи.", "Спросить у коменданта, нельзя ли изменить выбор.", "Промолчать: ты не можешь спасти всех."], "real": 1, "fact": "Кольбе вышел из строя и предложил себя вместо Франциска Гаевничека. Фрич согласился.", "res": "Кольбе провёл в камере около двух недель и был убит инъекцией фенола 14 августа 1941. Гаевничек выжил и прожил до 1995. Кольбе канонизирован в 1982.", "src": "Свидетельства узников, документы канонизации", "q": "Выше всех тот, кто одинаково относится к друзьям, недругам и равнодушным, к посредникам, ненавидящим и родным, к праведным и к грешным.", "qs": "Бхагавад-гита 6.9", "qv": 2, "alt": ["Ходатайство за чужого человека не меняет решения. Комендант не отменяет выбор, а у тебя остаётся горечь отказа.", null, "Вопрос о замене вызывает раздражение. Охрана бьёт тебя и возвращает в строй, а десять человек уходят в камеру.", "Ты молчишь, как и все остальные. Заложника уводят в бункер, и ты остаёшься жить с тем, что мог сказать и не сказал."], "cat": "Совесть и мужество", "no": 31, "ctx2": "Ты монах-фр
