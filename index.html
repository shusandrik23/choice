рный Варис убеждает тебя признаться в измене: иначе твоя дочь Санса останется в руках Серсеи, а твой сын Робб пойдёт войной, и прольётся много крови. За признание тебе обещают сохранить жизнь и отправить в Ночной Дозор, суровое братство стражей на краю мира. Младшая дочь Арья скрывается. Ты всю жизнь ставил честь выше всего.", "o": ["Попросить встречи с Джоффри наедине.", "Признаться публично в предательстве.", "Отказаться признаваться и принять смерть.", "Бежать из тюрьмы с помощью Вариса."], "real": 1, "fact": "Нед признался перед толпой, что предал короля, хотя это была ложь.", "res": "Король Джоффри нарушил обещание и приказал казнить Неда, несмотря на протесты Сансы. Арью в толпе заметил Йорен, человек из Ночного Дозора, и увёл её в безопасное место.", "src": "Сериал «Игра престолов», сезон 1, серия 9", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Джоффри отказывает во встрече. Нед остаётся один в камере, а толпа ждёт его на площади.", null, "Нед отказывается, и его казнят сразу. Дочери остаются без защиты, а Серсея всё равно получает всё, что хотела.", "Варис обещает помочь, но стража уже у дверей. Побег не удаётся, и Неда ждёт суд."], "fut": ["Через два года все помнят, что Нед не просил помилования.", null, "К концу сезона война всё равно начинается, а Старки теряют честь без выгоды.", "Через год на Севере восстание, а честь Неда становится знаменем."], "cat": "Сериалы", "no": 91, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Сериал получил 59 премий «Эмми» — по данным Wikipedia, больше, чем любая другая драма. Его снимали в семи странах, а бюджет последнего сезона оценивают примерно в 15 млн долларов за серию.", "g": ["R", "R", "S", "R"], "gw": ["Расчёт и привязанность, торг ради детей", "Привязанность, ложь ради результата", "Правда и достоинство, принятие последствий", "Желание выжить и вернуть контроль"], "swap": {"role": "Джоффри Баратеон, король", "title": "Милость или казнь", "ctx": "Ты король Джоффри Баратеон. Лорд Эддард (Нед) Старк обвинён в измене. Варис передал ему, что если он ложно признается и присягнёт тебе, то его пощадят и отправят в изгнание в Ночной Дозор, и ты обещал так поступить. На площади у Великой септы Бейлора Нед при толпе признался в измене и присягнул тебе на верность. Твоя мать Серсея и дочь Неда Санса просят тебя сдержать слово.", "o": ["Исполнить обещание: пощадить Неда и отправить его в Ночной Дозор.", "Отложить решение и вернуть Неда в темницу.", "Приказать казнить Неда на глазах у толпы.", "Заменить казнь пожизненным заключением."], "real": 2, "fact": "Ты нарушил слово и приказал казнить Неда. Серсея, Варис и члены Малого совета пытались вмешаться, а Санса в ужасе смотрела на происходящее.", "res": "Неда казнил сир Илин Пейн его собственным мечом. Его младшую дочь Арью увёл Йорен, и она не увидела казни. Нед, заметив, что Арья спасена, принял свою участь.", "src": "«Игра престолов» (HBO), 1 сезон, 9 серия «Бейлор»: Wikipedia, «Baelor»"}}, {"id": "RD-092", "kind": "Сериал", "who": "Дейнерис Таргариен, «Игра престолов» (HBO, 3 сезон, 4 серия)", "when": "Астапор", "title": "Дракон за армию", "ctx": "Ты Дейнерис Таргариен, последняя из королевской семьи, которую когда-то свергли. Ты хочешь вернуть трон отца и освободить рабов, но у тебя нет армии. Зато у тебя есть три маленьких дракона, а это страшная сила. В городе Астапор работорговец Кразныс продаёт армию рабов-солдат: восемь тысяч Безупречных, воинов, которые беспрекословно слушаются хозяина. Цена ― один из твоих драконов.", "ctx2": "Дракон для тебя как ребёнок, и отдавать его не хочется. Но без армии трон не вернуть. Кразныс считает тебя наивной девчонкой и говорит о тебе на языке, который, как он думает, ты не понимаешь.", "o": ["Купить войско за золото.", "Отказаться: драконы не продаются.", "Согласиться отдать дракона, а потом отнять и дракона, и армию.", "Попытаться украсть Безупречных."], "real": 2, "fact": "Дейнерис согласилась на обмен, а затем приказала Безупречным уничтожить рабовладельцев, и дракон Дрогон сжёг Кразныса.", "res": "У неё осталась и армия, и дракон. Она объявила Безупречным, что они больше не рабы, и все до одного решили остаться с ней.", "src": "Сериал «Игра престолов», сезон 3, серия 4", "q": "Не бросай дело, к которому ты призван по своей природе, даже если в нём есть изъян: у любого дела есть недостатки, как у огня есть дым.", "qs": "Бхагавад-гита 18.48", "qv": 2, "alt": ["У тебя нет столько золота. Через неделю ты всё ещё в Астапоре, а твой дракон растёт.", "Ты отказываешься, и торговцы смеются. Безупречные остаются у них, а ты уходишь без войска.", null, "Охрана ловит тебя. Торговец требует выкуп, и всё идёт хуже, чем в плане."], "fut": ["Через два года армия торговцев идёт на тебя.", "Через год ты слабее, чем могла бы быть, а драконы вырастают без тебя.", null, "Через год ты в плену, а мир забывает про Дейнерис."], "cat": "Сериалы", "no": 92, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Сериал получил 59 премий «Эмми» — по данным Wikipedia, больше, чем любая другая драма. Его снимали в семи странах, а бюджет последнего сезона оценивают примерно в 15 млн долларов за серию.", "g": ["R", "S", "R", "R"], "gw": ["Стремление к власти и силе", "Сострадание и принцип, отказ от выгоды", "Хитрость и обман ради власти", "Стремление овладеть силой обманом"]}, {"id": "RD-093", "kind": "Сериал", "who": "Джон Сноу, «Игра престолов» (HBO, 5 сезон)", "when": "Чёрный замок", "title": "Одичалые за Стеной", "ctx": "Ты Джон Сноу, лорд-командующий Ночного Дозора. Так называют братство воинов, которые охраняют огромную ледяную Стену на севере от всего, что живёт за ней. За Стеной обитают одичалые, свободные племена: они веками воевали с Дозором и убивали его людей. Теперь на них идёт армия мёртвых, Белые ходоки, и одичалые просят убежища за Стеной.", "ctx2": "Многие братья Дозора ненавидят одичалых, потому что те убивали их друзей. Но ты считаешь, что настоящая угроза ― мёртвые, и людям надо объединиться, чтобы выжить.", "o": ["Не пускать одичалых: так велит устав.", "Впустить одичалых и спасти их от мёртвых.", "Сражаться с одичалыми и мёртвыми одновременно.", "Впустить только воинов."], "real": 1, "fact": "Джон отплыл на остров Хардхоум, договорился с одичалыми и после нападения мёртвых привёл уцелевших в Чёрный замок, главную крепость Дозора, открыв для них ворота.", "res": "Многие одичалые погибли от мёртвых, но уцелевшие получили шанс выжить. Часть дозорных сочла это предательством, и Джона закололи свои же братья. Позже его воскресили.", "src": "Сериал «Игра престолов», сезон 5, серии 8–10 (воскрешение — сезон 6, серия 2)", "q": "Мудрецы смотрят одинаково на учёного, смиренного брахмана, на корову, слона, собаку и на того, кто питается собачатиной.", "qs": "Бхагавад-гита 5.18", "qv": 2, "alt": ["Стена остаётся закрытой. Одичалые остаются с мёртвыми, а Дозор — с уставом.", null, "Дозор нападает на одичалых. Начинается резня, и Белые ходоки получают бесплатную победу.", "Воины входят, а женщины и дети остаются за Стеной. Мёртвые приходят к утру."], "fut": ["Через год Стена слабее, чем когда-либо.", null, "Через год никто не знает, кто победил.", "Через два года мёртвые идут на юг, а Дозор уже мёртв."], "cat": "Сериалы", "no": 93, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Сериал получил 59 премий «Эмми» — по данным Wikipedia, больше, чем любая другая драма. Его снимали в семи странах, а бюджет последнего сезона оценивают примерно в 15 млн долларов за серию.", "g": ["T", "S", "R", "R"], "gw": ["Слепое следование уставу", "Сострадание и долг защиты жизни", "Гордыня, борьба на всех фронтах", "Расчёт выгоды, контроль над рисками"]}, {"id": "RD-094", "kind": "Сериал", "who": "Тирион Ланнистер, «Игра престолов» (HBO, 4 сезон, 6 серия)", "when": "Королевская Гавань", "title": "Суд поединком", "ctx": "Ты Тирион Ланнистер, человек маленького роста (в этом мире его презрительно зовут «карликом») из богатейшей и самой влиятельной семьи королевства, младший брат королевы Серсеи. На свадебном пиру её сына, короля Джоффри, король умер от яда, и обвинили тебя. Твоя семья, включая отца и сестру, хочет твоей смерти. По закону обвинённый может потребовать суд поединком: за него в бою должен сражаться другой человек, и считается, что победа докажет его правоту.", "ctx2": "Свидетели лгут, среди них Шая, женщина, которую ты любил. Твой брат Джейме, которого ты любишь, не может сражаться за тебя: он потерял правую руку. Если никто не вызовется, тебя казнят.", "o": ["Признать вину и просить пощады.", "Потребовать суд поединком.", "Заявить, что ты невиновен, и не говорить больше ничего.", "Бежать из камеры."], "real": 1, "fact": "Тирион потребовал суд поединком.", "res": "В следующей серии за Тириона вызвался сражаться Оберин Мартелл, принц Дорна, у которого был личный счёт к Горе, огромному воину Серсеи. Оберин почти победил, но Гора убил его. Тириона признали виновным и приговорили к казни; перед ней его освободил брат Джейме, а Варис помог бежать на корабле в Эссос.", "src": "Сериал «Игра престолов», сезон 4, серии 6–10", "q": "Считай одинаковыми радость и боль, выгоду и убыток, победу и поражение — и вступай в бой. Так ты не возьмёшь на себя вины.", "qs": "Бхагавад-гита 2.38", "qv": 2, "alt": ["Ты признаёшь вину, и тебя казнят на следующий день. Никто не вспоминает, что ты невиновен.", null, "Ты молчишь, и суд принимает молчание как признание.", "Стража ловит тебя у ворот. Суд решает быстро."], "fut": ["Через год в Королевской Гавани правит Серсея.", null, "Через год твоё имя в списке казнённых.", "Через год о Тирионе никто не вспоминает."], "cat": "Сериалы", "no": 94, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Сериал получил 59 премий «Эмми» — по данным Wikipedia, больше, чем любая другая драма. Его снимали в семи странах, а бюджет последнего сезона оценивают примерно в 15 млн долларов за серию.", "g": ["T", "R", "S", "T"], "gw": ["Страх, отказ от борьбы", "Борьба за победу и выживание", "Достоинство и правда без суеты", "Бегство из страха"], "swap": {"role": "Оберин Мартелл, принц Дорна", "title": "Чемпион для Тириона", "ctx": "Ты Оберин Мартелл, принц Дорна, и в Королевской Гавани ты один из трёх судей на процессе над Тирионом Ланнистером, которого обвиняют в убийстве короля Джоффри. Лживые свидетели его топят, и Тирион потребовал суда поединком: за него в бою должен выступить чужой боец. Ты давно ищешь случая отомстить Грегору Клигану по прозвищу Гора, который, по твоему убеждению, убил твою сестру Элию и её детей. Ночью у тебя есть возможность прийти к Тириону в камеру.", "o": ["Вызваться быть бойцом Тириона и выйти против бойца Серсеи.", "Остаться судьёй и не вмешиваться в поединок.", "Предложить Тириону денег, чтобы он нанял бойца.", "Потребовать, чтобы Серсея отказалась от поединка."], "real": 0, "fact": "Ты пришёл к Тириону ночью и сказал, что Серсея не может дать тебе то, чего ты хочешь: мести за Элию и её детей. Затем ты вызвался быть его бойцом. Для тебя это шанс сразиться с Грегором Клиганом и убить его.", "res": "Ты стал защитником Тириона. Его друг Бронн через несколько дней отказался драться за него, признавшись, что боится Грегора. Сам поединок показан в следующей серии.", "src": "«Игра престолов» (HBO), 4 сезон, 7 серия «Пересмешник» («Mockingbird»); 4 сезон, 6 серия «Законы богов и людей»: Wikipedia"}}, {"id": "RD-095", "kind": "Сериал", "who": "Станнис Баратеон, «Игра престолов» (HBO, 5 сезон, 9 серия)", "when": "у стен Винтерфелла", "title": "Метель и жертва", "ctx": "Ты Станнис Баратеон, брат умершего короля, и считаешь, что трон по праву твой. Ты идёшь с войском на замок Винтерфелл, но армию замело снегом, и она голодает. Красная жрица Мелисандра, которая верит в Владыку Света, говорит, что огонь потребует жертву: если сжечь твою единственную дочь Шииру, погода изменится, и ты победишь.", "ctx2": "Шиира ― тихая девочка со шрамом на лице. Она читает книги и дружит с Дэвосом, твоим верным рыцарем, которого ты отправил в Чёрный замок. Тебе очень хочется трон, но это твоя единственная дочь.", "o": ["Попросить совета у Дэвоса.", "Принести в жертву пленника вместо дочери.", "Отказаться и вернуться к Стене.", "Принести дочь в жертву."], "real": 3, "fact": "Станнис дал согласие, и Шиира была принесена в жертву огню.", "res": "Вскоре половина войска дезертировала, а жена Станниса Селиса не пережила случившегося. Армию Станниса разбили Болтоны, а раненого Станниса нашла Бриенна и казнила.", "src": "Сериал «Игра престолов», сезон 5, серии 9–10", "q": "У этого пути к гибели три двери: похоть, гнев и жадность. Поэтому от этой тройки нужно отказаться.", "qs": "Бхагавад-гита 16.21", "qv": 2, "alt": ["Дэвос не соглашается, и Станнис остаётся один с Мелисандрой.", "Пленник горит, но погода не меняется. Армия теряет веру.", "Станнис возвращается к Стене. Трон остаётся у Ланнистеров, а Шиира жива.", null], "fut": ["Через год Шиира читает книги в замке.", "Через год армия распадается.", "Через год у Станниса нет трона, но есть дочь.", null], "cat": "Сериалы", "no": 95, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "Сериал получил 59 премий «Эмми» — по данным Wikipedia, больше, чем любая другая драма. Его снимали в семи странах, а бюджет последнего сезона оценивают примерно в 15 млн долларов за серию.", "g": ["S", "T", "S", "R"], "gw": ["Ясность, поиск здравого совета", "Жестокость и самообман", "Сострадание, отказ от амбиций ради дочери", "Властолюбие ценой дочери"]}, {"id": "RD-096", "kind": "Сериал", "who": "Десмонд Хьюм, «Остаться в живых» (Lost, ABC, 2 сезон, финал)", "when": "станция «Лебедь»", "title": "Ключ или код", "ctx": "Ты Десмонд. Почти три года ты прожил в подземном бункере на загадочном острове, куда упал самолёт. Каждые 108 минут ты обязан вводить в старый компьютер числа 4, 8, 15, 16, 23, 42. Ты не знаешь, что случится, если этого не сделать. Сегодня компьютер разбит, и ввести код нельзя. Остался один способ: провернуть аварийный ключ.", "ctx2": "Один из выживших с самолёта, Локк, разбил компьютер, а ты остался со сломанной системой и таймером, который идёт к нулю. Если провернуть ключ, станция, скорее всего, будет уничтожена.", "o": ["Бежать из станции.", "Провернуть аварийный ключ.", "Ввести код ещё раз.", "Позвать Локка и Джека."], "real": 1, "fact": "Десмонд провернул аварийный ключ.", "res": "Станция разрушилась, над островом разлилось бело-фиолетовое свечение и раздался гул. Десмонд выжил, а позже у него начались вспышки будущего.", "src": "Сериал «Остаться в живых», сезон 2, серии 23–24", "q": "На этом пути не пропадает ни одно усилие и нет вреда от неудачи. Даже малая доля этого знания избавляет от великого страха.", "qs": "Бхагавад-гита 2.40", "qv": 2, "alt": ["Ты бежишь по коридору, и станция взрывается за спиной.", null, "Код не принимается, таймер доходит до нуля. Станция гудит, и шум слышен по всему острову.", "Локк и Джек спорят, пока таймер идёт. Ты стоишь у ключа один."], "fut": ["Через год остров полон тишины.", null, "Через год станцию вспоминают как место, где не успели.", "Через год Десмонд всё ещё слышит таймер."], "cat": "Сериалы", "no": 96, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Двухсерийный пилот обошёлся примерно в 10–14 млн долларов — по сообщениям, это самый дорогой пилот в истории канала ABC. Сериал снимали почти целиком на гавайском острове Оаху, а за первый сезон он получил «Эмми» как лучший драматический сериал 2005 года.", "g": ["T", "S", "T", "T"], "gw": ["Бегство от ответственности", "Ясное принятие ответственности и действие", "Самообман, тщетное повторение", "Перекладывание ответственности"]}, {"id": "RD-097", "kind": "Сериал", "who": "Чарли Пейс, «Остаться в живых» (Lost, ABC, 3 сезон, 22 серия)", "when": "станция «Зеркало»", "title": "Один в затопленной комнате", "ctx": "Ты Чарли, один из выживших после авиакатастрофы на загадочном острове. Все, кто на нём, ждут спасения. Вы с другом Десмондом спустились под воду, на станцию «Зеркало». Чтобы позвать на помощь, нужно отключить помеху связи, а для этого надо оказаться в комнате, которую вот-вот затопит. Выход закроется, и вернуться оттуда будет нельзя.", "ctx2": "Десмонд видит вспышки будущего, в которых ты погибаешь, и рассказал тебе об этом. К острову приближается корабль, но неизвестно, друзья на нём или враги.", "o": ["Идти вместе.", "Идти самому и закрыть дверь за собой.", "Ждать, пока вода отступит.", "Пусть идёт Десмонд, а ты ждёшь."], "real": 1, "fact": "Чарли отключил помеху по коду, который успела сообщить Бонни, жительница острова. Когда в комнату хлынула вода, Чарли закрыл дверь, чтобы она не добралась до Десмонда, и написал на ладони «Not Penny's boat».", "res": "Помеха была отключена, и Пенни, подруга Десмонда, которая его ищет, связалась с Чарли и сказала, что корабль не её. Чарли утонул, но успел предупредить Десмонда.", "src": "Сериал «Остаться в живых», сезон 3, серии 22–23", "q": "Поэтому всегда делай то, что нужно делать, без привязанности к плодам: кто действует без привязанности, тот достигает высшего.", "qs": "Бхагавад-гита 3.19", "qv": 2, "alt": ["Вы идёте вместе, но дверь закрывается за обоими. Помеха отключена, но спасать больше некому.", null, "Вы ждёте, а вода поднимается. Время уходит.", "Десмонд идёт один, и вода заливает комнату. Чарли ждёт, а друг не возвращается."], "fut": ["Через год Десмонд потерял друга.", null, "Через год никто не получил помощь.", "Через год связь так и не работает."], "cat": "Сериалы", "no": 97, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Двухсерийный пилот обошёлся примерно в 10–14 млн долларов — по сообщениям, это самый дорогой пилот в истории канала ABC. Сериал снимали почти целиком на гавайском острове Оаху, а за первый сезон он получил «Эмми» как лучший драматический сериал 2005 года.", "g": ["R", "S", "T", "T"], "gw": ["Привязанность, желание разделить участь", "Самоотверженность, жертва ради всех", "Бездействие, самообман", "Перекладывание ответственности"]}, {"id": "RD-098", "kind": "Сериал", "who": "Джек Шепард, «Остаться в живых» (Lost, ABC, 4 сезон, финал)", "when": "остров", "title": "Оставить остров", "ctx": "Ты Джек, врач, ставший лидером выживших после падения самолёта на загадочный остров. К острову пришла помощь, и вертолёт может увезти тебя и ещё нескольких человек домой. Остальные останутся на острове. Чтобы защитить остров и тех, кто остаётся, вам придётся лгать всему миру о том, что здесь случилось.", "ctx2": "Ты несколько месяцев руководил выжившими. Локк, другой выживший, убеждает тебя скрыть правду. Остаться значит жить на острове дальше, улететь значит вернуться к обычной жизни.", "o": ["Остаться на острове.", "Остаться и отправить других.", "Попросить подождать до утра.", "Уехать с вертолётом вместе с остальными."], "real": 3, "fact": "Джек вместе с несколькими людьми улетел с острова на вертолёте.", "res": "Шестеро вернулись домой и стали известны как «Океаническая шестёрка». Они лгали о том, что произошло. Примерно через три года Джек решил вернуться и вместе с четырьмя другими из шестёрки полетел обратно на остров.", "src": "Сериал «Остаться в живых», сезон 4, серии 12–14 (возвращение — сезон 5)", "q": "Слабость жалости охватила меня, ум растерян в вопросе о долге. Скажи мне точно, что для меня лучше: я твой ученик, прибегнувший к тебе, наставь меня.", "qs": "Бхагавад-гита 2.7", "qv": 2, "alt": ["Ты остаёшься, а вертолёт улетает. Остров живёт дальше, но вернуться домой уже не получится.", "Остальные улетают без тебя. Ты остаёшься руководить.", "Ты просишь подождать, но ночью вертолёт улетает.", null], "fut": ["Через год остров стал домом.", "Через год ты не жалеешь, что остался.", "Через год ты слышишь шум вертолёта.", null], "cat": "Сериалы", "no": 98, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Двухсерийный пилот обошёлся примерно в 10–14 млн долларов — по сообщениям, это самый дорогой пилот в истории канала ABC. Сериал снимали почти целиком на гавайском острове Оаху, а за первый сезон он получил «Эмми» как лучший драматический сериал 2005 года.", "g": ["S", "S", "T", "T"], "gw": ["Долг защиты острова и оставшихся", "Служение другим, отказ от собственного блага", "Откладывание, нерешительность", "Бегство от ответственности ради комфорта"]}, {"id": "RD-099", "kind": "Рассказ", "who": "Дениска, «Тайное становится явным» (Виктор Драгунский)", "when": "Москва, дом с мусоропроводом", "title": "Каша и Кремль", "ctx": "Ты Дениска. Мама пообещала, что вы пойдёте в Кремль, если ты съешь всю тарелку каши, которую терпеть не можешь. Мама вышла из комнаты, и ты остался с тарелкой один.", "ctx2": "Каша тебе совсем не нравится, а в Кремль очень хочется. Ты пробовал сделать её вкуснее, но не вышло. Окно открыто.", "o": ["Тайком избавиться от каши и сделать вид, что съел.", "Спрятать тарелку под диван.", "Всё-таки съесть кашу, как обещал.", "Позвать маму и честно сказать, что не можешь есть."], "real": 0, "fact": "Дениска решил втайне избавиться от каши и сделать вид, что съел её.", "res": "Хитрость не удалась: правда быстро вскрылась, и в Кремль в тот день не пошли. Дениска понял, что тайное рано или поздно становится явным.", "src": "В. Драгунский, «Тайное становится явным» (Денискины рассказы)", "q": null, "qs": null, "qv": 0, "alt": [null, "Тарелка прячется, но мама находит её через минуту. Кремль откладывается, а разговор получается долгим.", "Ты съедаешь кашу через силу. Тарелка пустая по-настоящему, и вы идёте в Кремль.", "Ты говоришь честно. Мама вздыхает и помогает: вместе вы находите выход, и каша оказывается не такой уж страшной."], "fut": [null, "Через год ты уже не прячешь тарелки: проще сказать правду.", "Через много лет ты рассказываешь, как однажды съел всю кашу ради похода в Кремль, и все смеются.", "Через много лет ты любишь кашу, потому что мама тогда пришла на помощь."], "cat": "Денискины рассказы", "no": 99, "adult": 0, "age": 6, "vs": "верно", "kmin": 6, "scene": "🥣🪟🏛️", "stk": "🥣", "stkn": "Тарелка", "parent": "Почему Дениска обманул маму и что из этого вышло? Что лучше: схитрить или честно сказать, что не хочется есть? Расскажите смешной случай из детства, когда не получилось обмануть.", "ctxk": "Ты Дениска, и ты терпеть не можешь манную кашу. Мама пообещала, что вы пойдёте в Кремль, если ты съешь всю тарелку. Тебе очень хочется в Кремль! Мама вышла из комнаты, и ты остался с тарелкой один. Есть такую кашу невозможно, а окно открыто.", "resk": "Хитрость не удалась: правда быстро открылась, и в Кремль в тот день не пошли. Дениска понял, что тайное всегда становится явным."}, {"id": "RD-100", "kind": "Рассказ", "who": "Дениска, «Друг детства» (Виктор Драгунский)", "when": "дом Дениски", "title": "Мишка вместо груши", "ctx": "Ты решил стать боксёром, но папа не купил боксёрскую грушу. Мама достала из корзины со старыми игрушками плюшевого мишку и предложила тренироваться на нём. Мишка сидит на диване.", "ctx2": "Этого мишку тебе подарили, когда тебе было два года. Теперь он старый и потрёпанный. Но ты вдруг вспоминаешь, как раньше не расставался с ним и очень любил его.", "o": ["Сказать маме, что передумал быть боксёром.", "Подарить мишку другу.", "Убрать мишку обратно в корзину.", "Начать тренироваться и бить мишку."], "real": 0, "fact": "Дениска понял, что не сможет бить старого друга, и отказался от этой затеи.", "res": "Мама удивилась. Бить старого друга Дениске расхотелось, и мишка остался другом, а не грушей.", "src": "В. Драгунский, «Друг детства» (Денискины рассказы)", "q": null, "qs": null, "qv": 0, "alt": [null, "Мишка у друга, а ты вдруг понимаешь, что скучаешь по нему.", "Мишка снова в корзине. Ты решаешь, что бокс подождёт, а игрушку надо беречь.", "Ты бьёшь мишку, а потом вспоминаешь, как любил его. Ты кладёшь мишку обратно и просишь у него прощения."], "fut": [null, "Через год друг привёз мишку обратно, потому что он скучал не меньше тебя.", "Через год мишка живёт на полке и охраняет твои секреты.", "Через много лет ты показываешь мишку своим детям и рассказываешь о том дне."], "cat": "Денискины рассказы", "no": 100, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🧸🥊🛋️", "stk": "🧸", "stkn": "Мишка", "parent": "Почему Дениска передумал? Что мы чувствуем к старым игрушкам и друзьям? Спросите, какая игрушка у ребёнка самая любимая и почему, и что значит беречь тех, кого любишь.", "ctxk": "Ты Дениска и решил стать боксёром, чтобы побеждать всех во дворе. Ты попросил папу купить боксёрскую грушу, но папа отказал. Тогда мама достала из корзины старого плюшевого мишку и предложила тренироваться на нём. Но ты вдруг вспоминаешь, как раньше не расставался с ним и очень любил его.", "resk": "Мама удивилась. Бить старого друга Дениске расхотелось. Мишка остался другом, а не грушей."}, {"id": "RD-101", "kind": "Рассказ", "who": "Дениска, «Он живой и светится» (Виктор Драгунский)", "when": "двор, вечер", "title": "Самосвал или светлячок", "ctx": "Ты один сидишь во дворе: мама задерживается, все дети ушли, темнеет, и ты проголодался. У тебя новый самосвал, подарок папы. К тебе подходит Мишка, восхищается самосвалом и просит его отдать.", "ctx2": "Ты отказался. Мишка предложил в обмен разные свои сокровища, но они тебе не понравились. Тогда он показал спичечный коробок, а в нём сидит живой светлячок и светится зелёным огоньком.", "o": ["Оставить самосвал себе и отказаться.", "Попросить посмотреть светлячка и отдать назад.", "Отдать самосвал насовсем и взять светлячка.", "Дать Мишке самосвал поиграть, но не менять."], "real": 2, "fact": "Дениска сам предложил Мишке самосвал в обмен на светлячка, и Мишка согласился.", "res": "Дома мама удивилась, что сын отдал дорогой самосвал, и спросила, чем светлячок лучше. Дениска объяснил, что для него живой огонёк оказался дороже игрушки.", "src": "В. Драгунский, «Он живой и светится» (Денискины рассказы)", "q": null, "qs": null, "qv": 0, "alt": ["Самосвал остаётся с тобой, а светлячка нет. Во дворе темно и скучно.", "Ты смотришь на светлячка и понимаешь, что хочешь его оставить.", null, "Мишка поиграл, но огонёк так и остался в коробке. Ты слышишь, как он смеётся, а тебе грустно."], "fut": ["Через год у тебя много машинок, но ты помнишь только зелёный огонёк.", "Через много лет ты рассказываешь, как однажды увидел чудо во дворе.", null, "Через год Мишка уже забыл про коробку, а ты помнишь."], "cat": "Денискины рассказы", "no": 101, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "✨🌙🚚", "stk": "✨", "stkn": "Светлячок", "parent": "Почему светлячок оказался дороже самосвала? Что в жизни ценнее: вещи или то, что живое? Обсудите, можно ли отдавать любимое ради чуда, и поговорите о бережном отношении к природе.", "ctxk": "Ты Дениска и один сидишь во дворе. Мама задерживается, все дети ушли, темнеет, и ты проголодался. У тебя в руках новый самосвал, подарок папы. К тебе подходит Мишка, восхищается самосвалом и просит его отдать. Ты отказываешься. И вдруг Мишка показывает спичечный коробок, а в нём сидит живой светлячок и светится зелёным огоньком.", "resk": "Дениска остался один с маленьким зелёным огоньком и забыл обо всём вокруг. Дома мама удивилась, что сын отдал дорогой самосвал. Дениска объяснил, что живой огонёк для него ценнее любой игрушки."}, {"id": "RD-102", "kind": "Рассказ", "who": "Дениска, «Красный шарик в синем небе» (Виктор Драгунский)", "when": "весенний базар в большом магазине и улица, весна", "title": "Отпустить шарик", "ctx": "Ты с подругой Аленкой ходил на весенний базар. Аленка купила красный воздушный шарик на свои деньги и дала тебе подержать ниточку. Над вами синее весеннее небо.", "ctx2": "Ты чувствуешь, как шарик тянется вверх, и тебе становится его жалко: он рвётся в небо, а ты держишь его на привязи. Но шарик не твой, он Аленкин.", "o": ["Отдать шарик Аленке.", "Отпустить шарик в небо.", "Держать шарик крепко и никогда не отпускать.", "Привязать шарик к дереву."], "real": 1, "fact": "Дениска отпустил Аленкин шарик, и тот улетел в небо.", "res": "Аленка расстроилась и спросила, зачем он это сделал. Дениска не смог ей объяснить.", "src": "В. Драгунский, «Красный шарик в синем небе» (Денискины рассказы)", "q": null, "qs": null, "qv": 0, "alt": ["Аленка радуется шарику, но потом сама решает его выпустить.", null, "Шарик дома, он тянется к потолку. Ты смотришь на него и слышишь, как он будто просит выпустить его.", "Шарик у дерева, ветер его качает, а ты видишь, что небо рядом, а он нет."], "fut": ["Через год Аленка выпускает шарик сама и улыбается.", null, "Через годы ты помнишь красный шарик в окне, но не небо.", "Через год у тебя много шариков и ни одного полёта."], "cat": "Денискины рассказы", "no": 102, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🎈🌤️🌷", "stk": "🎈", "stkn": "Шарик", "parent": "Почему Дениска отпустил шарик, хотя он чужой, и как это почувствовала Алёнка? Спросите: хорошо ли распоряжаться чужим? Что можно сделать, чтобы извиниться и поддержать друга?", "ctxk": "Ты Дениска. Вы с Аленкой ходили на весенний базар, и Аленка купила красный воздушный шарик. Теперь она дала тебе подержать ниточку. Над вами синее-синее небо. Ты чувствуешь, как шарик тянется вверх, и тебе становится его жалко. Но шарик не твой, он Аленкин.", "resk": "Аленка расстроилась и спросила, зачем он это сделал. Дениска не смог ей объяснить."}, {"id": "RD-103", "kind": "Сериал", "who": "Уолтер Уайт, «Во все тяжкие» (AMC, сезон 1, серия 5 «Gray Matter»)", "when": "Альбукерке, Нью-Мексико, дом Уайтов, после дня рождения у Эллиота Шварца", "title": "Деньги бывших партнёров", "ctx": "Ты Уолтер Уайт, школьный учитель химии из Альбукерке. У тебя рак лёгких, и тайно от семьи ты варишь метамфетамин вместе с бывшим учеником Джесси. Скайлер, твоя жена, на семейном собрании требует, чтобы ты лечился, а ты твёрдо отвечаешь, что не будешь. Когда-то ты основал успешную компанию Gray Matter Technologies вместе с Эллиотом и Гретхен, но давно продал свою долю и ушёл. Теперь Скайлер рассказала им о твоей болезни, и они готовы оплатить лечение.", "ctx2": "Эллиот на своём дне рождения уже предлагал тебе работу в компании и хорошую медицинскую страховку, и тебя это сильно задело. Ты злишься на Скайлер за то, что она рассказала про рак чужим людям. Хэнк и Мари, твои родственники, спорят о том, кто вправе решать за тебя. А утром тебе звонит Гретхен.", "o": ["Принять деньги Шварцев и лечиться за их счёт, раз они сами предлагают.", "Согласиться на лечение, но от денег Шварцев отказаться и сказать Гретхен, что у тебя всё оплатит страховка.", "Принять работу в Gray Matter ради хорошей страховки и вернуться в компанию.", "Остаться при своём: отказаться и от лечения, и от помощи."], "real": 1, "fact": "Уолтер сообщил Скайлер, что согласен лечиться. Гретхен он поблагодарил, но соврал, что лечение теперь покроет страховка, и денег Шварцев не взял.", "res": "Сразу после этого Уолтер пришёл к Джесси и предложил снова варить мет вместе. Позже, в серии «ABQ», Скайлер выяснила, что Гретхен так и не присылала денег, хотя счета за лечение почти оплачены. Обида на бывших партнёров потом возвращалась к Уолтеру много раз, вплоть до последних серий.", "src": "Сериал «Во все тяжкие», сезон 1, серия 5 «Gray Matter»", "q": "Лицемерие, высокомерие, самомнение, гнев, грубость и невежество — вот, Партха, что свойственно рождённому для демонической доли.", "qs": "Бхагавад-гита 16.4", "qv": 2, "alt": ["Это лишь предположение. Скайлер, скорее всего, успокоилась бы, а Уолтеру пришлось бы терпеть Шварцев рядом с собой каждый день, пока идёт лечение. Ему не понадобились бы срочные деньги, и, возможно, он вообще не вернулся бы к варке мета с Джесси.", null, "Это лишь предположение. Уолтер получил бы страховку и работу, но снова оказался бы в тени Эллиота и Гретхен, у которых когда-то всё забрал. Тайная жизнь с Джесси могла бы остаться короткой пробой или кончиться совсем.", "Это лишь предположение. Семья осталась бы в страхе за него, Скайлер и сын продолжали бы давить, а болезнь шла бы своим чередом. Уолтер, возможно, провёл бы остаток времени, копя деньги втайне и не думая о лечении."], "fut": ["Через годы Уолтер вспоминает, как принял милостыню и навсегда остался приживалой у богатых друзей, а вместо империи у него пара абонементов в их спортклуб.", null, "Через годы Уолтер уверен: стоило взять работу, и сейчас он был бы вице-президентом Gray Matter и ездил бы на работу на самокате с логотипом компании.", "Через годы в городе поставили памятник упрямому учителю химии, который так никому и не позволил себе помочь, а у памятника вечно лежит нетронутая страховая карточка."], "cat": "Сериалы", "no": 103, "adult": 1, "age": 18, "vs": "верно", "trivia": "В 2013 году «Книга рекордов Гиннесса» признала сериал самым высоко оценённым критиками шоу всех времён: 99 баллов из 100 по агрегатору Metacritic за пятый сезон. Всего он получил 16 премий «Эмми» из 58 номинаций."}, {"id": "RD-104", "kind": "Сериал", "who": "Уолтер Уайт, «Во все тяжкие» (AMC, сезон 2, серия 12 «Phoenix»)", "when": "Альбукерке, дом Джесси Пинкмана, день", "title": "Джейн задыхается", "ctx": "Ты Уолтер Уайт, школьный учитель химии с раком. Тайно ты варишь и продаёшь метамфетамин вместе с Джесси, своим бывшим учеником и напарником. Джесси встречается с Джейн, которая раньше лечилась от наркомании, но снова сидит на героине. Недавно Джейн шантажом заставила тебя отдать Джесси его долю денег, и ты уступил. Ты подозреваешь, что эти деньги только толкают обоих ко дну.", "ctx2": "Перед этим в баре ты случайно разговорился с отцом Джейн, Дональдом, и он говорил о том, что от близких нельзя отворачиваться. Под его словами ты вернулся в дом Джесси, чтобы поговорить с ним. В комнате ты нашёл Джесси и Джейн без сознания после героина. Когда ты пытаешься растолкать Джесси, ты нечаянно задеваешь Джейн, лежащую на спине, и она начинает захлёбываться рвотой.", "o": ["Повернуть Джейн на бок и вызвать скорую.", "Тихо уйти и позвонить в скорую уже из машины, не называя себя.", "Растолкать Джесси и вместе с ним спасать её.", "Ничего не делать и позволить ей задохнуться."], "real": 3, "fact": "Уолтер бросился было помочь, но затем остановился и не стал её спасать. Он стоял и смотрел, как Джейн умирает.", "res": "Когда Джесси проснулся, Джейн уже несколько часов была мёртва. Джесси винил себя, сорвался и скрылся в притоне, откуда его забрал Уолтер и отвёз в клинику. Дональд, потрясённый смертью дочери, вернулся к работе авиадиспетчером, отвлёкся, и в небе над Альбукерке столкнулись два самолёта. Уолтер видел катастрофу со двора своего дома.", "src": "Сериал «Во все тяжкие», сезон 2, серия 12 «Phoenix» и серия 13 «ABQ»", "q": "Мудр среди людей тот, кто видит бездействие в действии и действие в бездействии. Он собран и един с истиной, даже когда занят любым делом.", "qs": "Бхагавад-гита 4.18", "qv": 2, "alt": ["Это лишь предположение. Джейн могли бы увезти в больницу, и тогда на деле всплыли бы наркотики и, возможно, сам Уолтер и его деньги. Её отец и сама Джейн, вероятно, сохранили бы шанс на другой исход.", "Это лишь предположение. Уолтер мог бы уйти, а позже узнать об исходе из новостей или звонка Джесси. Его бы не мучила сцена, которую он сам видел, но и спасти Джейн было бы уже некому.", "Это лишь предположение. Джесси, придя в себя рядом с Уолтером, мог бы осознать, как близко стоял к смерти. Но Джейн всё равно могла остаться с героином, а Джесси продолжал бы злиться на Уолтера за деньги.", null], "fut": ["Через годы Джейн с отцом ведут детективное агентство, а Уолтер получил благодарственную открытку «от спасённой» и больше не может смотреть ей в глаза.", "Через годы Уолтер так и звонит из телефона-автомата по ночам, когда уже слишком поздно, и диспетчер знает его по голосу.", "Через годы Джесси и Уолтер вместе ведут группу взаимопомощи, где каждый обязательно говорит: «А кто-то ведь вовремя повернул меня на бок».", null], "cat": "Сериалы", "no": 104, "adult": 1, "age": 18, "vs": "верно", "trivia": "В 2013 году «Книга рекордов Гиннесса» признала сериал самым высоко оценённым критиками шоу всех времён: 99 баллов из 100 по агрегатору Metacritic за пятый сезон. Всего он получил 16 премий «Эмми» из 58 номинаций."}, {"id": "RD-105", "kind": "Сериал", "who": "Джесси Пинкман, «Во все тяжкие» (AMC, сезон 3, серия 13 «Full Measure»)", "when": "Альбукерке, квартира Гейла Ветли, вечер", "title": "Пистолет у двери Гейла", "ctx": "Ты Джесси Пинкман, бывший ученик и напарник Уолтера, который вместе с ним варит метамфетамин для крупного дельца Густаво Фринга. Ты сбежал от людей Густаво и прячешься, но твой напарник Уолтер находит тебя. Он объясняет, что Густаво взял в лабораторию нового химика, Гейла, и как только тот научится варить, Уолтера и тебя убьют. Выход Уолтер видит один: убрать Гейла первым.", "ctx2": "Ты предлагал сдаться полиции, но Уолтер отказался. Тебе он сначала сказал, что сам этим займётся, но потом ситуация изменилась: Уолтер оказался в ловушке и по телефону велел тебе найти Гейла и покончить с ним, назвав адрес. Ты говоришь, что ты не убийца. Теперь ты стоишь у двери квартиры Гейла с пистолетом в руке.", "o": ["Предупредить Гейла и скрыться вместе с ним.", "Уйти и сдаться полиции.", "Бросить всё и бежать из города одному.", "Войти и застрелить Гейла."], "real": 3, "fact": "Джесси вошёл в квартиру и навёл на Гейла пистолет. Гейл умолял пощадить его, но Джесси, плача, выстрелил.", "res": "Серия кончается самим выстрелом: смерть Гейла на экране не показана, и многие зрители сомневались, попал ли Джесси. Гибель Гейла подтверждается в начале следующего сезона. Эта сцена стала переломной для Джесси и Уолтера и шагом Уолтера к образу Хайзенберга.", "src": "Сериал «Во все тяжкие», сезон 3, серия 13 «Full Measure»", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Это лишь предположение. Джесси мог бы попытаться убедить Гейла бежать, но тот был предан Густаво и мог оказаться в опасности вместе с ним. Уолтеру пришлось бы искать другой способ выжить.", "Это лишь предположение. Если бы Джесси сдался полиции, он, возможно, избежал бы убийства, но против него и Уолтера остался бы Густаво со своими людьми. Уолтер остался бы без напарника, а их опасность никуда бы не делась.", "Это лишь предположение. Один в бегах Джесси, возможно, спасся бы от убийства, но ненадолго. Уолтер остался бы один против Густаво и Гейла, а на кону были бы жизни его семьи.", null], "fut": ["Через годы Гейл и Джесси вместе держат кафе, где подают карамельный кофе, а Густаво заходит просто выпить чашку и ни о чём не спрашивает.", "Через годы Джесси водит туристические экскурсии по Альбукерке и показывает домик, где «человек, у которого всё могло быть иначе».", "Через годы Джесси так и бежит: он давно пересёк три границы, и в каждом городе его встречает один и тот же человек с вопросом про Уолтера.", null], "cat": "Сериалы", "no": 105, "adult": 1, "age": 18, "vs": "верно", "trivia": "В 2013 году «Книга рекордов Гиннесса» признала сериал самым высоко оценённым критиками шоу всех времён: 99 баллов из 100 по агрегатору Metacritic за пятый сезон. Всего он получил 16 премий «Эмми» из 58 номинаций."}, {"id": "RD-106", "kind": "Сериал", "who": "Уолтер Уайт, «Во все тяжкие» (AMC, сезон 5, серия 15 «Granite State»)", "when": "Бар в маленьком городке на севере Нью-Гэмпшира, вскоре после звонка сыну", "title": "Сдаться или бежать", "ctx": "Ты Уолтер Уайт, бывший школьный учитель химии, ставший главным производителем метамфетамина на юго-западе США. Теперь тебя разыскивают по всей стране, а ты прячешься в глуши Нью-Гэмпшира под чужим именем. Твой зять Хэнк погиб, деньги почти все отняты, жена Скайлер осталась одна с детьми. Ты пытался передать сыну сто тысяч долларов, но тот в ярости обругал тебя и пожелал тебе смерти.", "ctx2": "После этого ты решил сдаться: позвонил в DEA, назвал себя и оставил трубку снятой, чтобы тебя нашли. Теперь ты сидишь в баре с виски и ждёшь, когда приедет полиция. Над стойкой работает телевизор, и по нему идёт интервью Чарли Роуза с Гретхен и Эллиотом Шварцами, твоими бывшими партнёрами по Gray Matter. Они говорят о тебе, о твоём вкладе в компанию и о синем мете, который всё ещё продаётся на улицах.", "o": ["Остаться в баре и дождаться полиции, как решил.", "Забыть про сдачу и уйти до приезда полиции, чтобы вернуться в Альбукерке и довести дело до конца.", "Позвонить Скайлер, объяснить, что сдаёшься, и только потом ждать.", "Уйти и вернуться в хижину, а в DEA позвонить ещё раз и отказаться от слов."], "real": 1, "fact": "К концу интервью Уолтер передумал сдаваться и ушёл из бара. Полиция приехала и обыскала бар, но его там уже не было: остались недопитый виски и двадцатидолларовая купюра.", "res": "Уолтер вернулся в Нью-Мексико. Он пришёл к Гретхен и Эллиоту, заставил их положить оставшиеся 9,72 миллиона долларов в траст для сына, затем оставил Скайлер координаты могил Хэнка и Стива Гомеса и отправился к Джеку и его людям. В перестрелке он убил почти всех, освободил Джесси и сам умер от ран в лаборатории Джека.", "src": "Сериал «Во все тяжкие», сезон 5, серия 15 «Granite State» и серия 16 «Felina»", "q": "Лучше свой долг, пусть исполненный несовершенно, чем чужой, исполненный хорошо. Лучше погибнуть в своём деле: чужой путь опасен.", "qs": "Бхагавад-гита 3.35", "qv": 2, "alt": ["Это лишь предположение. Уолтер оказался бы в руках DEA, а Скайлер получила бы шанс договориться о доме и защите детей. Но Джесси остался бы в плену у Джека, а Шварцы не заплатили бы ни доллара.", null, "Это лишь предположение. Разговор со Скайлер мог бы смягчить её или, наоборот, привести к ещё одному скандалу. За это время приедет полиция, и сдача, скорее всего, состоялась бы раньше, чем Уолтер передумал.", "Это лишь предположение. Вернувшись в хижину, Уолтер, возможно, провёл бы там остаток дней, болея и играя в карты с Эдом. Синий мет продавали бы дальше, а Джесси продолжал бы работать на Джека."], "fut": ["Через годы Уолтер сидит в тюремной библиотеке и пишет мемуары под заголовком «Как я не пошёл на ток-шоу».", null, "Через годы Скайлер получает от бывшего мужа открытку каждую неделю, и каждый раз почтальон привозит её по другому адресу.", "Через годы Уолтер так и живёт в хижине, держа кошелёк в одной руке и пульт от телевизора в другой, и смотрит повторы того самого интервью."], "cat": "Сериалы", "no": 106, "adult": 1, "age": 18, "vs": "верно", "trivia": "В 2013 году «Книга рекордов Гиннесса» признала сериал самым высоко оценённым критиками шоу всех времён: 99 баллов из 100 по агрегатору Metacritic за пятый сезон. Всего он получил 16 премий «Эмми» из 58 номинаций."}, {"id": "RD-107", "kind": "Сериал", "who": "Джимми Макгилл, «Лучше звоните Солу» (AMC, сезон 3, серия 5 «Chicanery»)", "when": "Альбукерке, зал слушаний коллегии адвокатов Нью-Мексико", "title": "Аккумулятор для брата", "ctx": "Ты Джимми Макгилл, адвокат из Альбукерке. Твой старший брат Чак, когда-то совладелец крупной фирмы Hamlin, Hamlin & McGill, подал на тебя жалобу в коллегию адвокатов: он добивается, чтобы тебя лишили лицензии. Чак уверен, что страдает аллергией на электричество, и поэтому живёт без электроприборов. Твоя коллега и подруга Ким Уэкслер защищает тебя вместе с тобой.", "ctx2": "Зал заседаний подготовлен так, чтобы Чаку было удобно: электричества там минимум. Говард Хэмлин, партнёр Чака, уже дал показания в пользу брата, а комиссии включили запись, где ты признаёшься в проступке. Теперь Чак сам приходит давать показания, и у тебя появляется возможность задать ему вопросы. Ты знаешь, что его болезнь, по-твоему, в его голове, и до выступления успел кое-что подготовить.", "o": ["Признать вину, попросить прощения у Чака и комиссии и принять наказание.", "Попытаться дискредитировать Чака, напомнив о его прошлых ошибках в работе и ссоре с Говардом.", "Тихо предложить комиссии мировую: ты уйдёшь из юриспруденции в обмен на прекращение дела.", "Спросить Чака, где ближайший источник электричества, и подловить его на подброшенном аккумуляторе."], "real": 3, "fact": "Джимми заставил Чака подробно рассказать о своей чувствительности к электричеству и потребовал проверить карман. Там оказался аккумулятор от телефона, который по просьбе Джимми подложил Хуэлл, и Чак носил его почти два часа без симптомов.", "res": "Чак сорвался в крик о махинациях брата и закончил фразу только тогда, когда увидел, что весь зал замолчал. Решение коллегии в этой серии не показано, но позже Джимми получил приостановку лицензии, а не лишение. В финале сезона болезнь Чака обернулась бедой: в его доме начался пожар.", "src": "Сериал «Лучше звоните Солу», сезон 3, серия 5 «Chicanery»; сезон 3, серия 10 «Lantern»", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": ["Это лишь предположение. Покаяние могло бы смягчить комиссию, но не остановило бы Чака, которому нужна победа. Джимми, возможно, потерял бы лицензию и остался без профессии, а Ким пришлось бы расплачиваться вместе с ним.", "Это лишь предположение. Попытка вытащить ошибки Чака, скорее всего, лишь укрепила бы образ взрослого человека, обиженного на брата. Комиссия могла бы решить, что Джимми просто пытается свести счёты.", "Это лишь предположение. Мировая сохранила бы Джимми свободу от суда, но стоила бы ему лицензии и всего, ради чего он учился. Чак, вероятно, не получил бы никакого публичного поражения, и вражда осталась бы навсегда.", null], "fut": ["Через годы Джимми ходит на семейные ужины с братом и каждый раз проверяет, нет ли у него в карманах чужих аккумуляторов.", "Через годы братья Макгилл совместно ведут юридическую фирму «Вежливые извинения», а над дверью висит табличка «Электричества нет».", "Через годы Джимми прячется от чужих глаз, а Чак поёт на каждом углу, что брат «ушёл из права, а так и остался плохим мальчишкой».", null], "cat": "Сериалы", "no": 107, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Сериал получил 53 номинации на «Эмми» и ни одной победы — по данным Wikipedia, это рекорд по числу номинаций без наград. Его премьера в 2015 году собрала около 6,9 млн зрителей и тогда стала самой рейтинговой премьерой сценарного сериала в истории базового кабельного ТВ США."}, {"id": "RD-108", "kind": "Сериал", "who": "Ким Уэкслер, «Лучше звоните Солу» (AMC, сезон 6, серия 12 «Waterworks»)", "when": "Титусвилл (Флорида), затем Альбукерке, около 2010 года", "title": "Признание Ким", "ctx": "Ты Ким Уэкслер, бывшая адвокат из Альбукерке. Ты разошлась с Джимми, оставила юриспруденцию и теперь живёшь тихой жизнью во Флориде, работаешь на компанию по установке поливалок и стараешься ни на что не влиять. Но ты не можешь забыть о Говарде Хэмлине, адвокате, которого вы с Джимми пытались опозорить своей схемой, и о его смерти. Его вдова, Шерил, до сих пор не знает правды.", "ctx2": "Джимми, который теперь живёт под чужим именем и называет себя Джин, позвонил тебе. Ты посоветовала ему сдаться полиции, но он отказался. Ты понимаешь, что твоё признание могло бы стоить тебе свободы или лицензии, но доказательств, кроме слов, у властей почти нет. В Альбукерке тебя ждут люди, которых ты подвела.", "o": ["Ничего не предпринимать и остаться во Флориде в тишине.", "Написать Шерил анонимное письмо и не возвращаться в Альбукерке.", "Прилететь к Шерил, лично рассказать ей правду, передать письменное признание и отправить заявление окружному прокурору.", "Прийти в полицию и сдаться, не объясняясь с Шерил."], "real": 2, "fact": "Ким прилетела в Альбукерке и передала Шерил письменное признание о схеме против Говарда и правде о его смерти. Она также сказала, что отправила заявление окружному прокурору.", "res": "Ким предупредила, что, возможно, не понесёт наказания: у властей мало улик и свидетелей. В ту же ночь в автобусе до аэропорта у неё случился эмоциональный срыв. Судьба Ким и Джимми решается уже в следующих сериях.", "src": "Сериал «Лучше звоните Солу», сезон 6, серия 12 «Waterworks»", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": ["Это лишь предположение. Ким сохранила бы тихую жизнь, но правда о Говарде осталась бы неизвестной для его вдовы. Совесть, возможно, продолжала бы мучить её, а Джимми остался бы единственным, кто знает всё.", "Это лишь предположение. Анонимное письмо защитило бы Ким от последствий, но Шерил не услышала бы извинения и не узнала бы, кто пишет. Для самой Ким это, возможно, было бы лишь иллюзией освобождения.", null, "Это лишь предположение. Признание в полиции без объяснений Шерил дало бы следователям материал, но вдова могла бы узнать правду из чужих слов. Ким, вероятно, рисковала бы собой сильнее, чем при письменном признании."], "fut": ["Через годы Ким ведёт курс лекций «Как жить, не вмешиваясь», а слушателей так и не набралось ни одного.", "Через годы Шерил получает анонимные письма со всего мира и уже не отличает, какое из них от Ким.", null, "Через годы Ким приходит в участок так часто, что сержант ставит ей отдельный стул и чашку."], "cat": "Сериалы", "no": 108, "adult": 0, "age": 12, "vs": "верно", "trivia": "Сериал получил 53 номинации на «Эмми» и ни одной победы — по данным Wikipedia, это рекорд по числу номинаций без наград. Его премьера в 2015 году собрала около 6,9 млн зрителей и тогда стала самой рейтинговой премьерой сценарного сериала в истории базового кабельного ТВ США."}, {"id": "RD-109", "kind": "Сериал", "who": "Джоэл Миллер, «Одни из нас» (HBO, сезон 1, серия 9)", "when": "больница Цикад (Fireflies), после долгого пути через США", "title": "Элли или лекарство", "ctx": "Ты Джоэл, контрабандист и одиночка в мире, где грибковая инфекция превратила людей в чудовищ. Много недель ты вёл через всю страну четырнадцатилетнюю Элли, которая невосприимчива к заражению, и по дороге она стала для тебя почти родной. Теперь вы в больнице повстанцев-Цикад: ты очнулся после газовой атаки, а Элли уже готовят к операции. Цикады хотят сделать из неё вакцину, и они уверены, что это спасёт человечество.", "ctx2": "Ты узнаёшь от Марлин, лидера Цикад, что врач хочет достать грибок из Элли. Ты замечаешь, что грибок растёт в мозге, а значит, операция её убьёт. Марлин говорит, что Элли ничего не почувствует, и велит своим людям отвести тебя к шоссе, а при сопротивлении убить.", "o": ["Вырваться от конвоя, пробиться к операционной и забрать Элли силой", "Потребовать, чтобы Цикады отложили операцию и нашли другой способ, а самому остаться рядом и ждать", "Согласиться с Марлин и уйти по шоссе одному, оставив Элли врачам", "Попытаться тихо договориться с врачом и увести Элли, никого не убивая"], "real": 0, "fact": "Джоэл убил двух конвоиров, потом всех, кто встал у него на пути, застрелил врача, который отказался отключить Элли от аппаратов, и вынес её из операционной. В гараже он застрелил и Марлин, которая пыталась его остановить.", "res": "Увозя Элли, Джоэл соврал ей: сказал, что врачи испытывали лекарство на десятках невосприимчивых людей, у них ничего не вышло и они бросили поиски, а больницу атаковали рейдеры. Позже Элли попросила его поклясться, что это правда, и он поклялся. Она ответила: «Ладно».", "src": "Сериал «Одни из нас», сезон 1, серия 9 «Look for the Light»", "q": "Кто думает о предметах чувств, у того возникает привязанность к ним; из привязанности рождается желание, из желания — гнев.", "qs": "Бхагавад-гита 2.62", "qv": 2, "alt": [null, "Скорее всего, Марлин отказала бы. Её люди были готовы убить Джоэла при сопротивлении, а время до операции уходило, так что ожидание, скорее всего, ничего не изменило бы.", "Предположительно, Элли осталась бы в больнице и операция прошла бы. По словам самих персонажей, она бы не выжила, а вакцина осталась бы под вопросом, потому что никто не знает, получилось ли бы у Цикад.", "Можно предположить, что тихие переговоры не сработали бы: врач считал операцию единственным шансом на вакцину, а Марлин и её люди уже решили вопрос."], "fut": [null, "Через годы Джоэл бы стал самым терпеливым человеком в мире: до сих пор сидит у дверей больницы и ждёт, пока кто-нибудь передумает.", "Через годы Джоэла бы вспоминали как человека, который сдал девочку ради человечества, а он бы каждую ночь пытался понять, было ли это правильно.", "Через годы Джоэл бы открыл частную службу вежливых переговоров с повстанцами, и все бы просили у него автограф вместо спасения человечества."], "cat": "Сериалы", "no": 109, "adult": 1, "age": 18, "vs": "верно", "trivia": "Сериал получил 24 номинации на 75-ю премию «Эмми» — это на три меньше, чем у «Наследников» с 27. Он также выиграл 8 премий Creative Arts Emmy и стал самым награждённым шоу той церемонии."}, {"id": "RD-110", "kind": "Сериал", "who": "Тесс, «Одни из нас» (HBO, сезон 1, серия 2)", "when": "здание Капитолия в Бостоне, на пункте Цикад", "title": "Укус и последний шанс", "ctx": "Ты Тесс, напарница Джоэла, и вы вдвоём пробираетесь по разрушенному Бостону вместе с четырнадцатилетней Элли. Вы должны передать её Цикадам, повстанцам, которые ищут лекарство от грибковой инфекции. Дойдя до здания Капитолия, где был их пункт, вы находите только горы снаряжения и мёртвых людей. Ты уже знаешь то, чего Джоэл и Элли пока не знают.", "ctx2": "Тебя укусили во время схватки с заражёнными в музее, и инфекция уже идёт по телу. Цикад, ради которых всё затевалось, больше нет. Ты видишь, что рядом стоят бочки с топливом и лежат гранаты.", "o": ["Притвориться здоровой и пойти дальше с ними, пока не станет совсем плохо", "Попросить Джоэла добить тебя, чтобы не мучиться", "Остаться в здании и поджечь его, чтобы заражённые не пошли за Джоэлом и Элли", "Убежать одной, чтобы никто не видел, как ты превращаешься"], "real": 2, "fact": "Тесс сказала Джоэлу, что обречена, попросила довести Элли до Билла и Фрэнка и спасти тех, кого получится. Она осталась в здании, а когда на выстрел сбежались заражённые, подожгла топливо и взорвала всё.", "res": "Джоэл с Элли выбежали наружу, а Тесс погибла в огне вместе с толпой заражённых. Перед этим один из заражённых успел до неё добраться, а зажигалка не сразу сработала. После её смерти Джоэл и Элли продолжили путь вдвоём.", "src": "Сериал «Одни из нас», сезон 1, серия 2 «Infected»", "q": "Для рождённого смерть неизбежна, для умершего неизбежно новое рождение. Поэтому о том, чего не миновать, тебе не стоит скорбеть.", "qs": "Бхагавад-гита 2.27", "qv": 2, "alt": ["Предположительно, ты бы шла с ними и скрывала укус, но инфекция прогрессировала бы, и в какой-то момент ты стала бы опасна для Элли и Джоэла. Выбирать пришлось бы им, а не тебе.", "Можно предположить, что Джоэл не смог бы этого сделать: заражённые вокруг уже шли к зданию, и выстрел только привлёк бы их ещё сильнее.", null, "Скорее всего, в одиночку ты бы далеко не ушла: заражённые уже сходились к зданию, а тебя бы никто не защитил и ничего бы не отвлекло от Джоэла с Элли."], "fut": ["Через годы тебя бы считали бродячей зомби-бабушкой, которая до сих пор бродит по Бостону и просит у прохожих зажигалку.", "Через годы Джоэл бы стал знаменитым тем, что единственный в мире стрелял в напарницу по её просьбе, и об этом писали бы в школьных учебниках.", null, "Через годы Бостон бы назвали в твою честь: «Город Одинокой Тесс, где даже заражённые уважительно обходят улицу»."], "cat": "Сериалы", "no": 110, "adult": 1, "age": 18, "vs": "верно", "trivia": "Сериал получил 24 номинации на 75-ю премию «Эмми» — это на три меньше, чем у «Наследников» с 27. Он также выиграл 8 премий Creative Arts Emmy и стал самым награждённым шоу той церемонии."}, {"id": "RD-111", "kind": "Сериал", "who": "Генри, «Одни из нас» (HBO, сезон 1, серия 5)", "when": "Канзас-Сити, карантинная зона под властью ФЕДРА, незадолго до встречи с Джоэлом", "title": "Цена лекарства для брата", "ctx": "Ты Генри, живёшь в Канзас-Сити, где всем заправляет военная организация ФЕДРА. С тобой твой младший брат Сэм, он глухой, и вы общаетесь на языке жестов. Сэм тяжело заболел лейкемией. Лекарство есть только у ФЕДРА, и они не раздают его просто так.", "ctx2": "Ты знаешь Майкла, лидера городского сопротивления: ты им восхищаешься и даже ходил за ним. Он брат Кэтлин, одной из руководительниц повстанцев. ФЕДРА дали понять, что за лекарство нужна большая плата.", "o": ["Попросить помощи у Майкла и Кэтлин и рассчитывать на их сопротивление", "Отказаться от сделки и искать лекарство в других городах", "Украсть лекарство со склада ФЕДРА и бежать с Сэмом из города", "Выдать ФЕДРА, где скрывается Майкл, в обмен на лекарство"], "real": 3, "fact": "Генри отдал ФЕДРА местонахождение Майкла, лидера сопротивления, и получил за это лекарство для Сэма.", "res": "По словам Кэтлин, Майкла убила ФЕДРА, хотя перед смертью он просил её пощадить Генри. Кэтлин не простила Генри, внесла его в список тех, кого ищет, и начала охоту. Позже Генри рассказал о сделке Джоэлу, а Генри и Сэм бежали из города вместе с Джоэлом и Элли.", "src": "Сериал «Одни из нас», сезон 1, серия 5 «Endure and Survive»", "q": "Не бросай дело, к которому ты призван по своей природе, даже если в нём есть изъян: у любого дела есть недостатки, как у огня есть дым.", "qs": "Бхагавад-гита 18.48", "qv": 2, "alt": ["Можно предположить, что повстанцы не смогли бы достать лекарство сами, ведь оно было только у ФЕДРА. Помощь Майкла и Кэтлин в этом случае вряд ли была бы реальной.", "Скорее всего, в других городах найти нужное лекарство не вышло бы, а Сэм мог не дожить до конца поисков, потому что болезнь была тяжёлой.", "Предположительно, кража лекарства была бы очень опасной: ФЕДРА охраняла его, и тебя могли поймать вместе с Сэмом.", null], "fut": ["Через годы Майкл и Кэтлин бы построили на Генри и Сэме целую империю: «Канзас-Сити, где лекарства раздают бесплатно, а ФЕДРА пишет жалобы».", "Через годы Генри бы ходил из города в город с чемоданом, в котором лежит одно лекарство, и спрашивал бы у каждого прохожего, не болеет ли он лейкемией.", "Через годы Генри называли бы Королём Воров, а ФЕДРА до сих пор ищет склад, из которого он украл последний пузырёк.", null], "cat": "Сериалы", "no": 111, "adult": 1, "age": 18, "vs": "верно", "trivia": "Сериал получил 24 номинации на 75-ю премию «Эмми» — это на три меньше, чем у «Наследников» с 27. Он также выиграл 8 премий Creative Arts Emmy и стал самым награждённым шоу той церемонии."}, {"id": "RD-112", "kind": "Сериал", "who": "Сон Ги Хун, «Игра в кальмара» (Netflix, сезон 1, серия 2)", "when": "Сеул, после того как игроков отпустили домой", "title": "Вернуться в игру", "ctx": "Ты Сон Ги Хун, игрок номер 456, по уши в долгах. Тебя вместе с сотнями других должников заманили в тайную игру на деньги, где проигравший погибает. После первого раунда игроки проголосовали, и небольшое большинство решило уйти, ты тоже голосовал за уход. Вас вывезли на фургонах и оставили на пустых улицах.", "ctx2": "Ты пытаешься жить обычной жизнью, но твоя мать больна диабетом, ты отменил её страховку, чтобы играть на деньги, и занимать у бывшей жены не хочешь. Выясняется, что она с дочерью переезжает в США. Ты получаешь домой новую визитку с приглашением в игру.", "o": ["Вернуться в игру по приглашению ещё раз", "Рассказать полиции всё, что ты видел, и ждать расследования", "Выбросить визитку и попытаться выплатить долги честным трудом", "Попросить денег у бывшей жены и отказаться от игры"], "real": 0, "fact": "Ги Хун решил вернуться в игру: денег у него не было, мать нуждалась в лечении, а дочь собиралась уехать в США с матерью и отчимом.", "res": "Ги Хун сел в фургон, и игра продолжилась. Позже, в серии 3, большинство игроков тоже вернулись, хотя часть решила не возвращаться. В финале сезона Ги Хун остался последним игроком и получил приз в 45,6 миллиарда вон.", "src": "Сериал «Игра в кальмара», сезон 1, серия 2 «Hell»", "q": "У этого пути к гибели три двери: похоть, гнев и жадность. Поэтому от этой тройки нужно отказаться.", "qs": "Бхагавад-гита 16.21", "qv": 2, "alt": [null, "Можно предположить, что заявление полиции не помогло бы: в сериале его слова уже принимали за болтовню пьяного, и дело не сдвинулось.", "Предположительно, честный труд не помог бы: долги слишком велики, а мать нуждалась в лечении прямо сейчас. Ги Хун рисковал бы потерять и дочь, и мать.", "Скорее всего, бывшая жена не смогла бы помочь: она уже переезжала, и семья ждала отъезда, а долги Ги Хуна остались бы при нём."], "fut": [null, "Через годы полиция бы вручила Ги Хуну медаль за самый длинный рапорт в истории, а игру так никто и не нашёл.", "Через годы Ги Хун стал бы самым честным грузчиком в мире и выплатил бы долги копейка за копейкой к своему столетию.", "Через годы бывшая жена бы заняла ему пять тысяч вон, и они бы поженились снова: на этот раз по расписанию, без игр и долгов."], "cat": "Сериалы", "no": 112, "adult": 1, "age": 18, "vs": "исправлено", "trivia": "За первые 28 дней зрители посмотрели сериал около 1,65 млрд часов — Netflix назвал это самым большим результатом в своей истории на тот момент (2021). Ли Джон Джэ в 2022 году стал первым актёром, получившим «Эмми» за роль на неанглийском языке."}, {"id": "RD-113", "kind": "Сериал", "who": "Сон Ги Хун, «Игра в кальмара» (Netflix, сезон 1, серия 9)", "when": "арена финальной игры в кальмара, последняя ночь игр", "title": "Конец игры в кальмара", "ctx": "Ты Сон Ги Хун, игрок номер 456, и в живых остались только двое: ты и Сан У, твой друг. Вам обоим нужен приз в 45,6 миллиарда вон, но выиграть может только один. Последняя игра идёт на арене в форме кальмара, и она быстро превращается в драку на ножах под искусственным дождём. Сан У только что признался, что убил Сэ Бёк, чтобы вы с ней не смогли проголосовать за конец игры.", "ctx2": "Ты первым бросил Сан У песок в глаза и ушёл вперёд, а потом схватка стала жёсткой. В итоге ты оказался сильнее и лежишь над Сан У, а у тебя в руке нож. По правилам игры ты можешь победить, а можешь вспомнить, что игроки вправе проголосовать за конец игр.", "o": ["Отказаться добивать, предложить проголосовать за конец игры и вернуться домой вместе", "Бросить нож и дать Сан У выиграть, чтобы он помог родным", "Продолжать драться, пока один из вас не упадёт сам", "Добить Сан У и забрать приз"], "real": 0, "fact": "Ги Хун отказался убивать Сан У и предложил проголосовать за конец игры, чтобы они оба вернулись домой.", "res": "Сан У не захотел жить с чувством вины и без денег и лишил себя жизни, попросив Ги Хуна позаботиться о его матери. Ги Хун стал победителем по умолчанию и получил 45,6 миллиарда вон. Позже он отдал деньги семье Сан У и брату Сэ Бёк, а в конце сезона не сел на самолёт в США и решил разоблачить организаторов.", "src": "Сериал «Игра в кальмара», сезон 1, серия 9 «One Lucky Day»", "q": "Совершенным йогином, Арджуна, я считаю того, кто по себе судит обо всех: в радости и в беде он видит другого равным себе.", "qs": "Бхагавад-гита 6.32", "qv": 2, "alt": [null, "Можно предположить, что Сан У выиграл бы деньги, но в игре не было гарантии, что он выполнил бы то, о чём просил, и судьба Ги Хуна осталась бы неизвестной.", "Скорее всего, драка закончилась бы тем же: один из вас погиб бы, а второй остался бы с призом и чувством вины.", "Предположительно, ты бы выиграл и получил приз, но убил бы старого друга своими руками. Дальше всё зависело бы от того, как ты с этим справишься."], "fut": [null, "Через годы Сан У бы стал губернатором Сеула и каждую весну дарил бы Ги Хуну благодарственные открытки с ножом на обложке.", "Через годы вы с Сан У бы всё ещё дрались на арене, а зрители уже записали бы поединок в Книгу рекордов как самую долгую игру.", "Через годы Ги Хун бы владел самым большим банком мира, а на каждой банкноте был бы нарисован нож и подпись: «Я победил»."], "cat": "Сериалы", "no": 113, "adult": 1, "age": 18, "vs": "верно", "trivia": "За первые 28 дней зрители посмотрели сериал около 1,65 млрд часов — Netflix назвал это самым большим результатом в своей истории на тот момент (2021). Ли Джон Джэ в 2022 году стал первым актёром, получившим «Эмми» за роль на неанглийском языке."}, {"id": "RD-114", "kind": "Сериал", "who": "Майк Уилер, «Очень странные дела» (Netflix, сезон 1, серия 2)", "when": "Хокинс, штат Индиана, ноябрь 1983 года", "title": "Скрыть девочку от взрослых", "ctx": "Ты Майк, школьник из маленького городка Хокинс. Твой друг Уилл пропал, и вы с друзьями Лукасом и Дастином ищете его сами. В лесу вы нашли странную девочку с бритой головой в больничной рубашке: она почти не говорит и, кажется, чего-то очень боится. Вы привели её к тебе домой, и теперь она сидит в вашем подвале.", "ctx2": "Лукас считает девочку подозрительной и мешающей поискам. Девочка сама отказывается идти к взрослым и предупреждает, что тогда придут опасные люди. Родители дома ничего не знают.", "o": ["Рассказать маме, что в подвале прячется девочка, и позвать полицию", "Прогнать её, чтобы не вовлекать семью и не рисковать", "Отвести её к шефу полиции Хопперу, который ведёт поиски Уилла", "Спрятать её в подвале и никому из взрослых не говорить"], "real": 3, "fact": "Майк решил спрятать девочку от взрослых: она осталась ночевать в его подвале, а он дал ей прозвище Эл.", "res": "Майк скрывал Эл от семьи: когда она пряталась в шкафу, она вспомнила лабораторию, а один раз вышла к столу, когда вся семья ужинала, и Дастин спас положение. Эл позже узнала Уилла на фотографии и показала друзьям, где он, перевернув доску игры «Подземелья и драконы».", "src": "Сериал «Очень странные дела», сезон 1, серия 2 «Chapter Two: The Weirdo on Maple Street»", "q": "Кто ни к кому не питает вражды, дружелюбен и сострадателен, не говорит «моё» и «я», ровен в радости и в беде, терпелив, всегда доволен, собран, обуздан и твёрд в решимости, а ум и рассудок отдал Мне, тот Мне дорог.", "qs": "Бхагавад-гита 12.13–14", "qv": 2, "alt": ["Предположительно, мама позвонила бы в полицию, а девочку забрали бы, и друзья потеряли бы единственную подсказку о том, где Уилл. Что с ней стало бы потом, мы можем только гадать.", "Скорее всего, девочка осталась бы одна и испуганная, а вы потеряли бы шанс найти Уилла с её помощью.", "Можно предположить, что Хоппер не принял бы ваш рассказ всерьёз: он сам был уверен, что Уилл просто потерялся, и гоняться за странной девочкой не стал бы.", null], "fut": ["Через годы Майк бы получил Нобелевскую премию за образцовую честность: он рассказал маме про каждую найденную пылинку.", "Через годы Майк бы до сих пор стоял на улице с табличкой «Девочка, возвращайся», а мама ему велела бы идти спать.", "Через годы шеф Хоппер бы стал мэром Хокинса, а Майк работал бы его пресс-секретарём и объяснял всем, почему девочка живёт в мэрии.", null], "cat": "Сериалы", "no": 114, "adult": 0, "age": 12, "vs": "верно", "trivia": "По словам Мэтта Даффера, сериал отклонили 15–20 телеканалов и студий, пока его не купил Netflix. Четвёртый сезон набрал около 1,15 млрд часов просмотра за 28 дней после выхода каждой части и стал самым популярным англоязычным сериалом Netflix на тот момент (2022)."}, {"id": "RD-115", "kind": "Сериал", "who": "Одиннадцать (Эл), «Очень странные дела» (Netflix, сезон 2, серия 7)", "when": "Чикаго, тайное убежище банды Кали, 1984 год", "title": "Остаться с Кали или домой", "ctx": "Ты Одиннадцать, девочка со сверхспособностями, которую в детстве забрали в лабораторию доктора Бреннера. Ты нашла в Чикаго свою «сестру» Кали, которую звали Восьмой и с которой лаборатория обошлась так же. Кали живёт с бандой панков, которые мстят людям из лаборатории. Они хотели убить бывшего сотрудника Рэя, и ты сама помогла его найти.", "ctx2": "Ты начала душить Рэя, но остановилась, а потом не дала Кали его застрелить. Кали говорит, что ты вольна уйти, но тут же устраивает иллюзию Бреннера, чтобы заставить тебя остаться. Ты расплакалась. Банда сообщает, что вызвала полицию.", "o": ["Остаться в Чикаго одной и скрыться от всех", "Вернуться в Хокинс к друзьям", "Остаться с Кали и бандой и вместе искать тех, кто виноват", "Сдаться полиции и всё рассказать"], "real": 1, "fact": "Одиннадцать убежала, села на поезд до Хокинса и сказала старушке в поезде, что едет домой.", "res": "Когда полиция ворвалась в убежище, банда скрылась на фургоне, а Кали блокировала погоню иллюзией металлической стены. Одиннадцать убежала и поехала в Хокинс. Перед этим у неё было видение, в котором её друзьям в Хокинсе угрожает Пожиратель разума.", "src": "Сериал «Очень странные дела», сезон 2, серия 7 «Chapter Seven: The Lost Sister»", "q": "Лучше свой долг, пусть исполненный несовершенно, чем чужой, исполненный хорошо. Лучше погибнуть в своём деле: чужой путь опасен.", "qs": "Бхагавад-гита 3.35", "qv": 2, "alt": ["Скорее всего, в одиночку ты была бы очень уязвима: в городе тебя бы искали, а помощи было бы мало.", null, "Предположительно, ты осталась бы в банде и участвовала бы в мести. Это могло бы затянуть тебя в жестокость, а друзья в Хокинсе остались бы без помощи.", "Можно предположить, что полиция не поняла бы твоих сил и вряд ли поверила бы рассказу. Вы с Кали могли бы потерять свободу."], "fut": ["Через годы Одиннадцать бы жила в Чикаго в маленькой хижине на крыше небоскрёба, и её кто-то да нашёл бы по запаху вафель.", null, "Через годы Одиннадцать бы возглавляла Чикагский клуб мести, а члены клуба по субботам вешали бы на двери шторы из игры «Подземелья и драконы».", "Через годы Одиннадцать стала бы главным детективом полиции Чикаго и каждый день закрывала дела одним взглядом, а коллеги называли бы её просто «Бог»."], "cat": "Сериалы", "no": 115, "adult": 0, "age": 12, "vs": "верно", "trivia": "По словам Мэтта Даффера, сериал отклонили 15–20 телеканалов и студий, пока его не купил Netflix. Четвёртый сезон набрал около 1,15 млрд часов просмотра за 28 дней после выхода каждой части и стал самым популярным англоязычным сериалом Netflix на тот момент (2022)."}, {"id": "RD-116", "kind": "Сериал", "who": "Жан-Люк Пикар, «Звёздный путь: Следующее поколение» (Paramount, сезон 2, серия 9)", "when": "Звёздная база 173 Звёздного флота, XXIV век", "title": "Суд над Дейтой", "ctx": "Ты ― Жан-Люк Пикар, капитан звездолёта «Энтерпрайз». Твой друг Дейта ― андроид, он служит на твоём корабле офицером, как любой человек. Учёный Брюс Мэддокс хочет разобрать Дейту, чтобы изучить его мозг и научиться делать таких же роботов, и обещает, что память Дейты сохранится. Дейта не верит в это обещание и отказывается, а Мэддокс требует приказом исполнить свой план.", "ctx2": "Дейта пытается уйти из Звёздного флота, но Мэддокс отвечает, что робот ― имущество флота и уволиться не может. Судья-адвокат сектора, капитан Филиппа Луврой, когда-то вела против тебя дело и теперь решает спор. Сначала она встаёт на сторону Мэддокса. Времени мало, а юристов на базе нет.", "o": ["Потребовать официальных слушаний и самому защищать Дейту, доказывая, что он живое разумное существо", "Принять решение судьи и уговорить Дейту подчиниться приказу ради службы", "Тайно увезти Дейту с базы на «Энтерпрайзе», пока приказ не исполнен", "Сказать Дейте, чтобы он нанял стороннего юриста, а самому не вмешиваться"], "real": 0, "fact": "Пикар попросил провести официальные слушания и взял защиту Дейты на себя. Он доказал, что по критериям самого Мэддокса Дейта разумен и осознаёт себя, а значит, не может быть вещью.", "res": "Судья Луврой сказала, что не знает, есть ли у Дейты душа, но он вправе сам это выяснять: машина ли он? Да. Собственность ли флота? Нет. Дейта отказался от опыта, Мэддокс отозвал приказ. Райкер, которому пришлось выступать против друга, потом услышал от Дейты, что без этого суд решил бы дело в пользу Мэддокса.", "src": "Сериал «Звёздный путь: Следующее поколение», сезон 2, серия 9 «The Measure of a Man»", "q": "Мудрецы смотрят одинаково на учёного, смиренного брахмана, на корову, слона, собаку и на того, кто питается собачатиной.", "qs": "Бхагавад-гита 5.18", "qv": 2, "alt": [null, "Это лишь предположение: Дейта мог бы подчиниться приказу и пройти процедуру. Тогда его память и личность, возможно, не удалось бы сохранить, а друзья на корабле остались бы с чувством, что промолчали.", "Предположение: побег превратил бы капитана и Дейту в нарушителей приказа. Вероятно, флот начал бы преследование, а сам вопрос, кто такой Дейта, остался бы нерешённым.", "Предположение: без защитника Дейта скорее всего проиграл бы слушания. Решение судьи, вероятно, осталось бы таким, как было вначале, и дело закрыли бы без обсуждения его прав."], "fut": [null, "Через годы целая армия послушных андроидов-рабочих носит имя Мэддокса, а Дейту вспоминают как «первую запчасть».", "Через годы «Энтерпрайз» ― корабль-беглец, на котором капитан объясняет всем патрулям, почему у него на борту свободный андроид.", "Через годы в учебниках Академии написано, что у машины прав нет, а Дейта ― страшилка для курсантов."], "cat": "Сериалы", "no": 116, "adult": 0, "age": 12, "vs": "верно", "trivia": "Сериал выходил с 1987 по 1994 год и дал 178 серий за семь сезонов. В седьмом сезоне он стал первым сериалом в первичной синдикации, номинированным на «Эмми» как лучший драматический сериал."}, {"id": "RD-117", "kind": "Сериал", "who": "Жан-Люк Пикар, «Звёздный путь: Следующее поколение» (Paramount, сезон 5, серия 23)", "when": "Борт звездолёта «Энтерпрайз», окраина космоса, XXIV век", "title": "Что делать с Хью", "ctx": "Ты ― капитан Пикар. Когда-то боргов, злых киборгов, которые силой превращают людей в своих рабов, ты пережил сам: они захватили тебя и сделали своим говорящим голосом. Теперь на разбитом борговском корабле найден один раненый дрон. Команда назвала его Хью, а ты держишь его на «Энтерпрайзе» отрезанным от остальных боргов.", "ctx2": "Врач Крашер лечит Хью. Ты предлагаешь вложить в его мозг программу-ловушку и отправить к своим, чтобы она вывела из строя всех боргов. Хью меняется на глазах: он учится говорить «я» и дружит с главным инженером Джорди Ла Форджем. Загадочная Гайнан, которая поначалу ненавидела боргов, просит тебя посмотреть Хью в глаза, прежде чем ты решишь его судьбу.", "o": ["Вернуть Хью боргам просто так, а о его дружбе с экипажем забыть", "Выполнить план: вложить в Хью программу-ловушку и отправить его к боргам", "Отказаться от плана и предложить Хью остаться на корабле на свободе", "Оставить Хью под замком, чтобы изучать его, и не решать, что с ним делать"], "real": 2, "fact": "Поговорив с Хью лично, Пикар отменил план: он понял, что иначе уподобился бы самим боргам. Он предложил Хью остаться на «Энтерпрайзе» и не мешал ему самому выбирать.", "res": "Хью решил вернуться к боргам, потому что понимал: иначе они придут за ним и его новыми друзьями. Борги забрали его с разбитого корабля, и перед уходом он молча кивнул Джорди.", "src": "Сериал «Звёздный путь: Следующее поколение», сезон 5, серия 23 «I, Borg»", "q": "Выше всех тот, кто одинаково относится к друзьям, недругам и равнодушным, к посредникам, ненавидящим и родным, к праведным и к грешным.", "qs": "Бхагавад-гита 6.9", "qv": 2, "alt": ["Предположение: Хью вернулся бы к боргам, не ощутив поддержки экипажа. Он, вероятно, снова растворился бы в общем разуме, и его первый проблеск «я» могли бы заглушить.", "Это лишь предположение: программа-ловушка могла бы остановить боргов, но тогда погибли бы миллионы существ, среди которых есть такие, как Хью. Врач Крашер называла такой план геноцидом.", null, "Предположение: Хью так и жил бы в заключении, как подопытный. Вряд ли это помогло бы понять боргов, зато стоило бы дружбы и доверия экипажа."], "fut": ["Через годы Хью ― самый одинокий дрон во Вселенной и почти не помнит, что у него были друзья.", "Через годы борги всей Галактики хором повторяют «Я ― Хью», а флот боится собственного оружия.", null, "Через годы Хью ― любимый экспонат лаборатории, а «Энтерпрайз» известен тем, что держит в трюме пленного киборга."], "cat": "Сериалы", "no": 117, "adult": 0, "age": 12, "vs": "верно", "trivia": "Сериал выходил с 1987 по 1994 год и дал 178 серий за семь сезонов. В седьмом сезоне он стал первым сериалом в первичной синдикации, номинированным на «Эмми» как лучший драматический сериал."}, {"id": "RD-118", "kind": "Сериал", "who": "Доктор (Четвёртый), «Доктор Кто» (BBC, сезон 12, серия 4 «Genesis of the Daleks»)", "when": "Планета Скаро, бункер учёных калидов, давно, до рождения далеков", "title": "Право уничтожить далеков", "ctx": "Ты ― Доктор, путешественник во времени и пространстве. Повелители Времени, твой народ, отправили тебя и твоих спутников Сару Джейн Смит и Гарри Салливана на Скаро, чтобы вмешаться в создание далеков, злобных роботов-убийц. Задание дали тебе три: не дать им появиться, направить их развитие к миру или уничтожить их. Сейчас Скаро разрушена войной двух народов, калидов и талов, а главный учёный калидов Даврос строит далеков.", "ctx2": "Даврос хитрый и жестокий: он пытал твоих спутников и готов погубить даже собственных людей. Ты пробираешься в камеру, где растут будущие далеки, и берёшь провода, которыми можно взорвать всё. Тебе остаётся только соединить их.", "o": ["Бросить всё и уйти, сказав, что Повелители Времени сами виноваты", "Соединить провода и уничтожить всех далеков", "Убить Давроса и забрать его чертежи", "Остановиться, спросить себя, есть ли у тебя на это право, и подождать"], "real": 3, "fact": "Доктор замер с проводами в руках и спросил, есть ли у него право уничтожать целую расу. Он рассуждал, что зло далеков может заставить другие народы объединиться против них.", "res": "Прежде чем он что-то решил, далек наехал на провода, и камеры взорвались сами. Далеки позже обратились против Давроса, а уцелевшие талы закрыли бункер. Доктор решил, что отбросил развитие далеков примерно на тысячу лет, и вернулся в ТАРДИС с помощью Кольца времени.", "src": "Сериал «Доктор Кто», сезон 12, серия 4 «Genesis of the Daleks» (6 частей, 8 марта – 12 апреля 1975)", "q": "Что делает лучший, то повторяют и остальные; какой пример он подаёт, за тем и идёт весь мир.", "qs": "Бхагавад-гита 3.21", "qv": 2, "alt": ["Предположение: если бы Доктор ушёл, далеки могли бы вырасти без помех. Вряд ли Повелители Времени, отправившие его, оценили бы такой уход.", "Это лишь предположение: если бы Доктор соединил провода, будущих далеков не стало бы. Но он потом мог бы жить с мыслью, что решил судьбу целой расы сам.", "Предположение: убив Давроса, Доктор, возможно, остановил бы одного злодея, но далеки уже были созданы. Для героя, который всегда против убийства, это стало бы тяжёлым шагом.", null], "fut": ["Через годы далеки правят галактикой, а Доктор рассказывает всем, как «просто не захотел мешать».", "Через годы вселенная без далеков так тиха, что Доктор не может поверить: кто же теперь будет главным врагом?", "Через годы Доктор в музее Скаро показывает экскурсантам чертежи Давроса, а на стене написано «куплено за одно убийство».", null], "cat": "Сериалы", "no": 118, "adult": 0, "age": 12, "vs": "исправлено", "trivia": "Первая серия вышла на BBC 23 ноября 1963 года, а в 2017 году Книга рекордов Гиннесса зафиксировала рекорд среди фантастических сериалов по числу эпизодов — 819 серий. Главного героя за годы сыграли более десяти разных актёров, и это заложено в самой идее сериала."}, {"id": "RD-119", "kind": "Сериал", "who": "Военный Доктор, «Доктор Кто» (BBC, спецвыпуск к 50-летию «The Day of the Doctor», 2013)", "when": "Планета Галлифрей, последний день Войны Времени", "title": "Последний день Галлифрея", "ctx": "Ты ― Военный Доктор, воплощение Доктора, которое устало от бесконечной войны Повелителей Времени и далеков. Война гремит уже сотни лет, гибнет всё живое. У тебя в руках Момент, древнее оружие, способное уничтожить и далеков, и Повелителей Времени, и ты решил его включить.", "ctx2": "Момент разумен, он принимает облик девушки, которую видишь только ты, и показывает тебе будущее: Повелителей Времени нет, но Доктор выживает. Через временной разлом к тебе приходят другие воплощения Доктора, Десятое и Одиннадцатое, и вместе с Кларой Освальд спрашивают, нет ли другого пути. До решения остаётся мало времени.", "o": ["Отказаться от Момента и сдаться далекам", "Бежать из Войны Времени в ТАРДИС и больше никогда не возвращаться", "Найти другой выход: спрятать Галлифрей, а не уничтожать, вместе с другими Докторами", "Включить Момент и уничтожить обе стороны, как задумано"], "real": 2, "fact": "Три Доктора и ещё десять воплощений, которые пришли на помощь, использовали технику замораживания времени и спрятали
