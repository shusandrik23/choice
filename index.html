т уклончивостью. Критики говорят, что ты боишься, а сторонники войны не слышат.", null, "Частное интервью остаётся частным. Через неделю о нём никто не помнит, а позиция остаётся без последствий.", "Ты молчишь о войне и сосредоточиваешься на гражданских правах. Президент Джонсон улыбается, а бедные общины продолжают отдавать сыновей на войну."], "fut": ["Ты высказываешься осторожно. К 1968 критики называют тебя трусом, а сторонники войны не слышат. К 1970 «мечта» остаётся только мечтой.", null, "Ты даёшь частное интервью. К 1967 о нём никто не помнит. К 1990 ты в учебниках как человек, который не сказал главного.", "Ты молчишь о войне. К 1968 Джонсон подписывает новые законы, а бедные общины продолжают отдавать сыновей. К 1975 ты живой, но твоё имя в учебниках короче на одну речь."], "cat": "Совесть и мужество", "no": 62, "ctx2": "4 апреля 1967 года тебе предстоит выступить в церкви Риверсайд в Нью-Йорке. Ты знаешь, что войну финансируют деньги, которые могли бы пойти на борьбу с бедностью.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "S", "R", "T"], "gw": ["Расчёт на политическую выгоду, осторожность ради союзников.", "Говорит правду, рискуя поддержкой, из сострадания.", "Двойная игра, защита влияния и репутации.", "Молчание из страха, равнодушие к истине."]}, {"id": "RD-063", "kind": "Жизнь", "who": "Александр Пушкин, поэт", "when": "27 января (8 февраля) 1837", "title": "Дуэль", "ctx": "Тебе пришли анонимные письма с оскорблениями в адрес жены. Ты считаешь, что за ними стоит круг Дантеса и барона Геккерна. Друзья уговаривают не доводить дело до дуэли. Дуэли запрещены и грозят наказанием, но ты уверен, что задета твоя честь.", "o": ["Обратиться к царю с жалобой.", "Уехать с женой в деревню.", "Проигнорировать письма и сохранить репутацию.", "Настоять на дуэли с Дантесом."], "real": 3, "fact": "Пушкин отправил Геккерну оскорбительное письмо, и дуэль состоялась 27 января на Чёрной речке.", "res": "Пушкин был смертельно ранен и умер через два дня. Дантеса осудили и выслали из России. Историки до сих пор спорят о мотивах и обстоятельствах.", "src": "Документы о дуэли, исторические обзоры", "q": "Люди будут вечно говорить о твоём бесчестье, а для человека, которого уважают, позор хуже смерти.", "qs": "Бхагавад-гита 2.34", "qv": 2, "alt": ["Жалоба царю возвращает тебя в положение камер-юнкера. Дело замнут, а твоё достоинство окажется в чужих руках.", "Отъезд в деревню откладывает развязку. Письма находят тебя и там, а в Петербург возвращаться всё равно придётся.", "Ты игнорируешь письма. Слухи не затихают, и свет продолжает шептаться. Жив, но с репутацией, о которой лучше не вспоминать.", null], "fut": ["Ты жалуешься царю. К 1837 дело замято, а ты получаешь звание камер-юнкера второй степени. К 1850 «Онегин» остаётся недописанным.", "Ты уезжаешь в деревню. К 1838 письма находят тебя и там. К 1840 «Капитанская дочка» пишется без Петербурга, но с тем же укором.", "Ты игнорируешь письма. К 1840 слухи затихают, но не исчезают. К 1860 в Петербурге рассказывают, как Пушкин «струсил», и этот анекдот кочует по учебникам.", null], "cat": "Искусство и слово", "no": 63, "ctx2": "Твоя жена Наталья Гончарова красива и популярна. 4 ноября 1836 года ты получил анонимные «дипломы рогоносца». Первый вызов Дантесу ты отозвал, когда тот объявил о женитьбе на сестре Натальи. В январе 1837 года ты послал оскорбительное письмо барону Геккерну. Тебе тридцать семь.", "adult": 0, "vs": "спорно", "age": 12}, {"id": "RD-064", "kind": "Жизнь", "who": "Лоуренс Отс, капитан, участник экспедиции Скотта", "when": "март 1912", "title": "Выйти из палатки", "ctx": "Ты возвращаешься с Южного полюса. Ты ослабел, обморожены ноги, ты замедляешь отряд. Всем не хватает еды и тепла, до склада ещё далеко. Если останешься, группа потеряет время, и все могут погибнуть.", "o": ["Пойти вперёд за помощью в одиночку.", "Остаться в палатке и идти дальше с остальными.", "Выйти в метель, чтобы не быть обузой.", "Попросить остаться и ждать смерти."], "real": 2, "fact": "По записям Скотта, Отс сказал: «Я просто выйду наружу и, возможно, задержусь», и ушёл в метель.", "res": "Тело не нашли. Остальные погибли примерно через две недели, в 11 милях от склада. Историки спорят, помогло ли это решение отряду. Это исторический случай самопожертвования в безвыходных условиях, а не пример для подражания.", "src": "Дневник Роберта Скотта", "q": "Для рождённого смерть неизбежна, для умершего неизбежно новое рождение. Поэтому о том, чего не миновать, тебе не стоит скорбеть.", "qs": "Бхагавад-гита 2.27", "qv": 2, "alt": ["Ты идёшь за помощью в одиночку. Метель стирает следы, а склад остаётся далёким и безответным.", "Ты идёшь дальше с остальными. Темп отряда падает ещё ниже, и до склада, возможно, не дойдёт никто.", null, "Ты просишь остаться и ждать смерти. Отряд теряет день, а совесть не даёт покоя ни тебе, ни им."], "fut": ["Ты идёшь один. К 1912 метель стирает следы. К 1950 в мемориале ты значишься «пропавшим без вести», а рядом с твоим именем пустая клетка.", "Ты идёшь дальше с остальными. К 1912 темп падает, а в Лондоне получают пять одинаковых телеграмм вместо четырёх. К 1950 в мемориале у полюса пять имён, и среди них твоё.", null, "Ты просишь остаться и ждать. К 1912 отряд теряет сутки, которых у него нет. К 1913 в Лондоне читают дневник, где ты только строчка."], "cat": "Риск и путь", "no": 64, "ctx2": "Ты участник экспедиции Скотта «Терра Нова». Вы дошли до полюса 17 января 1912 года и увидели, что Амундсен был там раньше. На обратном пути умер Эдгар Эванс. 17 марта у тебя тридцать второй день рождения.", "adult": 0, "vs": "спорно", "age": 12, "g": ["R", "T", "S", "T"], "gw": ["Индивидуальный героизм, самолюбие и нежелание зависеть.", "Самообман, из слабости продолжает тянуть.", "Самопожертвование ради спасения товарищей.", "Покорность судьбе и бездействие, отчаяние."]}, {"id": "RD-065", "kind": "Жизнь", "who": "Рауль Валленберг, шведский дипломат", "when": "июнь 1944", "title": "Миссия в Будапешт", "ctx": "Ты бизнесмен из Швеции. Тебе предлагают отправиться в Будапешт: там идёт депортация венгерских евреев, а Швеция по просьбе американцев ищет человека для спасательной миссии. Ты не дипломат по опыту и знаешь, что тебя там ждёт опасность.", "o": ["Согласиться, но только консультировать издалека.", "Принять с условием, что тебе обеспечат охрану.", "Принять миссию и ехать в Будапешт.", "Отказаться: ты не профессиональный дипломат."], "real": 2, "fact": "Валленберг согласился и в июле 1944 прибыл в Будапешт, где выдавал защитные паспорта и размещал людей в «шведских» домах.", "res": "Он спас тысячи людей. В январе 1945 его задержали советские войска, и дальнейшая судьба неизвестна. Версии СССР и России о его смерти оспариваются.", "src": "Документы шведской миссии, исторические обзоры", "q": "Дар, который отдают просто потому, что давать нужно, ничего не ожидая взамен, в подходящее время и в подходящем месте человеку достойному, называют чистым.", "qs": "Бхагавад-гита 17.20", "qv": 2, "alt": ["Ты консультируешь издалека. Письма идут неделями, а в Будапеште решения нужны за часы.", "Ты требуешь охрану, и дело задерживается. Защитные паспорта выходят позже, а люди продолжают ждать.", null, "Ты отказываешься. Другой человек, возможно более опытный, занимается спасением. Но он приезжает позже, и часть списков уже подписана в Берлине."], "fut": ["Ты консультируешь издалека. К осени письма идут неделями. К 1945 в Будапеште никто не помнит имени шведского советника.", "Ты требуешь охрану. К лету защитные паспорта выходят позже. К 1945 их получают на сорок тысяч человек меньше.", null, "Ты отказываешься. К 1945 другой человек, возможно, более опытный, приезжает позже. К 1947 списки на четыре тысячи имён оказываются подписаны без тебя."], "cat": "Совесть и мужество", "no": 65, "ctx2": "Венгрия оккупирована Германией с марта 1944 года. Эйхман отправляет в Освенцим сотни тысяч венгерских евреев. Тебе тридцать один год, ты бизнесмен, и Американский Совет по делам военных беженцев ищет человека для миссии в Будапеште.", "adult": 0, "vs": "спорно", "age": 12, "g": ["T", "R", "S", "T"], "gw": ["Пассивное участие, уклонение от риска.", "Условия безопасности для себя, расчёт выгоды.", "Самоотверженный долг: ради чужих жизней, рискуя собой.", "Бегство от долга под предлогом непригодности."]}, {"id": "RD-066", "kind": "Жизнь", "who": "Алексей Ананенко и двое его коллег, инженеры Чернобыльской АЭС", "when": "май 1986", "title": "Открыть задвижки", "ctx": "После аварии в подвале под реактором скопилась вода. Если расплавленное топливо дойдёт до воды, возможен новый взрыв. Нужно кому-то войти в залитый радиоактивный коридор и открыть задвижки. Защита почти нулевая.", "o": ["Отказаться: риск смерти слишком велик.", "Вызваться и идти в воду.", "Предложить приказать это военным.", "Предложить дождаться, пока вода уйдёт сама."], "real": 1, "fact": "Трое инженеров вызвались и вошли в подвал с фонарями и в костюмах. Они открыли задвижки.", "res": "Вода была откачана. Долгое время считалось, что все трое погибли, но позднее выяснилось, что они пережили это задание: по публикациям, Баранов умер в 2005 году, а Ананенко и Беспалов остались живы. Точные подробности и полученные дозы до сих пор обсуждаются.", "src": "Публикации о Чернобыле, свидетельства", "q": "Мудрецом с твёрдым умом называют того, кто не падает духом в несчастье, не жаждет радостей и свободен от страсти, страха и гнева.", "qs": "Бхагавад-гита 2.56", "qv": 2, "alt": ["Ты отказываешься. Другие добровольцы находятся не сразу, и вода остаётся над расплавленным топливом. Взрыв, возможно, становится реальностью, и Европа теряет больше земель.", null, "Приказ военным исполняется с задержкой. Солдаты не знают коридоров станции и ищут задвижки вслепую.", "Ожидание, пока вода уйдёт сама, откладывает решение. Топливо продолжает опускаться, а времени остаётся всё меньше."], "fut": ["Ты отказываешься. К 1986 вода остаётся над топливом. К лету 1990 зона закрыта на 500 лет, а в учебниках Чернобыль называют «Чернобыльской катастрофой номер два».", null, "Приказ военным исполняется с задержкой. К осени 1986 солдаты ищут задвижки вслепую. К 1990 в зоне не осталось ни одной деревни.", "Ты ждёшь. К 1986 топливо опускается. К 2000 на месте станции кратер, который нельзя закрыть."], "cat": "Совесть и мужество", "no": 66, "ctx2": "26 апреля 1986 года взорвался четвёртый реактор. Под ним бассейн-барботёр, куда стекает вода. Нужно открыть задвижки в затопленном коридоре, а дозиметры там зашкаливают. Это Алексей Ананенко, Валерий Беспалов и Борис Баранов.", "adult": 0, "vs": "спорно", "age": 12, "g": ["T", "S", "T", "T"], "gw": ["Страх, бегство от долга.", "Самоотверженный долг ради миллионов людей.", "Перекладывание ответственности на других.", "Бездействие и самообман перед угрозой."]}, {"id": "RD-067", "kind": "Жизнь", "who": "Леонид, царь Спарты", "when": "август 480 до н. э.", "title": "Фермопилы", "ctx": "Ты держишь узкий проход против огромной персидской армии. Тебе сообщают, что враг обходит по горной тропе и вот-вот окружит. Союзники волнуются и хотят отступить. У тебя есть выбор: уйти со всеми или остаться прикрывать.", "o": ["Ударить по врагу и прорваться.", "Сдаться персам и сохранить воинов.", "Отпустить союзников и остаться с небольшим отрядом.", "Отступить вместе со всеми и сохранить армию."], "real": 2, "fact": "По Геродоту, Леонид отпустил большую часть союзников и остался с тремястами спартанцами и греками из Феспий и Фив.", "res": "Отряд был уничтожен, Леонид погиб. Задержка дала грекам время для обороны: вскоре флот одержал победу при Саламине.", "src": "Геродот, «История», книга VII", "q": "Считай одинаковыми радость и боль, выгоду и убыток, победу и поражение — и вступай в бой. Так ты не возьмёшь на себя вины.", "qs": "Бхагавад-гита 2.38", "qv": 2, "alt": ["Ты идёшь на прорыв. Персидская конница не даёт развернуться, и отряд погибает без пользы.", "Ты сдаёшься персам и сохраняешь жизни воинов. Греция теряет свободу, а Спарта остаётся рассказом в чужой книге.", null, "Ты отступаешь со всеми и сохраняешь армию. Греки не получают выигранного времени, а Афины падают раньше, чем флот готов к бою."], "fut": ["Ты идёшь на прорыв. К 480 до н. э. отряд погибает в первой же атаке. К 479 до н. э. о нём никто не пишет.", "Ты сдаёшься персам. К 470 до н. э. Греция платит дань. К 300 до н. э. Спарта — рассказ в чужой книге.", null, "Ты отступаешь со всеми. К 480 до н. э. Афины падают раньше, чем готов флот. К 400 до н. э. вся Эллада говорит по-персидски, а слово «демократия» остаётся на древнем камне."], "cat": "Власть и война", "no": 67, "ctx2": "480 год до н. э. Армия Ксеркса стоит у Фермопил, у греков около семи тысяч человек. Предатель Эфиальт показал персам горную тропу. Оракул в Дельфах предсказал, что либо падёт Спарта, либо погибнет царь. С тобой триста спартанцев и семьсот феспийцев.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "T", "S", "T"], "gw": ["Гордыня и желание геройской славы, безрассудная атака.", "Отказ от чести и борьбы, малодушие.", "Самоотверженный долг, прикрывая отход других.", "Бегство и слабость, избегание ответственности."]}, {"id": "RD-068", "kind": "Жизнь", "who": "Игнац Земмельвайс, врач", "when": "1847", "title": "Помойте руки", "ctx": "Ты врач в венской больнице. В отделении, где работают врачи, умирает от родильной горячки каждая десятая роженица, а у акушерок гораздо меньше. Друг заразился после вскрытия и умер. Ты подозреваешь, что врачи переносят заразу руками.", "o": ["Перейти работать в отделение акушерок.", "Описать наблюдение и ждать, пока коллеги заинтересуются.", "Ввести обязательное мытьё рук хлорной известью.", "Сменить больницу и страну."], "real": 2, "fact": "Земмельвайс потребовал, чтобы все студенты и врачи перед осмотром мыли руки раствором хлорной извести.", "res": "Смертность в отделении резко упала, но коллеги отвергли идею, ведь она обвиняла врачей. Его уволили, а в 1865 он умер в психиатрической клинике. Признание пришло уже после смерти, с работами Пастера и Листера.", "src": "Историко-медицинские обзоры", "q": "Делай то, что должно делать: действие лучше бездействия. Если ничего не делать, не удастся даже поддерживать жизнь тела.", "qs": "Бхагавад-гита 3.8", "qv": 2, "alt": ["Ты переходишь в отделение акушерок. Там ты безопасен, но врачи мыть руки не начнут, и смертность в твоём прежнем отделении остаётся прежней.", "Ты описываешь наблюдение и ждёшь. Заинтересованных нет, и женщины продолжают умирать. Через десять лет Пастер и Листер приходят к тем же выводам.", null, "Ты меняешь больницу и страну. Новая клиника принимает тебя без восторга, а идея остаётся эксцентричной выходкой."], "fut": ["Ты переходишь к акушеркам. К 1855 врачи не моют руки, смертность прежняя. К 1880 в Вене открывают памятник тому, кто никогда не говорил об этом.", "Ты описываешь наблюдение и ждёшь. К 1860 Пастер и Листер приходят к тем же выводам. К 1900 в больницах моют руки, но имя Земмельвайса стоит в сноске.", null, "Ты меняешь больницу. К 1860 идея остаётся эксцентричной выходкой. К 1900 забытый врач появляется в учебнике одним абзацем."], "cat": "Наука", "no": 68, "ctx2": "Ты помощник в Первой акушерской клинике Вены, тебе двадцать восемь. Смертность там около десяти процентов, у акушерок в соседней клинике гораздо ниже. В марте 1847 умер твой друг Якоб Колетшка от раны при вскрытии. Начальник клиники Клейн не любит новшеств.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "T", "S", "T"], "gw": ["Бегство от проблемы, равнодушие к жертвам.", "Пассивное ожидание, избегание действия и борьбы.", "Действие во благо пациентов, несмотря на сопротивление.", "Бегство от ответственности и конфликта."]}, {"id": "RD-069", "kind": "Жизнь", "who": "Мать Тереза, монахиня", "when": "1946–1948", "title": "Призыв внутри призыва", "ctx": "Ты преподаёшь в монастырской школе в Калькутте и живёшь в безопасности. Но видишь вокруг умирающих на улицах. Ты чувствуешь, что должна уйти из монастыря и жить среди бедняков, но церковные власти не в восторге, а у тебя нет денег.", "o": ["Просить разрешения покинуть монастырь и работать среди бедных.", "Остаться в школе и помогать бедным в свободное время.", "Основать школу для бедных при монастыре.", "Уйти самовольно и жить на улице."], "real": 0, "fact": "Тереза попросила разрешения у церковных властей. В 1948 она получила его и стала работать среди бедняков, позже основав орден Миссионеров милосердия.", "res": "Организация выросла в мировую сеть. Позднее работу ордена критиковали за условия в приютах и за использование средств, а ей присудили Нобелевскую премию мира 1979.", "src": "Биографии, документы ордена", "q": "Совершенным йогином, Арджуна, я считаю того, кто по себе судит обо всех: в радости и в беде он видит другого равным себе.", "qs": "Бхагавад-гита 6.32", "qv": 2, "alt": [null, "Ты остаёшься в школе и помогаешь бедным в свободное время. Благое дело, но слишком скромное, чтобы стать движением.", "Школа для бедных при монастыре остаётся чистой, но закрытой. Те, кто умирает за воротами, не попадают в её списки.", "Ты уходишь самовольно и живёшь на улице. Церковь отказывает в поддержке, а болезнь и голод оказываются сильнее."], "fut": [null, "Ты остаёшься в школе. К 1960 ты уважаемая директор, а в Калькутте всё так же умирают на улицах. К 2026 имя Терезы известно только историкам Лорето.", "Школа остаётся закрытой. К 1950 те, кто умирает за воротами, не попадают в её списки. К 1980 в Калькутте появляется другая Тереза, но без монастыря.", "Ты уходишь самовольно. К 1950 церковь отказывает в поддержке. К 1955 ты умираешь от малярии в трущобах, а в Индии нет ордена Миссионеров милосердия."], "cat": "Совесть и мужество", "no": 69, "ctx2": "Голод 1943 года и беспорядки 1946 года показали тебе город. 10 сентября 1946 года в поезде ты почувствовала «призыв внутри призыва». Архиепископ Перье осторожен, а Рим не торопится.", "adult": 0, "vs": "спорно", "age": 12, "g": ["S", "T", "R", "R"], "gw": ["Долг призвания, смиренное послушание, служение без выгоды", "Выбирает безопасность и компромисс, избегает риска", "Желание построить своё дело и контролировать результат", "Импульсивное своеволие ради желаемого"]}, {"id": "RD-070", "kind": "Жизнь", "who": "Хироо Онода, лейтенант японской армии", "when": "март 1974", "title": "Конец одной войны", "ctx": "Ты тридцать лет прячешься на филиппинском острове Лубанг, потому что был приказ не сдаваться. Тебе бросали листовки, привозили родных и новости, но ты считал это уловкой врага. Теперь молодой путешественник нашёл тебя и сказал, что война давно закончилась.", "o": ["Сдаться только по приказу своего прежнего командира.", "Поверить и сдаться, не требуя подтверждений.", "Убить путешественника, считая его шпионом.", "Скрыться глубже в джунглях."], "real": 0, "fact": "Онода отказался сдаваться без приказа командира. За ним прилетел майор Танигути и зачитал приказ о прекращении боевых действий. Онода сложил оружие.", "res": "Президент Филиппин Маркос помиловал его. В годы скрытности он, по утверждениям филиппинских СМИ, участвовал в перестрелках, при которых погибли до тридцати человек.", "src": "Воспоминания Оноды, публикации", "q": "Невежда, лишённый веры и полный сомнений, погибает: сомневающемуся нет ни этого мира, ни иного, ни счастья.", "qs": "Бхагавад-гита 4.40", "qv": 2, "alt": [null, "Ты веришь путешественнику и сдаёшься сразу. Но в штабе тебя ждёт допрос, а пожилой командир, приказавший не сдаваться, вспоминает тебя не сразу.", "Ты стреляешь в путешественника как в шпиона. Последний «солдат императора» становится убийцей, а возвращение превращается в суд.", "Ты уходишь глубже в джунгли. Ещё десять лет война продолжается только для тебя, а остров начинает считать тебя частью пейзажа."], "fut": [null, "Ты сдаёшься сразу. К 1975 в штабе тебя допрашивают, а в газетах пишут «Последний солдат». К 1980 ты забыт, а Лубанг — курорт.", "Ты стреляешь в путешественника. К 1974 тебя судят как убийцу. К 1980 слово «Онода» — синоним фанатика.", "Ты уходишь глубже в джунгли. К 1985 война всё ещё идёт, но только для тебя. К 2000 остров называют «Островом, где время остановилось»."], "cat": "Риск и путь", "no": 70, "ctx2": "Ты офицер разведки японской армии, с 1944 года на острове Лубанг. Майор Танигути приказал не сдаваться и воевать. Остальные из твоей группы сдались или погибли, последний, Кодзука, убит в 1972 году. Молодой японец Норио Судзуки нашёл тебя в 1974 году. Тебе пятьдесят один.", "adult": 1, "vs": "спорно", "age": 18}, {"id": "RD-071", "kind": "Книга", "who": "Гамлет, «Гамлет» (Уильям Шекспир, ок. 1600)", "when": "Эльсинор", "title": "Король на молитве", "ctx": "Ты Гамлет, принц Датский, задумчивый и образованный молодой человек, живёшь в королевском замке Эльсинор. Твой отец-король умер, а его брат Клавдий стал королём и женился на твоей матери Гертруде. Призрак отца сказал тебе, что Клавдий его отравил, и потребовал мести. Чтобы проверить правду, ты поставил при дворе пьесу об убийстве, и король вздрогнул, так что теперь ты почти уверен.", "o": ["Сказать матери и отдать дело в руки двора.", "Заставить его признаться публично.", "Не убивать и ждать момента, когда он согрешит.", "Убить Клавдия сейчас."], "real": 2, "fact": "Гамлет решает отложить удар: убить Клавдия в молитве значило бы отправить его в рай.", "res": "Следом Гамлет по ошибке убивает Полония, Офелия сходит с ума, Лаэрт мстит. В финале гибнут почти все, включая Гамлета. Гамлет успевает убить Клавдия и умирает последним из главных героев.", "src": "У. Шекспир, «Гамлет», акт III, сцена 3", "q": "Могучий Арджуна, ум беспокоен, и его трудно обуздать, это верно. Но его можно подчинить упражнением и бесстрастием.", "qs": "Бхагавад-гита 6.35", "qv": 2, "alt": ["Ты говоришь матери и передаёшь дело двору. Королева не верит, а двор видит в тебе несчастного юношу, а не мстителя.", "Ты заставляешь Клавдия признаться публично, но двор верит ему больше. Тебя объявляют безумцем и отправляют в Англию без шанса вернуться.", null, "Ты убиваешь Клавдия в молитве. Дания получает короля-убийцу, а ты остаёшься с мыслью, что отомстил и не узнал всей правды."], "fut": ["Ты рассказываешь матери. К 1602 королева не верит. К 1610 двор видит в тебе несчастного юношу, а Офелия продолжает петь.", "Ты вынуждаешь Клавдия признаться. Двор верит ему больше. К 1603 тебя отправляют в Англию. К 1620 в Лондоне ставят пьесу «Принц, которого не слышали».", null, "Ты убиваешь Клавдия. К 1602 Дания получает короля-убийцу. К 1650 Эльсинор — замок, где всегда слышны шаги Призрака, а в учебниках Гамлет — мститель без размышлений."], "cat": "Литература", "no": 71, "ctx2": "Ты входишь в покои и видишь Клавдия одного, на коленях: он молится, охраны рядом нет, а у тебя меч. По твоей вере, если убить человека сразу после покаяния, его душа отправится на небо. Ты хочешь не просто смерти Клавдия, а расплаты за убийство отца.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["S", "R", "R", "R"], "gw": ["Законный путь, правда без личной мести", "Хочет публичного триумфа и контроля над исходом", "Мстительная расчётливость, желание наказать вечно", "Импульсивная месть ради желаемого"], "swap": {"role": "Клавдий, король Дании", "title": "Молитва короля", "ctx": "Ты Клавдий, король Дании, убийца собственного брата. Корону и королеву Гертруду, вдову брата, ты получил ценой этого убийства. Сейчас ты один и пытаешься помолиться о прощении. Ты понимаешь, что настоящее покаяние потребует отказаться от того, ради чего ты убивал: от короны, власти и королевы.", "o": ["Отказаться от короны и от Гертруды и покаяться до конца.", "Признаться во всём перед двором и просить суда.", "Бросить молитву: толку от неё всё равно нет.", "Встать на колени и молиться, но корону и королеву не отдавать."], "real": 3, "fact": "Ты встал на колени и пытался молиться, но не смог отказаться ни от короны, ни от королевы. Ты признал, что слова твои летят вверх, а мысли остаются внизу, а такие слова до неба не доходят.", "res": "В комнату вошёл принц Гамлет и увидел тебя на коленях. Он решил не бить: убить человека во время молитвы значило бы отправить его в рай. Ты остался жив, а в финале пьесы Гамлет всё же убивает тебя.", "src": "У. Шекспир, «Гамлет», акт 3, сцена 3: shakespeare.mit.edu/Tragedy/hamlet/hamlet.3.3.html"}}, {"id": "RD-072", "kind": "Книга", "who": "Эдип, «Царь Эдип» (Софокл, ок. 429 до н. э.)", "when": "Фивы", "title": "Дознание", "ctx": "Ты Эдип, царь Фив, умный и гордый правитель, который когда-то разгадал загадку Сфинкса и спас город. Теперь в Фивах чума, и оракул бога Аполлона велел: болезнь отступит, когда найдут убийцу прежнего царя Лая. Ты взялся за поиски, но слепой прорицатель Тиресий не хочет говорить, а потом прямо называет убийцей тебя, и твоя жена Иокаста, вдова Лая, просит тебя остановиться. Тебе надо решить, оборвать ли расследование или довести его до конца, даже если оно коснётся тебя самого.", "o": ["Перепоручить дело Креонту.", "Остановить расследование и закрыть дело.", "Продолжить расследование до конца.", "Объявить виновным прорицателя и изгнать его."], "real": 2, "fact": "Эдип продолжает расследование, несмотря на предостережения.", "res": "Он узнаёт, что убийца он сам, а жена Иокаста его мать. Иокаста кончает с собой, Эдип ослепляет себя и просит изгнать его, а Креонт соглашается лишь после воли бога.", "src": "Софокл, «Царь Эдип»", "q": "Нет в мире ничего столь очищающего, как знание. Тот, кто стал совершенным в йоге, со временем находит его в самом себе.", "qs": "Бхагавад-гита 4.38", "qv": 2, "alt": ["Дело переходит к Креонту. Он разбирается быстро и без жалости, а Эдип теряет возможность узнать правду сам.", "Ты прекращаешь расследование. Чума продолжается, Фивы вымирают, а ты правишь городом, зная, что скрываешь причину.", null, "Ты изгоняешь прорицателя. Народ видит тирана, чума не отступает, а правда всплывает позже, но через бунт."], "fut": ["Дело переходит к Креонту. К 425 до н. э. он находит убийцу за три дня. К 420 до н. э. Фивами правит Креонт, а ты в изгнании без слепоты.", "Ты прекращаешь расследование. К 425 до н. э. Фивы вымирают. К 400 до н. э. ты правишь пустым городом, а Софокл пишет трагедию о том, кто не захотел знать.", null, "Ты изгоняешь прорицателя. К 425 до н. э. в городе бунт. К 420 до н. э. правда всплывает через кровь, а имя Эдипа — синоним тирана."], "cat": "Литература", "no": 72, "ctx2": "Слова оракула привёз из Дельф Креонт, брат Иокасты. Лай был убит на дороге много лет назад, и в живых остался лишь один свидетель, пастух. Иокаста уверяет, что оракулам верить нельзя.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["T", "T", "S", "R"], "gw": ["Бегство от ответственности, перекладывание дела", "Самообман, нежелание видеть правду", "Правда и долг правителя, несмотря на цену", "Гордыня, защита власти, подавление обвинителя"]}, {"id": "RD-073", "kind": "Книга", "who": "Царь Соломон, Третья книга Царств", "when": "Иерусалим", "title": "Спор двух матерей", "ctx": "Ты Соломон, царь Израиля, правишь в Иерусалиме, и последнее слово в судах за тобой. К тебе пришли две женщины, жившие в одном доме. Обе недавно родили сыновей, один младенец умер, а другой жив, и каждая клянётся, что живой ребёнок её. Ни свидетелей, ни доказательств нет, а от твоего решения зависит, у кого останется ребёнок.", "o": ["Приказать разрубить ребёнка надвое и посмотреть на реакцию.", "Отдать ребёнка той, кто богаче и сможет его обеспечить.", "Отложить дело и расспросить соседей.", "Бросить жребий."], "real": 0, "fact": "Соломон приказал принести меч и разделить ребёнка. Одна женщина согласилась, другая попросила отдать ребёнка сопернице, лишь бы он жил.", "res": "Соломон отдал ребёнка второй женщине, как настоящей матери. Весть о суде распространилась, и царя стали уважать за мудрость.", "src": "3 Цар. 3:16–28", "q": "Выше всех тот, кто одинаково относится к друзьям, недругам и равнодушным, к посредникам, ненавидящим и родным, к праведным и к грешным.", "qs": "Бхагавад-гита 6.9", "qv": 2, "alt": [null, "Ты отдаёшь ребёнка богатой. Закон соблюдён по формальным признакам, а настоящая мать теряет сына навсегда.", "Расспросы соседей тянутся неделями. Ребёнок растёт между двумя женщинами, а ни одна не знает, надолго ли он у неё.", "Жребий решает судьбу ребёнка. Справедливость превращается в лотерею, а народ видит царя, который не умеет думать."], "fut": [null, "Ты отдаёшь ребёнка богатой. К 930 до н. э. он вырастает в чужом доме и никогда не узнаёт, что его мать пришла к царю. К 900 до н. э. Соломон известен как царь, который решает по кошельку.", "Расспросы тянутся неделями. К 930 до н. э. ребёнок живёт между двумя домами, а две женщины называют его по-разному.", "Жребий решает судьбу ребёнка. К 925 до н. э. народ видит в тебе игрока, а мудрость царя — анекдот."], "cat": "Литература", "no": 73, "ctx2": "Женщины родили с разницей в три дня. Одна говорит, что вторая ночью нечаянно придавила своего сына во сне, подложила ей мёртвого, а живого забрала себе. Вторая всё отрицает.", "adult": 0, "vs": "верно", "age": 12, "g": ["S", "R", "S", "T"], "gw": ["Мудрая ясность, сострадание и поиск истины", "Выгода и богатство как критерий", "Добросовестное выяснение истины, без поспешности", "Отказ от ответственности, слепой случай"], "swap": {"role": "Мать живого младенца", "title": "Ребёнок и меч", "ctx": "Ты женщина из Иерусалима, которая пришла со своей бедой к царю Соломону. Вы с соседкой жили в одном доме и родили с разницей в три дня. Ночью сын соседки умер, а утром ты увидела рядом с собой мёртвого ребёнка, не своего: ты говоришь, что соседка подменила младенцев. Она всё отрицает, вы обе называете живого малыша своим, и тогда царь приказывает принести меч и разделить живого ребёнка пополам, по половине каждой.", "o": ["Согласиться на раздел: пусть не достанется ни одной из вас.", "Промолчать и ждать, что царь передумает.", "Сказать царю: отдай ей живого ребёнка, только не убивай его.", "Вцепиться в малыша и кричать, что он твой, а соседка лжёт."], "real": 2, "fact": "В тебе заговорила жалость к сыну, и ты сказала царю: отдай ей живого младенца, только не убивай. Соседка в ответ сказала, чтобы ребёнка делили.", "res": "Соломон решил, что настоящая мать ты, и повелел отдать тебе живого младенца. Весь Израиль узнал об этом приговоре и стал бояться царя: люди увидели, что в нём есть божья мудрость для справедливого суда.", "src": "Библия, Третья книга Царств 3:16–28 (в западной нумерации 1 Kings 3): christianity.com/bible/kjv/1-kings/3-16-28"}}, {"id": "RD-074", "kind": "Книга", "who": "Жавер, «Отверженные» (Виктор Гюго, 1862)", "when": "Париж, 1832", "title": "Закон или милосердие", "ctx": "Июнь 1832 года, Париж, восстание против короля, на улицах баррикады. Ты Жавер, полицейский инспектор, всю жизнь живущий по закону и убеждённый, что закон не может ошибаться. Много лет ты охотишься на Жана Вальжана, бывшего каторжника, бежавшего из-под надзора. На баррикаде повстанцы поймали тебя как шпиона и приговорили к расстрелу, но Вальжан, которому поручили казнь, тебя отпустил.", "o": ["Отпустить его, но потом продолжить поиски.", "Арестовать Вальжана, как предписывает закон.", "Отпустить Вальжана и отказаться от дальнейшего преследования.", "Передать дело вышестоящим и не принимать решения."], "real": 2, "fact": "Жавер отпустил Вальжана и не стал его арестовывать.", "res": "Жавер не мог примирить это с своими принципами и бросился в Сену. Гюго показывает, как выбор милосердия может разрушить человека, жившего только буквой закона.", "src": "«Отверженные», часть V, книга 4", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Ты отпускаешь Вальжана, а потом продолжаешь поиски. Милосердие превращается в игру кошки с мышкой, и ты презираешь себя.", "Ты арестовываешь Вальжана. Закон торжествует, а раненый Мариус остаётся без помощи, и Козетта теряет жениха.", null, "Ты передаёшь дело вышестоящим. Они не понимают случившегося, а ты оказываешься сторонним наблюдателем собственной судьбы."], "fut": ["Ты отпускаешь Вальжана и продолжаешь поиски. К 1834 милосердие становится игрой. К 1850 ты ловишь его на пороге смерти и не можешь решиться.", "Ты арестовываешь Вальжана. К 1833 Мариус без помощи, Козетта теряет жениха. К 1860 Жавер — образцовый полицейский, которого никто не любит.", null, "Ты передаёшь дело вышестоящим. К 1833 они не понимают случившегося. К 1840 ты наблюдатель собственной судьбы."], "cat": "Литература", "no": 74, "ctx2": "Теперь ты ждёшь у выхода из парижской канализации, куда Вальжан вынес на себе раненого молодого повстанца Мариуса. Он просит позволить ему отвезти Мариуса домой, к деду, а потом обещает идти с тобой куда скажешь. Закон требует арестовать его прямо сейчас.", "adult": 1, "vs": "верно", "age": 18, "g": ["R", "T", "S", "T"], "gw": ["Самолюбие, расчёт, держится за контроль и охоту", "Слепое подчинение букве закона", "Признание правды и милосердия, отказ от ложной опоры", "Бегство от решения и ответственности"], "swap": {"role": "Жан Вальжан, бывший каторжник", "title": "Пленник на баррикаде", "ctx": "Ты Жан Вальжан, бывший каторжник, который много лет живёт под чужим именем. Париж, июнь 1832 года, восстание: ты на баррикаде вместе с повстанцами. Они схватили и связали Жавера, полицейского инспектора, который годами тебя преследует. Повстанцы решили, что его надо убить, пока не подоспела помощь, и ты сам вызвался это сделать: тебе отдают пленника.", "o": ["Убить Жавера, как решили повстанцы.", "Отпустить Жавера, а повстанцам сказать, что он убит.", "Вернуть пленника повстанцам: пусть решают они.", "Увести его и держать под замком до конца боя."], "real": 1, "fact": "В пустом переулке за баррикадой ты перерезал верёвки Жавера и сказал, что он свободен. Ты даже назвал свой адрес, потом выстрелил в воздух и вернулся к повстанцам со словами: «Дело сделано».", "res": "Жавер повторил твой адрес и ушёл, сказав, что лучше бы ты его убил, и больше не говорил тебе «ты». Он остался твоим врагом и намеревался арестовать тебя, если ты переживёшь бой. Позже сам Жавер отпустил тебя, хотя мог арестовать.", "src": "В. Гюго, «Отверженные» (1862), ч. 5, кн. 1, гл. 19: standardebooks.org/ebooks/victor-hugo/les-miserables/isabel-f-hapgood/text/chapter-5-1-19; shmoop.com/study-guides/les-miserables/part-5-book-1-summary.html"}}, {"id": "RD-075", "kind": "Книга", "who": "Том Сойер, «Приключения Тома Сойера» (Марк Твен, 1876)", "when": "Сент-Питерсберг", "title": "Показания в суде", "ctx": "Ты Том Сойер, озорной мальчишка из городка Сент-Питерсберг на берегу Миссисипи, XIX век. Ночью на кладбище вы с другом Геком Финном, бездомным мальчишкой, видели, как злой бродяга Индеец Джо убил доктора Робинсона. Вину свалили на безобидного пьяницу Маффа Поттера, и теперь ему грозит виселица. Вы с Геком подписали кровью клятву молчать, потому что боитесь Индейца Джо.", "o": ["Дать показания в суде.", "Передать записку судье анонимно.", "Молчать, как обещали.", "Бежать из города, чтобы не быть свидетелем."], "real": 0, "fact": "Том рассказывает всё на суде, и Индеец Джо выпрыгивает в окно.", "res": "Поттера оправдывают, но Том долго боится мести Индейца Джо. Позже тот погибает в пещере.", "src": "М. Твен, «Приключения Тома Сойера», глава 23", "q": "Подвижничество речи — это слова, которые никого не ранят, правдивые, приятные и полезные, а ещё постоянное чтение священных текстов.", "qs": "Бхагавад-гита 17.15", "qv": 2, "alt": [null, "Записка судье анонимна и остаётся без внимания. Судья не обязан верить безымянным письмам, и процесс идёт без неё.", "Ты молчишь, как обещали. Маффа Поттера вешают, а ты живёшь, зная, кто виноват, и боясь, что это узнает кто-то ещё.", "Ты убегаешь из города. Тебя находят через день, но уже в роли беглеца, а не свидетеля."], "fut": [null, "Записка остаётся без внимания. К 1850 процесс идёт без неё. К 1860 ты находишь её в старом сундуке.", "Ты молчишь. К 1855 Маффа Поттера уже нет, а ты не можешь смотреть на виселицу в городе. К 1880 Том — уважаемый судья, который всегда сомневается.", "Ты убегаешь. К 1850 тебя находят в лесу. К 1870 ты — беглец, о котором всё забыли."], "cat": "Литература", "no": 75, "ctx2": "Мафф Поттер никого не трогал и даже бывал добр к мальчишкам. Он сидит в тюрьме, скоро суд, а правду знаете только вы с Геком. Индеец Джо на свободе и уверен, что никто его не видел.", "adult": 0, "vs": "исправлено", "age": 12, "g": ["S", "R", "T", "T"], "gw": ["Правда и справедливость вопреки страху", "Добиться результата, не рискуя собой", "Страх и слепое следование клятве", "Бегство из страха"]}, {"id": "RD-076", "kind": "Книга", "who": "Брут, «Юлий Цезарь» (Уильям Шекспир, 1599)", "when": "Рим, 44 до н. э.", "title": "Заговор против друга", "ctx": "Рим, 44 год до нашей эры, дни перед мартовскими идами. Ты Брут, уважаемый сенатор, республиканец и философ-стоик, убеждённый, что Рим должен оставаться республикой, а не царством. Твой друг Юлий Цезарь, великий полководец и победитель во внутренней войне, стал единовластным правителем и, по слухам, хочет стать царём. Сенаторы, среди которых Кассий, зовут тебя в заговор против него, потому что твоё честное имя придаст их делу законность.", "o": ["Присоединиться к заговору.", "Попытаться убедить Цезаря отказаться от короны.", "Предупредить Цезаря.", "Отказаться и не вмешиваться."], "real": 0, "fact": "Брут присоединился к заговору и нанёс Цезарю удар, объяснив, что любил Рим больше.", "res": "Антоний настраивает толпу против заговорщиков, начинается гражданская война. Брут проигрывает при Филиппах и бросается на меч.", "src": "У. Шекспир, «Юлий Цезарь»", "q": "Делай то, что должно делать: действие лучше бездействия. Если ничего не делать, не удастся даже поддерживать жизнь тела.", "qs": "Бхагавад-гита 3.8", "qv": 2, "alt": [null, "Ты пытаешься убедить Цезаря отказаться от короны. Он улыбается, благодарит и отодвигает тебя от себя.", "Ты предупреждаешь Цезаря. Заговорщики схвачены, но Цезарь становится ещё подозрительнее и окончательно превращается в тирана.", "Ты отказываешься и не вмешиваешься. Заговор проходит без тебя и с меньшим весом, а римляне видят в нём просто убийство."], "fut": [null, "Ты пытаешься убедить Цезаря. К 44 до н. э. он улыбается и отодвигает тебя. К 27 до н. э. Рим — империя с другим именем у власти.", "Ты предупреждаешь Цезаря. К 43 до н. э. заговорщики казнены. К 40 до н. э. Рим — империя без сената, а Цезарь — бог при жизни.", "Ты отказываешься и не вмешиваешься. К 44 до н. э. заговор проходит без тебя. К 30 до н. э. римляне вспоминают его как обыкновенное убийство."], "cat": "Литература", "no": 76, "ctx2": "Ты потомок того Брута, который когда-то изгнал из Рима царей. Антоний, ближайший соратник Цезаря, трижды предлагал ему корону, и Цезарь трижды отказался, но по лицу видно, что ему этого хочется. Кассий уговаривает тебя и подбрасывает письма от якобы простых граждан с призывом спасти Рим.", "adult": 0, "vs": "верно", "age": 12, "g": ["R", "S", "R", "T"], "gw": ["Идеологическая гордость, политическая борьба, убийство друга", "Ненасильственная ясность, попытка спасти обоих", "Привязанность к другу, личная лояльность", "Равнодушие, уход от ответственности"]}, {"id": "RD-077", "kind": "Книга", "who": "Уинстон Смит, «1984» (Джордж Оруэлл, 1949)", "when": "Лондон, Океания", "title": "Комната 101", "ctx": "Ты Уинстон Смит, мелкий чиновник в Лондоне, столице Океании, государства, где правит Партия во главе с вездесущим Старшим Братом и следят за каждым словом и мыслью. Ты тайно возненавидел этот порядок, завёл дневник и полюбил Джулию, с которой встречался украдкой. Вас выдали, и теперь ты в Министерстве любви, где пытают и «перевоспитывают». Боль ты выдержал и Джулию не предал, но следователь О'Брайен, которому ты прежде доверял как единомышленнику, ведёт тебя в Комнату 101, где держат то, чего человек боится больше всего.", "o": ["Предложить вместо себя другого человека, не называя Джулию.", "Закричать, чтобы это сделали с Джулией.", "Попытаться напасть на палача.", "Продолжить молчать и принять крыс."], "real": 1, "fact": "Уинстон закричал: «Сделайте это с Джулией!»", "res": "Его отпускают сломленным. Они с Джулией встречаются и признаются, что предали друг друга. Книга заканчивается тем, что Уинстон любит Старшего Брата.", "src": "Дж. Оруэлл, «1984», часть III", "q": "Надо разобраться, что такое действие, что такое дурной поступок и что такое бездействие: путь поступка тёмен, понять его трудно.", "qs": "Бхагавад-гита 4.17", "qv": 2, "alt": ["Ты называешь другого человека, но О'Брайен уже знает ответ. Он не принимает замены, и страх возвращается.", null, "Ты нападаешь на палача. Охрана обезвреживает тебя за секунду, а крысы остаются на прежнем месте.", "Ты молчишь и принимаешь крыс. Лицо получает ожоги, но Джулия остаётся тем, кого ты не предал. Вряд ли это изменит Океанию, но изменит тебя."], "fut": ["Ты называешь другого человека. О'Брайен уже знает ответ. К 1985 страх возвращается, а Джулия становится частью системы.", null, "Ты нападаешь на палача. Охрана реагирует за секунду. К 1985 слово «бунт» в Океании означает «нападение на персонал».", "Ты молчишь и принимаешь крыс. К 1985 лицо в ожогах, но Джулия остаётся тем, кого ты не предал. К 2050 в Океании говорят: «Он единственный, кто не сломался», и каждый второй прячет это в уме."], "cat": "Литература", "no": 77, "ctx2": "Твой самый большой страх — крысы. Тебе надевают на лицо клетку с голодными крысами, дверца вот-вот откроется. О'Брайен говорит, что клетку можно перенести на другого человека.", "adult": 1, "vs": "верно", "age": 18}, {"id": "RD-078", "kind": "Книга", "who": "Оконкво, «Распалась связь времён» (Чинуа Ачебе, 1958)", "when": "вымышленная деревня Умуофия (народ игбо), Нигерия, конец XIX века", "title": "Мальчик, которого он любил", "ctx": "Ты Оконкво, один из самых известных борцов и воинов деревни Умуофия в Нигерии, XIX век. Всю жизнь ты боишься слабости, потому что твой отец был ленивым неудачником, и ты вырос сильным и жёстким. Три года в твоём доме живёт мальчик Икемефуна, которого соседняя деревня отдала как возмещение за убийство; он зовёт тебя отцом, и ты к нему привязался. Теперь старейшины по воле оракула решили его убить, и мужчины деревни ведут мальчика в лес.", "o": ["Попытаться спасти мальчика и увести из деревни.", "Нанести удар вместе со всеми.", "Уйти из деревни перед казнью.", "Не участвовать в казни."], "real": 1, "fact": "Оконкво нанёс удар, когда мальчик позвал его отцом.", "res": "Смерть Икемефуны преследует Оконкво, а его друг Обиерика осуждает его за участие. История заканчивается его падением и самоубийством после столкновения с колонизаторами.", "src": "Ч. Ачебе, «Распалась связь времён»", "q": "Мудрецом с твёрдым умом называют того, кто не падает духом в несчастье, не жаждет радостей и свободен от страсти, страха и гнева.", "qs": "Бхагавад-гита 2.56", "qv": 2, "alt": ["Ты пытаешься увести мальчика из деревни. Племя считает это бунтом, и вас обоих настигают на тропе.", null, "Ты уходишь из деревни перед казнью. Совесть чиста, но тебя называют трусом, и положение в клане теряется.", "Ты не участвуешь в казни. Племя шепчется о слабости, а Икемефуна погибает от рук других, но ты не слышишь его крика."], "fut": ["Ты пытаешься увести мальчика. К 1890 племя считает это бунтом. К 1900 вы оба без имён, а колонизаторы приходят в пустую деревню.", null, "Ты уходишь из деревни. К 1890 совесть чиста, а тебя называют трусом. К 1920 никто не помнит, откуда ты ушёл.", "Ты не участвуешь. К 1890 племя шепчется о слабости, а Икемефуна погибает от рук других. К 1920 Оконкво — человек, который ждал конца света, но так и не дождался."], "cat": "Литература", "no": 78, "ctx2": "Мальчик думает, что его ведут домой. Старый Эзеуду, уважаемый старейшина, предупредил тебя, что мальчик считает тебя отцом и что тебе не стоит участвовать в его гибели. Ты знаешь, что в деревне ценят твёрдость, и отступить значило бы показаться слабым.", "adult": 1, "vs": "верно", "age": 18, "g": ["S", "T", "T", "T"], "gw": ["Сострадание и защита невинного против толпы", "Страх слабости, слепое подчинение толпе", "Бегство от ответственности", "Отстранение, равнодушие к судьбе мальчика"]}, {"id": "RD-079", "kind": "Книга", "who": "Амир, «Бегущий за ветром» (Халед Хоссейни, 2003)", "when": "Кабул, 1975", "title": "Переулок", "ctx": "Кабул, зима 1975 года, Афганистан пока ещё мирная страна. Ты Амир, двенадцатилетний сын богатого купца, чувствительный мальчик, который хочет заслужить любовь отца. Ты только что выиграл главный турнир воздушных змеев. Хасан, твой друг и слуга, сын слуги вашей семьи и хазареец, представитель презираемого в стране народа, побежал за последним сбитым змеем, чтобы принести тебе трофей.", "o": ["Убежать и ничего не сказать.", "Позвать взрослых.", "Выйти и попытаться защитить друга.", "Бросить в обидчиков камни из укрытия."], "real": 0, "fact": "Амир убежал и никому не рассказал.", "res": "Вина гложет его годами, он отдаляется от Хасана, а позже подставляет его. Через много лет Амир возвращается в Афганистан, чтобы искупить вину.", "src": "Х. Хоссейни, «Бегущий за ветром», главы 7–8", "q": "Человек должен поднимать себя сам и не давать себе падать: ум бывает другом человека, а бывает его врагом.", "qs": "Бхагавад-гита 6.5", "qv": 2, "alt": [null, "Ты зовёшь взрослых. Пока они идут, всё уже заканчивается, а ты становишься тем, кто всё видел и никого не успел позвать вовремя.", "Ты выходишь и пытаешься защитить Хасана. Тебя избивают, но между вами остаётся дружба, а вина не вырастает в тебе на десятилетия.", "Ты бросаешь камни из укрытия. Это ничего не меняет, кроме того, что тебя замечают и бьют вдвое."], "fut": [null, "Ты зовёшь взрослых. К 1975 они приходят слишком поздно. К 2001 ты тот, кто всё видел и никому не рассказал.", "Ты выходишь и защищаешь Хасана. К 1976 тебя избивают, но дружба остаётся. К 2001 нет ни воспоминаний, ни вины, ни книги.", "Ты бросаешь камни из укрытия. К 1975 тебя замечают и бьют вдвое. К 2001 ты ветеран собственной слабости."], "cat": "Литература", "no": 79, "ctx2": "Хасан отличный бегун и самый верный твой друг, готовый ради тебя на всё. Он нашёл змея, но в переулке ему преградил путь Ассеф, старший мальчишка и жестокий хулиган, с приятелями. Хасан отказывается отдать змея, и Ассеф собирается сделать с ним что-то страшное, а ты стоишь за углом и всё видишь.", "adult": 1, "vs": "исправлено", "age": 18, "g": ["T", "S", "S", "R"], "gw": ["Страх, бегство, самообман", "Разумная помощь другу, сострадание", "Самоотверженность, защита друга ценой риска", "Действие издали, чтобы себя оправдать без риска"]}, {"id": "RD-080", "kind": "Книга", "who": "Понтий Пилат, «Мастер и Маргарита» (Михаил Булгаков, 1967)", "when": "Ершалаим, 1 век", "title": "Приговор Иешуа", "ctx": "Ты Понтий Пилат, римский прокуратор Иудеи, суровый военный, в городе Ершалаим в I веке. К тебе привели на суд бродячего философа Иешуа Га-Ноцри. Тебе становится ясно, что он ни в чём не виноват: он говорит, что все люди добры и что любая власть однажды исчезнет. Но на него донесли как на оскорбителя императора Тиберия, а это тяжкое преступление, и если ты оправдаешь Иешуа, донос дойдёт до императора, и ты рискуешь карьерой.", "o": ["Помиловать Иешуа вопреки Синедриону.", "Утвердить приговор, понимая, что он невиновен.", "Передать дело императору.", "Отпустить Иешуа тайно."], "real": 1, "fact": "Пилат утвердил смертный приговор.", "res": "Иешуа казнят, и Пилата мучает совесть. По роману, он на века обречён сидеть на каменном кресле и ждать прощения, а вина названа «трусостью».", "src": "М. Булгаков, «Мастер и Маргарита», главы 2 и 26", "q": "Упорство, с которым глупец не расстаётся со сном, страхом, печалью, унынием и самодовольством, называют упорством тьмы, Партха.", "qs": "Бхагавад-гита 18.35", "qv": 2, "alt": ["Ты милуешь Иешуа вопреки Синедриону. Сенат читает донос, и карьера заканчивается в ссылке. Но по роману прокуратор, возможно, спит спокойно.", null, "Ты передаёшь дело императору. Рим отвечает через месяцы, а Иешуа сидит в темнице, пока ждёт решения.", "Ты отпускаешь Иешуа тайно. Каифа знает всё, и донос ложится на стол быстрее, чем освобождённый уходит из города."], "fut": ["Ты милуешь Иешуа. К 33 году сенат читает донос, и карьера кончается ссылкой. К 2000 роман называют иначе, а в Ершалаиме ставят памятник Пилату.", null, "Ты передаёшь дело императору. К 33 году Рим отвечает через месяцы. Иешуа ждёт, а к 2000 в учебниках у этой истории другое число.", "Ты отпускаешь Иешуа тайно. К 33 году Каифа знает всё, и донос ложится на стол быстрее. К 2000 Пилат — предатель в глазах обеих сторон."], "cat": "Литература", "no": 80, "ctx2": "У тебя мучительная мигрень, и допрос тебя измотал. Приговор Иешуа уже вынес Малый Синедрион, иудейский совет, и тебе остаётся утвердить его или отменить. Первосвященник Каифа настаивает на казни: по обычаю к празднику можно помиловать только одного осуждённого, и Каифа просит помиловать не Иешуа.", "adult": 0, "vs": "верно", "age": 12, "g": ["S", "T", "T", "R"], "gw": ["Справедливость вопреки угрозе карьере", "Страх, самообман, предательство совести", "Перекладывание ответственности на другого", "Спасает карьеру и контролирует результат втайне"], "swap": {"role": "Каифа, первосвященник", "title": "Помилование к празднику", "ctx": "В романе Булгакова ты — первосвященник Иосиф Каифа, глава иудейского Синедриона в Ершалаиме. Накануне Пасхи тебя вызывает римский прокуратор Понтий Пилат. Малый Синедрион уже приговорил к смерти бродячего проповедника Иешуа Га-Ноцри, а в тюрьме ждёт казни мятежник и убийца Вар-равван. В честь праздника Синедрион вправе попросить помиловать одного из осуждённых, и Пилат хочет услышать твой выбор.", "o": ["Попросить Пилата помиловать Иешуа Га-Ноцри.", "Попросить помиловать Вар-раввана.", "Ни о ком не просить: пусть оба понесут наказание по закону.", "Предоставить выбор самому Пилату и не называть имени."], "real": 1, "fact": "По роману, ты назвал Вар-раввана: Синедрион просит освободить его. Пилат переспросил ещё дважды, но ты каждый раз отвечал то же самое.", "res": "Пилат понял, что спасти Иешуа не удалось, и предупредил тебя, что отныне покоя тебе не будет. Приговор был утверждён: Вар-раввана отпустили, а Иешуа казнили. Булгаков показывает, что вина лежит не на всём народе, а на тех руководителях, которые ради своих выгод управляли толпой.", "src": "М. Булгаков, «Мастер и Маргарита», гл. 2 «Понтий Пилат»; разбор сцены: litcharts.com/lit/the-master-and-margarita/chapter-2-pontius-pilate, m.masterandmargarita.eu/ru/03karakters/kajafas.html"}}, {"id": "RD-081", "kind": "Мультфильм", "who": "Симба, львёнок, герой мультфильма «Король Лев» (1994)", "when": "Саванна Прайд-Лэндс", "title": "Убежать или вернуться", "ctx": "Ты Симба, маленький львёнок, сын льва-короля Муфасы и наследник трона, живёшь в Прайд-Лэндс в африканской саванне. Твой отец только что погиб у тебя на глазах: он бросился спасать тебя, когда в ущелье ворвалось стадо гну. Теперь рядом оказывается твой дядя Шрам, младший брат Муфасы, говорит, что отец погиб по твоей вине, и велит бежать и никогда не возвращаться. Тебе страшно и стыдно.", "ctx2": "Твоя мама, львица Сараби, и вся стая ещё ничего не знают. Ты пытался разбудить отца, но он не встаёт. Шрам говорит так, будто ему про тебя всё известно, а ты не знаешь, можно ли ему верить и кому рассказать.", "o": ["Остаться рядом с папой и ждать.", "Пойти к маме и всё ей рассказать.", "Убежать из Прайд-Лэндс.", "Пойти в ущелье и звать папу."], "real": 2, "fact": "Симба послушался Шрама и убежал из родных земель.", "res": "В джунглях он подружился с Тимоном и Пумбой и жил беззаботно, как научили друзья. Спустя годы подруга Нала нашла его и позвала домой, а Рафики помог понять, что прошлое можно принять. Симба вернулся и победил Шрама.", "src": "Мультфильм «Король Лев» (1994)", "q": null, "qs": null, "qv": 0, "alt": ["Ты стоишь у папы, пока не наступает ночь. Тебя находят гиены, и Шрам снова говорит те же слова.", "Мама Сараби обнимает тебя и объясняет, что никто не виноват. Шрам ничего не может поделать, и ты остаёшься дома, но Прайд-Лэнд всё равно живёт при плохом правителе.", null, "Ты зовёшь папу, но ущелье отвечает эхом. К тебе подходит Шрам, и оставаться там уже не безопасно."], "fut": ["К тому времени, как ты вырос, ущелье стало самым тихим местом в саванне. Ты ждёшь, а королевство тем временем ждёт тебя.", "Лет через десять ты узнаёшь, что молчание дома стоило тебе отваги. Ты хорошо знаешь маму, но Прайд-Лэнд так и не увидел справедливого короля.", null, "Через год в ущелье остаётся только эхо, а ты уже не можешь убежать, потому что поздно."], "cat": "Мультфильмы", "no": 81, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 8, "scene": "🌅🦁🌍", "stk": "🦁", "stkn": "Львёнок", "parent": "Почему Симба решил, что виноват он? Как думаешь, правда ли это? Что можно сделать, когда тебе страшно и стыдно, чтобы не убегать? Расскажите друг другу, когда вам хотелось убежать от трудного разговора.", "ctxk": "Ты маленький львёнок Симба, сын короля Муфасы. Случилось страшное: по ущелью промчалось большое стадо гну, и папа погиб. Ты стоишь рядом, тебе очень грустно и страшно. Приходит дядя Шрам, говорит, что во всём виноват ты, и велит бежать и никогда не возвращаться. Ты не знаешь, что делать и кому можно рассказать.", "resk": "В джунглях Симбу нашли весёлые друзья Тимон и Пумба и научили жить без забот. Прошли годы, Симба вырос. Однажды подруга Нала нашла его и позвала домой: без него там стало плохо. Мудрый Рафики помог Симбе понять, что от прошлого нельзя убегать. Симба вернулся и победил Шрама.", "g": ["T", "S", "T", "R"], "gw": ["Отрицание и бездействие, самообман", "Честность, обращение к близким за правдой", "Бегство из страха и стыда", "Привязанность, желание вернуть утраченное"]}, {"id": "RD-082", "kind": "Мультфильм", "who": "Эльза, принцесса, героиня мультфильма «Холодное сердце» (2013)", "when": "замок Эренделл", "title": "Остаться или уйти", "ctx": "Ты Эльза, старшая принцесса и новая королева Эренделла, северного королевства, и с рождения умеешь создавать лёд и снег. Однажды в детстве ты случайно ранила младшую сестру Анну и с тех пор скрывала силу и держалась от всех подальше, даже от неё. Сегодня день твоей коронации, в замке праздник. Ты поссорилась с Анной при гостях, из твоих рук вырвался лёд, и все увидели твою силу и отшатнулись.", "ctx2": "Ссора вышла из-за того, что Анна, едва познакомившись с принцем Хансом, хотела выйти за него замуж, а ты отказалась благословить. Сама Анна не помнит, что у тебя есть магия. Ты боишься, что рядом с людьми опасна для них.", "o": ["Попросить сестру Анну пойти с тобой.", "Остаться и объяснить всем, что случилось.", "Убежать в горы.", "Запереться в своей комнате, как раньше."], "real": 2, "fact": "Эльза убежала в горы и построила там ледяной дворец.", "res": "Эренделл накрыла вечная зима, а Анна отправилась искать сестру. Анна проявила любовь и спасла сестру, а Эльза поняла, что любовь помогает управлять силой, и растопила зиму.", "src": "Мультфильм «Холодное сердце» (2013)", "q": null, "qs": null, "qv": 0, "alt": ["Анна идёт вместе с Эльзой, но по дороге горы оказываются слишком суровыми для двоих. Ночью они возвращаются, а зима уже начинается в долине.", "Эльза объясняет, но люди продолжают бояться. К вечеру о ней говорят все, и коронация превращается в суд.", null, "Дверь запирается, а за ней слышен шум. Лёд расползается по комнате, и Анна стучится всё громче."], "fut": ["Анна и Эльза вместе, но Эренделл остаётся без правителей, и разговоры о том, что случилось, не стихают много лет.", "Через год в замке по-прежнему холодно, а двери заперты. Эльза научилась скрывать лёд, но не научилась жить с ним.", null, "Лёд заполняет комнату, потом коридоры, потом весь замок. Через десять лет Эренделл называют «Ледяным королевством»."], "cat": "Мультфильмы", "no": 82, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "❄️👑🏔️", "stk": "❄️", "stkn": "Снежинка", "parent": "Почему Эльза испугалась собственной силы? Что чувствуют люди, когда прячут что-то о себе? Спросите ребёнка, как он поддерживает того, кто боится, и как просит о поддержке сам.", "ctxk": "Ты принцесса Эльза, и у тебя есть тайна: ты умеешь создавать лёд и снег. Много лет ты это скрывала. На большом празднике в день коронации ты поссорилась с Анной, и из твоих рук вырвался лёд. Зал покрылся льдом, люди испугались. Тебе кажется, что рядом с людьми ты опасна. Дверь открыта, а за ней горы.", "resk": "В огромном ледяном дворце Эльзе стало спокойно. Но королевство Эренделл тем временем накрыла вечная зима. Анна отправилась искать сестру. Анна проявила любовь и спасла сестру. А Эльза поняла, что любовь помогает управлять силой, и растопила зиму. В Эренделле снова стало тепло.", "g": ["R", "S", "T", "T"], "gw": ["Привязанность, желание удержать сестру рядом", "Правда и ответственность перед людьми", "Бегство из страха", "Прятаться и избегать, как раньше"]}, {"id": "RD-083", "kind": "Мультфильм", "who": "Вуди, ковбой-игрушка, герой мультфильма «История игрушек» (1995)", "when": "дом Сида", "title": "Бросить или спасти", "ctx": "Ты Вуди, игрушечный ковбой, шериф и любимая игрушка мальчика Энди, и привык быть первым среди игрушек в его комнате. Всё изменилось, когда Энди подарили Базза Лайтера, космического рейнджера, который считает себя настоящим героем; ты ревновал, и из-за вашей ссоры вы оба потерялись и попали в дом соседского мальчика Сида. Сид любит ломать и взрывать игрушки и привязал Базза к ракете, чтобы запустить её. Ты можешь попытаться выбраться отсюда один.", "ctx2": "Из окна ты видишь, что семья Энди грузит вещи в фургон: они скоро переезжают, и если не успеть, вы потеряете Энди. Выбраться из дома Сида опасно, а спасать Базза значит потерять время, которого почти нет. К тому же вы с Баззом только что поссорились.", "o": ["Убежать домой и не оглядываться.", "Позвать Сида и попросить вернуть игрушку.", "Сделать вид, что тебя здесь нет.", "Спасти Базза."], "real": 3, "fact": "Вуди пришёл на помощь Баззу, хотя они недавно поссорились.", "res": "Вместе с другими игрушками Сида они сбежали из комнаты и догнали фургон на ракете. Вуди и Базз стали друзьями, а Энди получил обоих.", "src": "Мультфильм «История игрушек» (1995)", "q": null, "qs": null, "qv": 0, "alt": ["Вуди убегает и догоняет фургон один. Через несколько дней в комнате Энди всё тихо, а Базз так и не вернулся.", "Сид не слушает игрушек. Он только смеётся, и Базз улетает на ракете без Вуди.", "Вуди прячется за коробкой. Сид уносит Базза, и Вуди слышит смех из соседней комнаты.", null], "fut": ["Через год в комнате Энди появляется новая игрушка, а Вуди по ночам вспоминает ракету и пустое место на полке.", "Через неделю Сид забывает про Базза, а Вуди забывает про Сида. История заканчивается, а дружбы нет.", "Через десять лет Вуди рассказывает новым игрушкам, как однажды промолчал, и все молчат вместе с ним.", null], "cat": "Мультфильмы", "no": 83, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🤠🚀🧸", "stk": "🤠", "stkn": "Ковбой", "parent": "Вуди был немного завистлив, но всё равно помог. Обсудите: можно ли помочь тому, с кем поссорился? Бывало ли, что ребёнок завидовал другу? Как это прошло?", "ctxk": "Ты ковбой Вуди, любимая игрушка мальчика Энди. Недавно у Энди появился новый друг, космический рейнджер Базз, и ты немного ему завидовал. Вы поссорились, и оба оказались в комнате злого мальчика Сида. Сид привязал Базза к ракете и хочет её запустить. Ты можешь убежать к Энди: его семья скоро переезжает.", "resk": "Вместе с другими необычными игрушками Сида Вуди и Базз выбрались из комнаты и бросились догонять фургон Энди. Им помогла та самая ракета! Вуди и Базз помирились и стали настоящими друзьями, а Энди получил обеих любимых игрушек.", "g": ["T", "R", "T", "S"], "gw": ["Бегство и равнодушие к другу", "Хочет вернуть своё, наивно полагаясь на выгоду", "Прятаться, избегая ответственности", "Самоотверженность, преодоление ревности"]}, {"id": "RD-084", "kind": "Мультфильм", "who": "Марлин, рыба-клоун, герой мультфильма «В поисках Немо» (2003)", "when": "Большой Барьерный риф", "title": "Идти в океан", "ctx": "Ты Марлин, рыба-клоун, живёшь с сыном Немо в коралловом рифе у берегов Австралии и всю жизнь боишься открытого моря. Когда-то хищная рыба съела твою жену и почти всю икру, остался один Немо с маленьким плавником, поэтому ты оберегаешь его от всего. Сегодня Немо назло тебе подплыл к лодке, и его схватил водолаз и увёз. Теперь ты должен решить, остаться на привычном рифе или отправиться в бескрайний океан, где ты никогда не бывал.", "ctx2": "Рядом с тобой оказывается Дори, добродушная рыбка, которая через несколько секунд забывает всё, что с ней было. Океан полон хищников, а у тебя нет ни карты, ни опыта.", "o": ["Поплыть за лодкой, но не дальше соседнего рифа.", "Отправиться в океан искать сына.", "Попросить других рыб поискать вместо тебя.", "Ждать на рифе: вдруг Немо вернётся сам."], "real": 1, "fact": "Марлин поплыл в открытый океан вместе с Дори, хотя ему было очень страшно.", "res": "Они встретили акул, медуз и морских черепах и добрались до Сиднея. Тем временем Немо с новыми друзьями из аквариума придумал, как сбежать. Отец и сын встретились и стали доверять друг другу.", "src": "Мультфильм «В поисках Немо» (2003)", "q": null, "qs": null, "qv": 0, "alt": ["Ты доплываешь до соседнего рифа и там останавливаешься. Лодки давно нет, а океан смотрит на тебя издалека.", null, "Другие рыбы обещают помочь, но у каждой свои дела. Поиски заканчиваются, не начавшись.", "Ты ждёшь на рифе, но Немо не возвращается. К концу лета ты знаешь, что решение можно было принять раньше."], "fut": ["Ты остаёшься у границы рифа. Через много лет рассказываешь внукам про океан, в котором так и не побывал.", null, "К осени о поисках уже никто не вспоминает. Ты по-прежнему боишься океана, и теперь ещё и стыдишься.", "Через год на рифе тихо. Ты живёшь осторожно, а в аквариуме Немо ждёт каждый день."], "cat": "Мультфильмы", "no": 84, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🐠🌊🐢", "stk": "🐠", "stkn": "Рыбка", "parent": "Чего боялся Марлин и почему всё-таки поплыл? Что помогает быть смелым, когда страшно? Вспомните вместе случай, когда ребёнок сделал что-то, чего боялся.", "ctxk": "Ты рыба-клоун Марлин, и ты очень осторожный. Ты давно потерял почти всю семью, поэтому изо всех сил оберегаешь сына Немо. Но однажды Немо унёс водолаз на лодке. До него тысячи километров, а ты никогда не уплывал далеко от дома. Рядом оказалась добрая рыбка Дори, которая быстро всё забывает.", "resk": "По дороге Марлин и Дори встретили акул, медуз и морских черепах и добрались до Сиднея. А Немо тем временем вместе с новыми друзьями из аквариума придумал, как сбежать. Отец и сын нашли друг друга. Марлин понял, что мир не такой страшный, а Немо понял, как сильно любит его папа.", "g": ["T", "S", "T", "T"], "gw": ["Страх, полумера в пределах привычного", "Долг отца, преодоление страха ради сына", "Перекладывание ответственности на других", "Пассивное ожидание, страх и бездействие"]}, {"id": "RD-085", "kind": "Мультфильм", "who": "Аладдин, герой мультфильма «Аладдин» (1992)", "when": "дворец в Аграбе", "title": "Последнее желание", "ctx": "Ты Аладдин, бедный парень с улиц города Аграба, который достал из пещеры волшебную лампу с Джинном, исполняющим три желания. Первым желанием ты стал принцем Али, чтобы завоевать принцессу Жасмин, дочь султана, ведь по закону она может выйти только за принца. Второе желание ушло на твоё спасение, и теперь осталось последнее. Жасмин уже знает, что ты не принц.", "ctx2": "Джинн, дух лампы, служит хозяевам много лет и мечтает о свободе, но освободить его может только желание хозяина. Злой визирь Джафар, пытавшийся захватить власть, побеждён.", "o": ["Пожелать свободы Джинну.", "Пожелать остаться принцем навсегда.", "Пожелать, чтобы Жасмин полюбила тебя.", "Пожелать горы золота."], "real": 0, "fact": "Аладдин освободил Джинна, хотя мог бы пожелать вернуть себе звание принца.", "res": "Джинн стал свободным и отправился путешествовать. Султан изменил закон, и принцесса могла выйти замуж за того, кого полюбила. Аладдин и Жасмин остались вместе.", "src": "Мультфильм «Аладдин» (1992)", "q": null, "qs": null, "qv": 0, "alt": [null, "Ты остаёшься принцем. Джинн по-прежнему в лампе, а дворец полон людей, но ты каждый вечер слышишь, как Джинн вздыхает.", "Жасмин улыбается, но не понимает, что чувствует. Ты видишь, что желание сделало чужим тебя самого.", "Горы золота лежат во дворе. Через неделю золото теряет вкус, а Джафар возвращается за лампой."], "fut": [null, "Через десять лет ты живёшь во дворце, но каждую ночь вспоминаешь о лампе в дальнем углу. Султан хвалит тебя, а друзья удивляются, что ты стал молчаливым.", "Через год Жасмин видит, что принц и любовь — разные вещи. Ты узнаёшь это слишком поздно.", "Золото кончается раньше, чем ты думал. Через год ты снова на рынке, но уже без друга-Джинна."], "cat": "Мультфильмы", "no": 85, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🪔✨🏜️", "stk": "🪔", "stkn": "Лампа", "parent": "Что важнее: получить желаемое или поступить честно с другом? Обсудите, что значит «держать слово», и вспомните случай, когда ребёнок выбирал между «хочу» и «правильно».", "ctxk": "Ты Аладдин. Раньше ты жил на улице, а потом достал в пещере волшебную лампу. В ней живёт добрый Джинн, который исполняет три желания. Первым желанием ты стал принцем, второе потратил, чтобы спастись. Султан и принцесса Жасмин думают, что ты настоящий принц. Осталось последнее желание. А Джинн мечтает о свободе, и освободить его можешь только ты.", "resk": "Джинн стал свободным и отправился путешествовать по миру. Султан изменил закон, и принцесса получила право выйти замуж за того, кого полюбит. Аладдин и Жасмин остались вместе.", "g": ["S", "R", "R", "R"], "gw": ["Самоотверженность, свобода другому без выгоды", "Привязанность к статусу и положению", "Желание контролировать чужое чувство", "Жажда богатства"]}, {"id": "RD-086", "kind": "Мультфильм", "who": "Мулан, героиня мультфильма «Мулан» (1998)", "when": "деревня в Китае", "title": "Место отца", "ctx": "Ты Мулан, девушка из семьи Фа в деревне в старом Китае, и тебе плохо даётся роль послушной невесты. Император собирает войско против вторгшихся гуннов, и из каждой семьи должен пойти один мужчина. Твой отец Фа Чжоу, ветеран прошлых войн, болен, хромает и слаб, а братьев у тебя нет. Девушкам служить нельзя, но если пойдёт отец, он вряд ли вернётся.", "ctx2": "Приказ принесли в вашу деревню, и имя отца записали в списки. За обман в армии, тем более за то, что женщина выдаёт себя за мужчину, грозит суровое наказание.", "o": ["Ничего не делать: так велит закон.", "Тайком уйти вместо отца, переодевшись мужчиной.", "Попросить, чтобы отца освободили из-за болезни.", "Попросить соседа пойти вместо отца."], "real": 1, "fact": "Мулан ночью срезала волосы, взяла доспехи и ускакала вместо отца.", "res": "Она стала хорошим воином и помогла остановить гуннов. Когда тайна раскрылась, её хотели прогнать, но Мулан спасла императора. Император поблагодарил её, а отец гордился дочерью.", "src": "Мультфильм «Мулан» (1998)", "q": null, "qs": null, "qv": 0, "alt": ["Отец уходит в армию. Дома остаются только мама и ты, и ты каждый день думаешь, жив ли он.", null, "Чиновник не слушает просьбу. Отец всё равно уходит, а ты слышишь, как он кашляет за воротами.", "Сосед согласен, но потом отказывается. К утру отец уже едет с отрядом."], "fut": ["Через год отец возвращается, но уже не тот. Ты помнишь ту ночь у ворот, когда могла что-то изменить.", null, "Просьба остаётся без ответа. Через год ты слышишь про битвы и не знаешь, где отец.", "Через десять лет сосед рассказывает, как сам хотел пойти, но никто его не спросил."], "cat": "Мультфильмы", "no": 86, "adult": 0, "age": 6, "vs": "верно", "kmin": 8, "scene": "🌸⚔️🐎", "stk": "🌸", "stkn": "Цветок сливы", "parent": "Почему Мулан пошла вместо отца? Можно ли ради близких идти на риск? Поговорите о том, что значит «смелость» и чем она отличается от безрассудства, и как быть, когда приходится обманывать ради важного.", "ctxk": "Ты Мулан и живёшь в деревне в Китае. Император объявил: в армию должен пойти один мужчина из каждой семьи. Твой отец болен и слаб, а брата у тебя нет. Девочкам служить в армии нельзя, а за обман в армии грозит суровое наказание. Но если отец уйдёт на войну, ему будет очень тяжело.", "resk": "Мулан стала хорошим воином и помогла остановить гуннов. Когда правда раскрылась, её хотели прогнать, но Мулан спасла императора. Император поблагодарил её, а отец очень ею гордился.", "g": ["T", "S", "S", "T"], "gw": ["Слепое подчинение, бездействие", "Самоотверженность, защита отца ценой риска", "Честный законный путь ради отца", "Перекладывание ответственности на соседа"]}, {"id": "RD-087", "kind": "Мультфильм", "who": "Чудовище, герой мультфильма «Красавица и Чудовище» (1991)", "when": "замок", "title": "Отпустить Белль", "ctx": "Ты Чудовище, когда-то принц, которого колдунья превратила в зверя за гордость и жестокость; твои слуги стали ожившими предметами. Заклятие снимется, только если кто-то полюбит тебя до того, как упадёт последний лепесток волшебной розы. Белль, девушка из соседней деревни, осталась в твоём замке вместо своего отца и недавно начала к нему привыкать. Сейчас она увидела в волшебном зеркале, что отец заболел и ему нужна помощь.", "ctx2": "Лепестков остаётся мало, и если Белль уйдёт, она, возможно, не вернётся, а ты навсегда останешься зверем. Ты понимаешь, что она стала тебе дорога и что решать здесь можешь только ты, хозяин замка.", "o": ["Пойти вместе с Белль.", "Попросить Белль пообещать вернуться.", "Оставить Белль в замке и запереть дверь.", "Отпустить Белль к отцу."], "real": 3, "fact": "Чудовище отпустило Белль к отцу и подарило ей волшебное зеркало.", "res": "Гастон повёл горожан на замок и ранил Чудовище. Белль вернулась и сказала, что любит его. Заклятие снялось, и Чудовище снова стало принцем.", "src": "Мультфильм «Красавица и Чудовище» (1991)", "q": null, "qs": null, "qv": 0, "alt": ["Ты идёшь с Белль, но жители деревни пугаются и прогоняют вас. Белль остаётся с отцом, а ты возвращаешься в замок один.", "Белль обещает, но по дороге передумывает. Ты ждёшь у ворот, а она не приходит.", "Дверь заперта, и Белль больше не говорит с тобой. Лепестки падают, а в замке тихо.", null], "fut": ["Через десять лет люди в деревне рассказывают страшную историю о Чудовище, которого никто не полюбил.", "Через год Белль живёт с отцом, а в замке никто не ждёт гостей.", "Через год замок стоит пустой. Лепестки опали, а роза стала сухой.", null], "cat": "Мультфильмы", "no": 87, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🌹🏰🪞", "stk": "🌹", "stkn": "Роза", "parent": "Почему отпустить трудно, если любишь? Что значит «любить, не удерживая»? Спросите ребёнка, как он понимает свободу, и поговорите о том, как быть, когда друг хочет уйти.", "ctxk": "Ты Чудовище и живёшь в заколдованном замке. Заклятие снимется, только если кто-то полюбит тебя до того, как опадёт последний лепесток волшебной розы. В замке живёт Белль. В волшебном зеркале она увидела, что её папа заболел и ему нужна помощь. Если ты отпустишь её, она может не вернуться.", "resk": "Потом Гастон с горожанами напал на замок, и Чудовище было ранено. Белль вернулась, поняла, что любит его, и сказала ему об этом. Заклятие снялось, и Чудовище снова стало принцем.", "g": ["R", "R", "T", "S"], "gw": ["Привязанность, желание контролировать исход", "Держится за результат, ждёт возврата", "Страх потери, принуждение", "Сострадание, отпускает без привязанности к плодам"]}, {"id": "RD-088", "kind": "Мультфильм", "who": "Моана, героиня мультфильма «Моана» (2016)", "when": "остров Мотунуи", "title": "За рифом", "ctx": "Ты Моана, дочь вождя Туи, живёшь на острове Мотунуи в Тихом океане, и однажды тебе предстоит стать вождём. С детства тебя тянет к морю, но отец запрещает выходить за риф и говорит, что там смерть. А на острове всё хуже: рыбы всё меньше, кокосы болеют, и никто не знает почему. Бабушка Тала, твоя самая близкая, уверяет, что океан сам тебя выбрал.", "ctx2": "Тала рассказала тебе тайну: твои предки были великими мореплавателями, но давно перестали ходить в открытое море. Выйти за риф значит нарушить слово отца и рискнуть жизнью, но если остаться, остров может погибнуть.", "o": ["Слушаться отца и остаться на острове.", "Тайком выйти в море на лодке.", "Попросить отца разрешить выйти в море.", "Попросить Мауи или кого-то найти выход."], "real": 1, "fact": "Моана взяла лодку из пещеры предков и поплыла за риф, хотя отец запрещал.", "res": "Она нашла полубога Мауи и вместе с ним вернула сердце острова Те Фити. Остров ожил, Моана стала вождём, а её народ снова начал плавать по морю.", "src": "Мультфильм «Моана» (2016)", "q": null, "qs": null, "qv": 0, "alt": ["Моана остаётся на острове. Рыбы становится меньше, и через год люди вспоминают слова бабушки.", null, "Отец отказывает, но мягко. Моана ждёт, а океан ждёт вместе с ней.", "Моана просит помощи у жителей, но никто не знает, где искать Мауи."], "fut": ["Через несколько лет остров слабеет, а лодки стоят у берега. Моана смотрит на горизонт и ждёт.", null, "Отец не соглашается, а время идёт. К осени остров почти пуст.", "Через год люди уходят с острова, а Моана остаётся одной на берегу."], "cat": "Мультфильмы", "no": 88, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "⛵🌊🌺", "stk": "⛵", "stkn": "Лодка", "parent": "Моана нарушила запрет отца. Когда можно нарушить правило, а когда нет? Обсудите, как говорить родителям, что тебе важна мечта, и как они могут помочь.", "ctxk": "Ты Моана, дочь вождя острова. Тебя тянет к морю, но папа запрещает плавать за риф: там опасно. На острове стало мало рыбы, а кокосы заболели. Бабушка Тала говорит, что океан выбрал именно тебя. Лодка стоит на берегу.", "resk": "Моана нашла полубога Мауи, и вместе с ним они вернули сердце острова Те Фити. Остров снова ожил. Моана стала вождём и вернула своему народу мореплавание.", "g": ["T", "R", "S", "T"], "gw": ["Слепое подчинение, отказ от призвания", "Импульсивный бунт, жажда моря", "Честный путь, уважение и ясность", "Перекладывание ответственности на других"]}, {"id": "RD-089", "kind": "Мультфильм", "who": "Карл Фредриксен, герой мультфильма «Вверх» (2009)", "when": "в небе над Южной Америкой", "title": "Дом или друг", "ctx": "Ты Карл Фредриксен, пожилой вдовец, бывший продавец воздушных шаров. Вы с женой Элли всю жизнь мечтали попасть к Райскому водопаду в Южной Америке, но так и не собрались, и теперь ты поднял на тысячах шаров свой дом, в котором всё напоминает о ней. С тобой оказался восьмилетний скаут Рассел, случайно очутившийся на твоём крыльце. Мальчик подружился с редкой гигантской птицей Кевином, а исследователь Мюнц, охотившийся за ней, забрал и птицу, и мальчика.", "ctx2": "Мюнц известен как исследователь, которого вы с Элли когда-то считали героем, а теперь он готов на всё ради своей добычи. Дом тяжёлый, а дирижабль Мюнца уходит всё дальше. С Расселом ты познакомился недавно и совсем не мечтал о таком спутнике.", "o": ["Улететь к водопаду и забыть про злодея.", "Попросить Мюнца отпустить Рассела.", "Выбросить вещи и лететь за Расселом.", "Позвать на помощь по рации и ждать."], "real": 2, "fact": "Карл выбросил из дома мебель и вещи, чтобы дом стал легче, и бросился спасать Рассела и Кевина.", "res": "Он спас мальчика и птицу, а дом потерял. Позже понял, что главное в жизни — люди рядом. Карл стал Расселу как дедушка.", "src": "Мультфильм «Вверх» (2009)", "q": null, "qs": null, "qv": 0, "alt": ["Дом долетает до водопада, но Карл сидит на крыльце один. Через неделю он видит, что Рассел всё ещё там, среди облаков.", "Мюнц смеётся и не отпускает. Карл остаётся без дома и без друга.", null, "Рация шипит, ответа нет. Карл ждёт, а Мюнц уводит Кевина всё дальше."], "fut": ["Через год дом стоит у водопада, а в комнате тихо. Карл часто смотрит в окно.", "Через год Карл помнит только то, что хотел сказать и не сказал.", null, "Через десять лет Рассел рассказывает, как однажды не дождался помощи."], "cat": "Мультфильмы", "no": 89, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 8, "scene": "🎈🏠☁️", "stk": "🏠", "stkn": "Домик", "parent": "Что для Карла было дороже: дом с воспоминаниями или друг? Поговорите о том, что вещи хранят память, но людей заменить нельзя, и о том, как ребёнок бережёт то, что ему дорого.", "ctxk": "Ты Карл, добрый старичок. Твой дом летит по небу на воздушных шарах и хранит память о твоей жене Элли. Ты всю жизнь мечтал отвезти его к Райскому водопаду, как вы с Элли обещали друг другу. Но злодей Мюнц забрал птицу Кевина и твоего маленького друга Рассела. Дом тяжёлый, а время идёт.", "resk": "Благодаря этому Карл спас и мальчика, и птицу, но дом потерял. Карл понял, что главное в жизни не вещи, а люди рядом. А для Рассела он стал почти дедушкой.", "g": ["R", "T", "S", "T"], "gw": ["Привязанность к мечте и памяти, личная цель", "Наивное бездействие без риска", "Отказ от привязанности ради друга", "Бегство от ответственности, ожидание"]}, {"id": "RD-090", "kind": "Мультфильм", "who": "Иккинг, герой мультфильма «Как приручить дракона» (2010)", "when": "остров Олух", "title": "Дракон в сети", "ctx": "Ты Иккинг, хилый и неуклюжий подросток, сын вождя викингов Стоика, живёшь на острове Олух, где драконы то и дело нападают на деревню. Все вокруг мечтают стать драконоборцами, и отец хочет видеть таким и тебя, но пока не получается. После ночного налёта ты находишь в лесу запутавшуюся в верёвках Ночную Фурию, самого редкого и опасного дракона, которого сбил твоим изобретением. У тебя в руке нож, и ты можешь стать героем деревни.", "ctx2": "Убить такого дракона значит наконец заслужить уважение отца и всей деревни. Но дракон беспомощен, он смотрит прямо на тебя, и в его глазах ты видишь страх.", "o": ["Рассказать отцу и ждать решения.", "Освободить дракона.", "Убить дракона и стать героем.", "Уйти и сделать вид, что не нашёл дракона."], "real": 1, "fact": "Иккинг не смог убить дракона и отпустил его.", "res": "Он подружился с драконом и назвал его Беззубик. Иккинг узнал, что драконы не такие страшные, и убедил всех викингов жить с ними в мире. Они вместе победили Красную Смерть.", "src": "Мультфильм «Как приручить дракона» (2010)", "q": null, "qs": null, "qv": 0, "alt": ["Стоик собирает совет. Дракона уводят на арену, и Иккинг понимает, что всё могло быть иначе.", null, "Нож опускается, и Иккинг становится героем. Но ночью он слышит рёв, а вокруг тихо.", "Иккинг уходит. Дракон остаётся один, а викинги так и не узнают, что драконы бывают добрыми."], "fut": ["Через десять лет арена полна, а в небе пусто.", null, "Через год в деревне больше нет драконов, но и друзей среди них нет. Иккинг никогда не сказал, что хотел.", "Через год все забывают про Фурию, кроме Иккинга."], "cat": "Мультфильмы", "no": 90, "adult": 0, "age": 6, "vs": "исправлено", "kmin": 6, "scene": "🐉🔥⛰️", "stk": "🐉", "stkn": "Дракон", "parent": "Иккинг мог стать героем, но выбрал не сражаться. Что значит быть смелым по-настоящему? Обсудите, как сказать «нет», когда все ждут другого, и как узнавать новое вместо того, чтобы бояться.", "ctxk": "Ты Иккинг, сын вождя викингов. Ты не очень сильный и немного неуклюжий. Ты сбил самого опасного дракона, Ночную Фурию, и он лежит в лесу, запутавшись в верёвках. Ты хочешь стать героем, как все викинги. В руке у тебя нож. Но дракон смотрит на тебя, и ты видишь в его глазах страх.", "resk": "Иккинг подружился с драконом и назвал его Беззубик. Иккинг узнал, что драконы вовсе не такие страшные, и убедил викингов жить с ними в мире. Вместе они победили огромного дракона по имени Красная Смерть.", "g": ["T", "S", "R", "T"], "gw": ["Перекладывание решения на отца", "Сострадание, поступок вопреки ожиданиям", "Жажда славы и признания", "Самообман, уход от ответственности"]}, {"id": "RD-091", "kind": "Сериал", "who": "Эддард (Нед) Старк, «Игра престолов» (HBO, 1 сезон, 9 серия)", "when": "Королевская Гавань", "title": "Признание ради дочерей", "ctx": "Ты Эддард (Нед) Старк, лорд Севера и правая рука короля Роберта. Король умер, и ты узнал страшную тайну: его дети на самом деле не его, их отец ― брат королевы Серсеи. Ты хотел рассказать правду, но Серсея успела захватить власть, и тебя посадили в тюрьму как предателя. Новый король ― её сын, юный Джоффри.", "ctx2": "Придво
